name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-smoke:
    name: Lint & setup smoke (Ubuntu, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # "shell: bash" runs each step with -e -o pipefail; the default for run:
    # is bash -e only, so a failing setup.sh before "| tee" went unnoticed.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # 3.9 backs the documented minimum; a recent version catches deprecations.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install script dependencies
        run: python -m pip install -r requirements.txt pyyaml

      - name: Python syntax
        run: python -m py_compile scripts/abbreviations_extract.py scripts/bibliography_check.py scripts/build_reference_docx.py scripts/cephalo_guard.py scripts/cross_session_audit.py scripts/docx_pagination.py scripts/repeated_citations.py scripts/state_check.py scripts/verbatim_check.py

      - name: Shell syntax
        # One file per call: `bash -n a b c` parses only a (b and c become its arguments).
        # cephalo_guard.sh runs under sh (dash on Ubuntu), the shell of a hook command.
        run: |
          for f in setup.sh scripts/docx_postprocess.sh scripts/extract_styleguide.sh; do bash -n "$f"; done
          sh -n scripts/cephalo_guard.sh

      - name: shellcheck
        run: shellcheck setup.sh scripts/cephalo_guard.sh scripts/docx_postprocess.sh scripts/extract_styleguide.sh

      - name: cephalo guard (rules, hook command, prescribed commands, messages)
        run: |
          python -I .github/tests/test_cephalo_guard.py
          # The hook settings belong in templates/: a .claude/settings.json here would
          # guard cephalo's own development sessions, which use the shell freely.
          test ! -e .claude/settings.json
          test ! -e .claude/settings.local.json

      - name: Workflow YAML parse (all 8 must load)
        run: |
          python - <<'EOF'
          import glob, yaml
          files = sorted(glob.glob("workflows/*.yaml"))
          assert len(files) == 8, f"expected 8 workflow files, found {len(files)}"
          for f in files:
              yaml.safe_load(open(f, encoding="utf-8"))
              print("OK", f)
          EOF

      - name: Agent and workflow references
        run: |
          python - <<'EOF'
          import glob, os, re, yaml
          errors = []
          agent_files = sorted(glob.glob(".claude/agents/*.md"))
          assert len(agent_files) == 10, f"expected 10 agent files, found {len(agent_files)}"
          for f in agent_files:
              front = yaml.safe_load(open(f, encoding="utf-8").read().split("---")[1])
              if front.get("name") != os.path.basename(f)[:-3]:
                  errors.append(f"{f}: frontmatter name {front.get('name')!r} does not match the file name")
          # Archives are unpacked only through scripts/extract_styleguide.sh (safe_extract_zip):
          # no agent or checklist may show another extractor as a command, in a code span
          # or in a code block (naming one in prose, e.g. to forbid it, is fine).
          cmd = r"\b(?:unzip|7z[az]?|bsdtar)\s+\S|\btar\b[^|;&`\n]*(?:\s-?[a-z]*x[a-z]*\b|--extract)|\.extract(?:all)?\(|unpack_archive\(|\bExpand-Archive\s+\S|-m\s+(?:zipfile|tarfile)\s+(?:-e|--extract)\b|\bExtractToDirectory\b"
          in_span = re.compile(r"`[^`]*?(?:" + cmd + r")[^`]*`")
          in_block = re.compile(cmd)
          for f in agent_files + sorted(glob.glob("checklists/*.md")):
              # The opening fence of the current code block: only the same kind of
              # fence, at least as long and without an info string, closes it, so a
              # ```bash block inside a ```` block is content (CommonMark).
              fence = ""
              for n, line in enumerate(open(f, encoding="utf-8").read().splitlines(), 1):
                  m = re.match(r"\s*(`{3,}|~{3,})(.*)$", line)
                  if m and not fence:
                      fence = m.group(1)
                      continue
                  if m and m.group(1)[0] == fence[0] and len(m.group(1)) >= len(fence) and not m.group(2).strip():
                      fence = ""
                      continue
                  fenced = bool(fence)
                  # In a code block, any extractor call counts (after dropping a shell comment).
                  code = re.sub(r"(^|\s)#.*", "", line)
                  if in_span.search(line) or (fenced and in_block.search(code)):
                      errors.append(f"{f}:{n}: archive extraction outside scripts/extract_styleguide.sh")
          def refs(node):
              if isinstance(node, dict):
                  for k, v in node.items():
                      if k == "agent" and isinstance(v, str):
                          yield v
                      elif k in ("agents", "active_agents", "optional_agents") and isinstance(v, list):
                          yield from (a for a in v if isinstance(a, str))
                      else:
                          yield from refs(v)
              elif isinstance(node, list):
                  for v in node:
                      yield from refs(v)
          def paths(node):
              if isinstance(node, dict):
                  for k, v in node.items():
                      if k in ("checklist", "script", "documentation", "extended_by") and isinstance(v, str):
                          yield v
                      else:
                          yield from paths(v)
              elif isinstance(node, list):
                  for v in node:
                      yield from paths(v)
          # The agents an orchestrator may call: the Agent(...) entry of its tools line.
          calls = {}
          for f in agent_files:
              front = yaml.safe_load(open(f, encoding="utf-8").read().split("---")[1])
              m = re.search(r"\bAgent\(([^)]*)\)", str(front.get("tools", "")))
              names = {a.strip() for a in m.group(1).split(",")} if m else set()
              for a in sorted(names):
                  if not os.path.isfile(f".claude/agents/{a}.md"):
                      errors.append(f"{f}: Agent({a}) names no agent file")
              if front["name"].startswith("orchestrator"):
                  calls[front["name"]] = names
          for f in sorted(glob.glob("workflows/*.yaml")):
              wf = yaml.safe_load(open(f, encoding="utf-8"))
              declared = wf.get("agents", {})
              for key, spec in declared.items():
                  if not os.path.isfile(spec["file"]):
                      errors.append(f"{f}: agent {key!r} points to missing {spec['file']}")
              for name in refs({k: v for k, v in wf.items() if k != "agents"}):
                  if name not in declared:
                      errors.append(f"{f}: agent {name!r} is used but not declared")
              # Name, base workflow and referenced checklists, scripts and docs exist.
              if wf.get("name") != os.path.basename(f)[:-5]:
                  errors.append(f"{f}: name {wf.get('name')!r} does not match the file name")
              if "based_on" in wf and not os.path.isfile(os.path.join("workflows", wf["based_on"])):
                  errors.append(f"{f}: based_on points to missing workflows/{wf['based_on']}")
              for p in paths(wf):
                  if not os.path.isfile(p):
                      errors.append(f"{f}: references missing {p}")
              # Each orchestrator the workflow declares may call every other agent it declares.
              stems = {os.path.basename(s["file"])[:-3] for s in declared.values()}
              for o in sorted(stems & calls.keys()):
                  for a in sorted(stems - calls.keys() - calls[o]):
                      errors.append(f"{f}: {o} cannot call {a} (not in the Agent(...) entry of its tools line)")
              # A workflow without an orchestrator has a main_session block that names the
              # sections of a definition Claude in the main chat follows: each is a heading
              # of that file (outside code blocks), or a bold lead of a bullet under its
              # Principles, so a renamed section cannot leave a dead pointer.
              ms = wf.get("main_session")
              if ms is None:
                  if wf.get("name") in ("seminar_2agent", "presentation_3agent"):
                      errors.append(f"{f}: no main_session block")
                  continue
              d = ms.get("definition") if isinstance(ms, dict) else None
              if not isinstance(d, str) or not os.path.isfile(d):
                  errors.append(f"{f}: main_session definition {d!r} does not exist")
                  continue
              names, fence, principles = set(), "", False
              for line in open(d, encoding="utf-8").read().splitlines():
                  m = re.match(r"\s*(`{3,}|~{3,})", line)
                  if m and (not fence or m.group(1).startswith(fence)):
                      fence = "" if fence else m.group(1)
                      continue
                  if fence:
                      continue
                  m = re.match(r"#{2,4} (.+?)\s*$", line)
                  if m:
                      names.add(m.group(1))
                      principles = m.group(1) == "Principles"
                      continue
                  m = re.match(r"- \*\*(.+?):?\*\*", line)
                  if m and principles:
                      names.add(m.group(1))
              if not ms.get("sections"):
                  errors.append(f"{f}: main_session names no sections")
              for name in ms.get("sections") or []:
                  if name not in names:
                      errors.append(f"{f}: main_session section '{name}' is no heading of {d}")
          # Framework files named in free text exist too (task:, note: and lists of
          # strings in workflows; agents, checklists, templates), also as ../ from a
          # sub-project.
          framework_ref = re.compile(r"(?<![\w./-])(?:\.\./)?((?:checklists|scripts|docs|templates|workflows)/[\w.-]+\.(?:md|py|sh|yaml))")
          for f in sorted(glob.glob("workflows/*.yaml") + glob.glob("checklists/*.md") + glob.glob("templates/*.md")) + agent_files:
              for n, line in enumerate(open(f, encoding="utf-8"), 1):
                  for p in framework_ref.findall(line):
                      if not os.path.isfile(p):
                          errors.append(f"{f}:{n}: references missing {p}")
          # Every styleguide key that agents, checklists, workflows and docs name
          # (document.hyphenation, captions.table_position, ...) is a slot in the template.
          keys, prefixes, current = set(), set(), []
          for line in open("templates/styleguide.md", encoding="utf-8"):
              if line.startswith("## "):
                  current = re.findall(r"`([a-z_]+)\.\*`", line)
                  prefixes.update(current)
                  continue
              m = re.match(r"\s*- \*\*`([A-Za-z_.0-9]+)`:?\*\*", line)
              if m and current:
                  k = m.group(1)
                  keys.add(k if k.split(".")[0] in current else f"{current[0]}.{k}")
          key_ref = re.compile(r"\b(?:" + "|".join(sorted(prefixes)) + r")\.[a-z_0-9]+(?:\.[a-z_0-9]+)*")
          for f in agent_files + sorted(glob.glob("checklists/*.md") + glob.glob("workflows/*.yaml") + glob.glob("docs/*.md") + glob.glob("templates/*.md")) + ["CLAUDE.md", "README.md"]:
              for n, line in enumerate(open(f, encoding="utf-8"), 1):
                  for k in key_ref.findall(line):
                      if k.rsplit(".", 1)[1] in ("bib", "csl", "docx", "md", "pdf", "pptx", "txt", "yaml"):
                          continue  # a file name such as document.docx
                      if k not in keys and not any(x.startswith(k + ".") for x in keys):
                          errors.append(f"{f}:{n}: styleguide key {k} has no slot in templates/styleguide.md")
          print("\n".join(errors) or "OK: agent definitions and workflow references")
          raise SystemExit(1 if errors else 0)
          EOF

      - name: Script --help smokes
        run: |
          python scripts/abbreviations_extract.py --help
          python scripts/bibliography_check.py --help
          python scripts/build_reference_docx.py --help
          python scripts/cross_session_audit.py --help
          python scripts/docx_pagination.py --help
          python scripts/repeated_citations.py --help
          python scripts/state_check.py --help
          python scripts/verbatim_check.py --help
          bash scripts/docx_postprocess.sh --help
          bash scripts/extract_styleguide.sh --help
          bash setup.sh --help

      - name: Non-interactive setup smoke (all three structures)
        run: |
          bash setup.sh "Seminar paper" "Flat" full --target /tmp/ci_flat </dev/null
          bash setup.sh "Bachelor thesis" "Long-form" full --target /tmp/ci_long </dev/null | tee /tmp/ci_long.out
          # The calling shell stays in the template folder: the summary must name the project.
          grep -qxF "   cd '/tmp/ci_long'" /tmp/ci_long.out
          bash setup.sh "Master thesis" "Multi-project" minimal --target /tmp/ci_multi </dev/null >/tmp/ci_multi.out
          test -d /tmp/ci_flat/workspace/sources/_guidelines
          test -f /tmp/ci_long/00_Status.md
          test -d /tmp/ci_multi/00_Shared_Materials/guidelines
          # The sub-projects read ../00_Shared_Materials/ directly: no shared/ link or copy,
          # and no note about old shared/ entries in a new project.
          for sub in 01_Proposal 02_Main_Work 03_Defense; do
            if [ -e "/tmp/ci_multi/$sub/shared" ] || [ -L "/tmp/ci_multi/$sub/shared" ]; then echo "$sub/shared was created"; exit 1; fi
          done
          if grep -q 'No longer used' /tmp/ci_multi.out; then echo "old shared/ note in a new project"; exit 1; fi
          # The hook settings of the cephalo guard, a byte copy of the template, in the project
          # and in each sub-project, which Claude Code opens as a project of its own.
          for d in /tmp/ci_flat /tmp/ci_long /tmp/ci_multi /tmp/ci_multi/01_Proposal /tmp/ci_multi/02_Main_Work /tmp/ci_multi/03_Defense; do
            cmp templates/claude_settings.json "$d/.claude/settings.json"
          done
          # A settings file of the user's is kept; one without the guard is named in "Next steps".
          printf '{"permissions": {"allow": []}}\n' > /tmp/ci_long/.claude/settings.json
          (cd /tmp/ci_long && bash setup.sh "Bachelor thesis" "Long-form" full </dev/null >/tmp/ci_long2.out)
          grep -qxF '{"permissions": {"allow": []}}' /tmp/ci_long/.claude/settings.json
          grep -q 'do not run the cephalo guard' /tmp/ci_long2.out
          grep -q 'templates/claude_settings.json' /tmp/ci_long2.out
          # A settings entry that is a link to nowhere or a folder is kept and named, never copied into.
          M=/tmp/ci_missing_settings; rm -rf "$M"
          for kind in link folder; do
            rm -rf /tmp/ci_long/.claude/settings.json
            if [ "$kind" = link ]; then ln -s "$M/settings.json" /tmp/ci_long/.claude/settings.json; else mkdir /tmp/ci_long/.claude/settings.json; fi
            (cd /tmp/ci_long && bash setup.sh "Bachelor thesis" "Long-form" full </dev/null >/tmp/ci_long3.out)
            grep -q 'do not run the cephalo guard' /tmp/ci_long3.out
            (cd /tmp/ci_long && pwsh -NoProfile -File ./setup.ps1 -WorkType "Bachelor thesis" -Structure "Long-form" -Scaffolding full -NonInteractive >/tmp/ci_long3_ps.out)
            grep -q 'do not run the cephalo guard' /tmp/ci_long3_ps.out
            test ! -e "$M"
            if [ "$kind" = folder ]; then test -z "$(ls -A /tmp/ci_long/.claude/settings.json)"; else test -L /tmp/ci_long/.claude/settings.json; fi
          done
          rm -rf /tmp/ci_long/.claude/settings.json; cp templates/claude_settings.json /tmp/ci_long/.claude/settings.json
          if grep -q 'do not run the cephalo guard' /tmp/ci_multi.out; then echo "merge note in a new project"; exit 1; fi
          # Git LFS is set up for the project only: the user's global config stays untouched.
          if command -v git-lfs >/dev/null; then
            H=$(mktemp -d)
            HOME="$H" bash setup.sh "Seminar paper" "Flat" full --target /tmp/ci_lfs </dev/null >/dev/null
            git -C /tmp/ci_lfs config --local --get filter.lfs.clean >/dev/null
            if [ -e "$H/.gitconfig" ] && grep -qi lfs "$H/.gitconfig"; then echo "setup wrote LFS filters to the global config"; exit 1; fi
          fi

      - name: --target copies leave out local artifacts; non-empty and in-place targets
        run: |
          test ! -e /tmp/ci_flat/.github
          # Leftovers in the template folder that must not reach a --target project.
          mkdir -p venv scripts/.venv scripts/__pycache__ .claude/worktrees/x
          touch cephalo-setup.sh "cephalo-setup (1).sh" .claude/settings.local.json scripts/__pycache__/x.pyc
          bash setup.sh "Seminar paper" "Flat" full --target /tmp/ci_excl </dev/null >/dev/null
          for p in .github venv scripts/.venv scripts/__pycache__ .claude/worktrees .claude/settings.local.json cephalo-setup.sh "cephalo-setup (1).sh"; do
            if [ -e "/tmp/ci_excl/$p" ]; then echo "copied into --target: $p"; exit 1; fi
          done
          rm -rf venv scripts/.venv scripts/__pycache__ .claude/worktrees .claude/settings.local.json cephalo-setup.sh "cephalo-setup (1).sh"
          # A non-empty target without prompts is refused and left untouched (CONTRIBUTING target test 3).
          mkdir /tmp/ci_nonempty && touch /tmp/ci_nonempty/existing.txt
          set +e; bash setup.sh "Seminar paper" "Flat" full --target /tmp/ci_nonempty </dev/null >/dev/null 2>&1; code=$?; set -e
          test "$code" -eq 2
          test "$(ls -A /tmp/ci_nonempty)" = existing.txt
          # Folder metadata alone (a Finder .DS_Store) does not make a target non-empty.
          mkdir /tmp/ci_ds && touch /tmp/ci_ds/.DS_Store
          bash setup.sh "Seminar paper" "Flat" full --target /tmp/ci_ds </dev/null >/dev/null
          test -d /tmp/ci_ds/workspace/sources/_guidelines
          # A target equal to the current location sets up in place (CONTRIBUTING target test 4).
          # (Output to a file: "| grep -q" would stop setup.sh early with SIGPIPE.)
          cp -a . /tmp/ci_self
          (cd /tmp/ci_self && bash setup.sh "Seminar paper" "Flat" full --target /tmp/ci_self </dev/null >/tmp/ci_self.out)
          grep -q "Target path equals current location" /tmp/ci_self.out
          test -d /tmp/ci_self/workspace/sources/_guidelines

      - name: Invalid arguments fail fast (exit 2, no stray target)
        run: |
          set +e
          bash setup.sh "Bachelor thesis" "Langform" full --target /tmp/ci_typo </dev/null
          code=$?
          set -e
          test "$code" -eq 2
          test ! -e /tmp/ci_typo
          # More typos: each must exit 2 without creating the target and without
          # scaffolding into the template checkout itself.
          expect_2() {
            set +e; bash setup.sh "$@" </dev/null >/dev/null 2>&1; code=$?; set -e
            if [ "$code" -ne 2 ]; then echo "expected exit 2, got $code for: $*"; exit 1; fi
            test ! -e /tmp/ci_typo && test ! -e ci_inside && test ! -e 00_Status.md && test ! -e workspace
          }
          expect_2 "Bachelorarbeit" "Long-form" full --target /tmp/ci_typo
          expect_2 "Bachelor thesis" "Long-form" fulll --target /tmp/ci_typo
          expect_2 "Seminar paper" "Long-form" full --target /tmp/ci_typo
          expect_2 "Presentation" "Multi-project" full --target /tmp/ci_typo
          expect_2 "Bachelor thesis" "Long-form" full --taget /tmp/ci_typo
          expect_2 "Bachelor thesis" "Long-form" full /tmp/ci_typo
          expect_2 "Bachelor thesis" "Long-form" full --target=
          expect_2 "Bachelor thesis" "Long-form" full --target ci_inside
          # The Flat-only rule also applies when the work type comes from the menu.
          set +e; printf '1\n' | bash setup.sh "" "Long-form" full --target /tmp/ci_typo >/dev/null 2>/tmp/ci_menu_flat.err; code=$?; set -e
          test "$code" -eq 2
          grep -q "uses the Flat structure" /tmp/ci_menu_flat.err
          test ! -e /tmp/ci_typo

      - name: Setup regressions (re-run, generated files, menus, numbering)
        run: |
          # A re-run must keep existing state files (this once caused data loss).
          for f in 00_Status.md 00_Decisions.md 00_Feedback_log.md; do echo "ci-marker" >> "/tmp/ci_long/$f"; done
          (cd /tmp/ci_long && bash setup.sh "Bachelor thesis" "Long-form" full </dev/null >/dev/null)
          for f in 00_Status.md 00_Decisions.md 00_Feedback_log.md; do grep -q ci-marker "/tmp/ci_long/$f"; done
          # Generated projects: LFS rules next to the template's eol rule, once;
          # state files come from templates/, not from the minimal fallback.
          test "$(grep -c 'filter=lfs' /tmp/ci_long/.gitattributes)" -eq 6
          grep -q '^\*\.sh text eol=lf' /tmp/ci_long/.gitattributes
          for sub in 01_Proposal 02_Main_Work 03_Defense; do
            cmp templates/status.md "/tmp/ci_multi/$sub/00_Status.md"
            cmp templates/decisions.md "/tmp/ci_multi/$sub/00_Decisions.md"
            cmp templates/feedback_log.md "/tmp/ci_multi/$sub/00_Feedback_log.md"
          done
          # The .gitignore that setup writes when none exists equals the template's.
          rm /tmp/ci_flat/.gitignore
          (cd /tmp/ci_flat && bash setup.sh "Seminar paper" "Flat" full </dev/null >/dev/null)
          cmp .gitignore /tmp/ci_flat/.gitignore
          # Invalid menu input is answered with a hint; closed stdin then exits 2.
          set +e
          printf '9\nabc\n' | bash setup.sh >/dev/null 2>/tmp/ci_menu.err
          code=$?
          set -e
          test "$code" -eq 2
          test "$(grep -c 'Please enter a number between 1 and 5.' /tmp/ci_menu.err)" -eq 2
          # "Next steps" are numbered without gaps.
          for args in "Seminar paper|Flat|full" "Bachelor thesis|Long-form|minimal" "Master thesis|Multi-project|full"; do
            IFS='|' read -r w s c <<< "$args"
            rm -rf /tmp/ci_steps
            got=$(bash setup.sh "$w" "$s" "$c" --target /tmp/ci_steps </dev/null | sed -n '/Next steps/,$p' | sed 's/\x1b\[[0-9;]*m//g' | grep -oE '^ *[0-9]+\.' | tr -d ' .' | tr '\n' ' ')
            want=$(seq -s ' ' 1 "$(echo "$got" | wc -w)")
            test "$got" = "$want " || { echo "Next steps numbered '$got' for $args"; exit 1; }
          done
          # The loop's last run (Master thesis, Multi-project, full) keeps both data placeholders.
          test -f /tmp/ci_steps/02_Main_Work/05_Empirical/data/raw/.gitkeep
          test -f /tmp/ci_steps/02_Main_Work/05_Empirical/data/processed/.gitkeep
          # Research data stays out of Git; the placeholders do not.
          for d in raw processed; do
            git -C /tmp/ci_steps check-ignore -q "02_Main_Work/05_Empirical/data/$d/interviews.csv"
            if git -C /tmp/ci_steps check-ignore -q "02_Main_Work/05_Empirical/data/$d/.gitkeep"; then echo "data/$d/.gitkeep is ignored"; exit 1; fi
          done
          # A command that fails inside a function (mkdir in create_dir) is reported, once.
          bash setup.sh "Seminar paper" "Flat" full --target /tmp/ci_err </dev/null >/dev/null
          rmdir /tmp/ci_err/workspace/sources/_guidelines
          touch /tmp/ci_err/workspace/sources/_guidelines
          set +e
          (cd /tmp/ci_err && bash setup.sh "Seminar paper" "Flat" full </dev/null >/tmp/ci_err1.out 2>&1); code1=$?
          set -e
          if [ "$code1" -ne 1 ] || [ "$(grep -c 'Setup exited unexpectedly' /tmp/ci_err1.out)" -ne 1 ]; then
            cat /tmp/ci_err1.out; echo "exit $code1: the failure was not reported exactly once"; exit 1
          fi
          # Stopped during the copy into a new --target (TERM, handled like Ctrl+C,
          # which a background job ignores): the advice names the partly set-up
          # folder, which a re-run of the same command would refuse.
          mkdir /tmp/ci_slow
          printf '#!/bin/sh\nif [ "$1" = -xf ]; then %s "$@"; sleep 3; exit 0; fi\nexec %s "$@"\n' "$(command -v tar)" "$(command -v tar)" > /tmp/ci_slow/tar
          chmod +x /tmp/ci_slow/tar
          PATH="/tmp/ci_slow:$PATH" bash setup.sh "Seminar paper" "Flat" full --target /tmp/ci_int </dev/null >/tmp/ci_int.out 2>&1 &
          pid=$!
          for _ in $(seq 50); do [ -f /tmp/ci_int/setup.sh ] && break; sleep 0.2; done
          kill -TERM "$pid"
          set +e; wait "$pid"; code=$?; set -e
          if [ "$code" -ne 130 ] || ! grep -q 'only partly set up' /tmp/ci_int.out; then cat /tmp/ci_int.out; echo "exit $code"; exit 1; fi
          # At the interactive target prompt, a folder dragged into the terminal
          # (quoted, or with shell escapes) is the folder meant.
          mkdir -p "/tmp/ci_dd/My Thesis (2026)" "/tmp/ci_dd/Other Thesis" "/tmp/ci_dd/John's Thesis"
          printf '2\n/tmp/ci_dd/My\\ Thesis\\ \\(2026\\) \n3\n1\n1\ny\nn\n\n' | script -qec "bash setup.sh" /dev/null >/dev/null
          printf "2\n'/tmp/ci_dd/Other Thesis' \n3\n1\n1\ny\nn\n\n" | script -qec "bash setup.sh" /dev/null >/dev/null
          printf '2\n%s \n3\n1\n1\ny\nn\n\n' "'/tmp/ci_dd/John'\\''s Thesis'" | script -qec "bash setup.sh" /dev/null >/dev/null
          test -d "/tmp/ci_dd/My Thesis (2026)/workspace/sources/_guidelines"
          test -d "/tmp/ci_dd/Other Thesis/workspace/sources/_guidelines"
          test -d "/tmp/ci_dd/John's Thesis/workspace/sources/_guidelines"
          test "$(ls -A /tmp/ci_dd | wc -l)" -eq 3
          # At the target prompt, a folder inside the template (a bare folder name) is
          # asked for again, and the next answer is used.
          printf '2\nThesisSub\n/tmp/ci_reask\n3\n1\n1\ny\nn\n\n' | script -qec "bash setup.sh" /dev/null >/tmp/ci_reask.out
          grep -q 'lies inside the cephalo template folder' /tmp/ci_reask.out
          grep -qF "$(pwd -P)/ThesisSub" /tmp/ci_reask.out
          test -d /tmp/ci_reask/workspace/sources/_guidelines
          # An error exit of an interactive run (here a --target inside the template)
          # waits for Enter, so a double-clicked window does not close at once; with
          # all three arguments, as the setup assistant's launchers pass them, not.
          out=$(printf '\n' | script -qec "bash setup.sh --target ThesisSub" /dev/null || true)
          printf '%s\n' "$out" | grep -q 'check the messages above'
          out=$(script -qec "bash setup.sh 'Seminar paper' Flat full --target ThesisSub" /dev/null </dev/null || true)
          if printf '%s\n' "$out" | grep -q 'check the messages above'; then echo "setup.sh paused with all three arguments"; exit 1; fi
          printf '2\nThesisSub\n/tmp/ci_reask_ps\n3\n1\n1\ny\nn\n\n' | pwsh -NoProfile -File ./setup.ps1 >/tmp/ci_reask_ps.out
          grep -q 'lies inside the cephalo template folder' /tmp/ci_reask_ps.out
          grep -qF "$(pwd -P)/ThesisSub" /tmp/ci_reask_ps.out
          test -d /tmp/ci_reask_ps/workspace/sources/_guidelines
          # A target path that cannot be resolved (a drive that does not exist) is
          # asked for again at the prompt; as -Target it is an invalid argument
          # (exit 2), not a cancelled run (exit 130).
          printf '2\nQ:\\ci_nodrive\n/tmp/ci_nodrive_ps\n3\n1\n1\ny\nn\n\n' | pwsh -NoProfile -File ./setup.ps1 >/tmp/ci_nodrive_ps.out
          grep -q 'Cannot use that path' /tmp/ci_nodrive_ps.out
          test -d /tmp/ci_nodrive_ps/workspace/sources/_guidelines
          set +e; pwsh -NoProfile -File ./setup.ps1 -WorkType "Seminar paper" -Structure Flat -Scaffolding full -Target 'Q:\ci_nodrive' -NonInteractive >/tmp/ci_nodrive_ps2.out 2>&1; code=$?; set -e
          test "$code" -eq 2
          grep -q 'cannot resolve target path' /tmp/ci_nodrive_ps2.out
          # Started from a project (the one set up in place above) with a new target,
          # neither script offers to delete it: its Git history is not copied.
          (cd /tmp/ci_self && printf '2\n/tmp/ci_moved\n3\n1\n1\ny\ny\n\n' | script -qec "bash setup.sh" /dev/null >/tmp/ci_moved.out)
          (cd /tmp/ci_self && printf '2\n/tmp/ci_moved_ps\n3\n1\n1\ny\ny\n\n' | pwsh -NoProfile -File ./setup.ps1 >/tmp/ci_moved_ps.out)
          for f in /tmp/ci_moved.out /tmp/ci_moved_ps.out; do
            grep -q 'is a project, not a bare template' "$f"
            if grep -q 'Delete it now' "$f"; then echo "$f: deletion offered for a project"; exit 1; fi
          done
          test -d /tmp/ci_self/workspace/sources/_guidelines
          test -d /tmp/ci_moved/workspace/sources/_guidelines
          test -d /tmp/ci_moved_ps/workspace/sources/_guidelines
          # Into a non-empty target (here the projects just made), a project is not
          # copied: its own files (a styleguide.md here) would replace the target's.
          echo "source notes" > /tmp/ci_self/styleguide.md
          for t in /tmp/ci_moved /tmp/ci_moved_ps; do echo "target notes" > "$t/styleguide.md"; done
          set +e
          (cd /tmp/ci_self && printf '1\n1\ny\ny\n\n' | script -qec "bash setup.sh --target /tmp/ci_moved" /dev/null >/tmp/ci_over.out); c1=$?
          (cd /tmp/ci_self && printf '1\n1\ny\ny\n\n' | pwsh -NoProfile -File ./setup.ps1 -Target /tmp/ci_moved_ps >/tmp/ci_over_ps.out); c2=$?
          set -e
          test "$c1 $c2" = "2 2"
          grep -q 'would replace the target' /tmp/ci_over.out
          grep -q 'would replace the target' /tmp/ci_over_ps.out
          test "$(cat /tmp/ci_moved/styleguide.md /tmp/ci_moved_ps/styleguide.md)" = "$(printf 'target notes\ntarget notes')"
          out=$(printf '\n' | pwsh -NoProfile -File ./setup.ps1 -Target ThesisSub || true)
          printf '%s\n' "$out" | grep -q 'check the messages above'
          test ! -e ThesisSub
          # So does setup.sh's exit after ten invalid menu answers.
          out=$(printf '1\nx\nx\nx\nx\nx\nx\nx\nx\nx\nx\n' | script -qec "bash setup.sh" /dev/null || true)
          printf '%s\n' "$out" | grep -q 'too many invalid attempts'
          printf '%s\n' "$out" | grep -q 'check the messages above'
          # Ctrl+C at such a pause (in Git Bash also a habit for copying the text) closes
          # like Enter, with the run's exit code, instead of reporting a cancelled setup.
          # The same driver also runs the target prompt asking again ("asked again").
          python - bash <<'EOF'
          import os, pty, re, select, subprocess, sys, time
          sh = sys.argv[1]
          # Bash before 5.1 runs no Ctrl+C trap while one is running: at the pauses of
          # the Ctrl+C handler itself (a real cancellation, Ctrl+C after the setup), a
          # second Ctrl+C is held back there, and Enter closes the pause instead.
          old_bash = subprocess.run([sh, "-c", '[ "$(( BASH_VERSINFO[0] * 100 + BASH_VERSINFO[1] ))" -lt 501 ]']).returncode == 0
          def drive(args, steps, enter_later):
              pid, fd = pty.fork()
              if pid == 0:
                  os.execvp(sh, [sh, "setup.sh"] + args)
              out, pos, i, end, last = b"", 0, 0, time.time() + 60, 0
              while True:
                  m = i < len(steps) and re.search(steps[i][0], out[pos:])
                  if m:
                      pos += m.end(); time.sleep(0.2); os.write(fd, steps[i][1]); i += 1; last = time.time()
                      continue
                  if enter_later and i == len(steps) and time.time() - last > 3:
                      os.write(fd, b"\n"); enter_later = False
                  if time.time() > end:
                      os.kill(pid, 9)
                      sys.exit("timeout:\n" + out.decode(errors="replace"))
                  if select.select([fd], [], [], 0.2)[0]:
                      try:
                          data = os.read(fd, 4096)
                      except OSError:
                          data = b""
                      if data:
                          out += data
                          continue
                  done, status = os.waitpid(pid, os.WNOHANG)
                  if done:
                      return os.waitstatus_to_exitcode(status), out.decode(errors="replace"), i
          cases = [
              ("error pause", ["--target", "ThesisSub"], [(rb"check the messages above", b"\x03")], 2, "Setup cancelled by user", 0, False),
              ("asked again", [], [(rb"Your choice \[1-2", b"2\n"), (rb"Target path:", b"ThesisSub\n"), (rb"lies inside the cephalo template folder", b""), (re.escape(os.path.realpath(os.getcwd()) + "/ThesisSub").encode(), b""), (rb"Target path:", b"/tmp/ci_reask_pty\n"), (rb"What kind of work", b"1\n"), (rb"How much scaffolding", b"1\n"), (rb"Proceed\?", b"y\n"), (rb"Delete it now\?", b"n\n"), (rb"Press Enter to close", b"\n")], 0, "lies inside the cephalo template folder", 1, False),
              ("ten invalid answers", [], [(rb"Your choice \[1-2", b"1\n"), (rb"What kind of work", b"x\n" * 10), (rb"check the messages above", b"\x03")], 2, "Setup cancelled by user", 0, False),
              ("cancelled at a menu", [], [(rb"Your choice \[1-2", b"1\n"), (rb"What kind of work", b"\x03"), (rb"Press Enter to close", b"\x03")], 130, "Setup cancelled by user", 1, old_bash),
              ("completed setup", ["Seminar paper", "Flat", "full", "--target", "/tmp/ci_pause_done"], [(rb"Delete it now\?", b"n\n"), (rb"Press Enter to close", b"\x03")], 0, "Setup cancelled by user", 0, False),
              ("stopped after the setup", ["Seminar paper", "Flat", "full", "--target", "/tmp/ci_pause_done2"], [(rb"Delete it now\?", b"\x03"), (rb"Press Enter to close", b"\x03")], 0, "after the setup had completed", 1, old_bash),
          ]
          for name, args, steps, want, text, count, enter_later in cases:
              code, out, sent = drive(args, steps, enter_later)
              if code != want or sent != len(steps) or out.count(text) != count:
                  sys.exit(f"{name}: exit {code}, {sent} of {len(steps)} inputs sent\n{out}")
          EOF
          test ! -e ThesisSub

      # setup.sh and setup.ps1 must scaffold the same project. pwsh (PowerShell 7,
      # preinstalled on the runner) runs setup.ps1 here; the Windows job covers 5.1.
      - name: setup.sh and setup.ps1 create identical projects (all 22 combinations, update path)
        run: |
          P=/tmp/ci_parity; rm -rf "$P"; mkdir -p "$P"; i=0
          for wt in "Seminar paper" "Presentation" "Bachelor thesis" "Master thesis" "Dissertation"; do
            case "$wt" in "Seminar paper"|Presentation) structs="Flat" ;; *) structs="Flat Long-form Multi-project" ;; esac
            for st in $structs; do
              for sc in full minimal; do
                i=$((i + 1))
                bash setup.sh "$wt" "$st" "$sc" --target "$P/sh$i" </dev/null >/dev/null
                pwsh -NoProfile -File ./setup.ps1 -WorkType "$wt" -Structure "$st" -Scaffolding "$sc" -Target "$P/ps$i" -NonInteractive >/dev/null
                diff -r --no-dereference -x .git "$P/sh$i" "$P/ps$i" || { echo "differs: $wt / $st / $sc"; exit 1; }
              done
            done
          done
          test "$i" -eq 22
          # shared/ entries from an earlier version (a link, a copy, or a link left dangling
          # by a moved project) are named in "Next steps" by both scripts, and kept. The
          # text file that a clone without symlink support leaves is checked in the other jobs.
          for s in sh ps; do
            d="$P/${s}9"   # Bachelor thesis, Multi-project, full
            ln -s ../00_Shared_Materials "$d/01_Proposal/shared"
            cp -r "$d/00_Shared_Materials" "$d/02_Main_Work/shared"
            ln -s /tmp/ci_moved_away/00_Shared_Materials "$d/03_Defense/shared"
            if [ "$s" = sh ]; then
              out=$(cd "$d" && bash setup.sh "Bachelor thesis" "Multi-project" full </dev/null)
            else
              out=$(cd "$d" && pwsh -NoProfile -File ./setup.ps1 -WorkType "Bachelor thesis" -Structure "Multi-project" -Scaffolding full -NonInteractive)
            fi
            note=$(printf '%s\n' "$out" | grep 'No longer used' || true)
            case "$note" in
              *"01_Proposal"?"shared 02_Main_Work"?"shared 03_Defense"?"shared"*) ;;
              *) printf '%s\n' "$out"; echo "$s: old shared entries not named"; exit 1 ;;
            esac
            test -L "$d/01_Proposal/shared"
            test -d "$d/02_Main_Work/shared/guidelines"
            test -L "$d/03_Defense/shared"
          done
          # Where .gitignore and .gitattributes are missing, both scripts write the same ones.
          rm "$P"/sh1/.gitignore "$P"/sh1/.gitattributes "$P"/ps1/.gitignore "$P"/ps1/.gitattributes
          (cd "$P/sh1" && bash setup.sh "Seminar paper" Flat full </dev/null >/dev/null)
          (cd "$P/ps1" && pwsh -NoProfile -File ./setup.ps1 -WorkType "Seminar paper" -Structure Flat -Scaffolding full -NonInteractive >/dev/null)
          diff -r --no-dereference -x .git "$P/sh1" "$P/ps1"
          cmp .gitignore "$P/ps1/.gitignore"
          # Folder metadata alone does not make a target non-empty for setup.ps1 either.
          mkdir "$P/meta" && touch "$P/meta/Thumbs.db" "$P/meta/desktop.ini"
          pwsh -NoProfile -File ./setup.ps1 -WorkType "Seminar paper" -Structure Flat -Scaffolding full -Target "$P/meta" -NonInteractive >/dev/null
          test -d "$P/meta/workspace/sources/_guidelines"
          # Updating a project (--target into it, confirmed at the prompts) keeps its own
          # .gitignore/.gitattributes and appends the template rules they lack, in both scripts.
          # (No Python caches in the template: setup.ps1 leaves nested ones it copies into a
          # non-empty target in place, as they could be the user's own.)
          find . -name __pycache__ -type d -prune -exec rm -rf {} +
          U=/tmp/ci_update; rm -rf "$U"; mkdir -p "$U"
          bash setup.sh "Master thesis" "Multi-project" full --target "$U/base" </dev/null >/dev/null
          sed -i '/^\*\.swp$/d' "$U/base/.gitignore"
          printf 'interviews/\r\nsecret.txt' >> "$U/base/.gitignore"
          printf '*.csv text eol=lf\n' >> "$U/base/.gitattributes"
          # a project from before the cephalo guard: the update installs its hook settings
          rm "$U/base/.claude/settings.json" "$U/base/01_Proposal/.claude/settings.json"
          cp -a "$U/base" "$U/sh"; cp -a "$U/base" "$U/ps"
          printf '4\n3\n1\ny\ny\nn\n' | script -qec "bash setup.sh --target $U/sh" /dev/null >/dev/null
          printf 'y\ny\nn\n' | pwsh -NoProfile -File ./setup.ps1 -WorkType "Master thesis" -Structure "Multi-project" -Scaffolding full -Target "$U/ps" >/dev/null
          diff -r --no-dereference -x .git "$U/sh" "$U/ps"
          cmp templates/claude_settings.json "$U/sh/.claude/settings.json"
          cmp templates/claude_settings.json "$U/sh/01_Proposal/.claude/settings.json"
          grep -q '^interviews/' "$U/sh/.gitignore"
          grep -qx 'secret.txt' "$U/sh/.gitignore"
          test "$(grep -cx '\*\.swp' "$U/sh/.gitignore")" -eq 1
          grep -qx '\*\.csv text eol=lf' "$U/sh/.gitattributes"
          test "$(grep -c 'filter=lfs' "$U/sh/.gitattributes")" -eq 6

      - name: Shell scripts stay LF in a core.autocrlf=true clone
        run: |
          rm -rf /tmp/ci_crlf
          git -c core.autocrlf=true clone -q . /tmp/ci_crlf
          for f in /tmp/ci_crlf/setup.sh /tmp/ci_crlf/scripts/*.sh; do
            if grep -q $'\r' "$f"; then echo "CRLF in $f"; exit 1; fi
            bash -n "$f"
          done

      - name: setup-wizard inline JavaScript parses
        run: |
          python - <<'EOF'
          import re
          page = open("docs/setup-wizard.html", encoding="utf-8").read()
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", page, re.S)
          assert scripts, "no inline script found"
          open("/tmp/ci_wizard.js", "w", encoding="utf-8").write("\n;\n".join(scripts))
          EOF
          node --check /tmp/ci_wizard.js

      # README.md and docs/QUICKSTART.md are embedded in the setup assistant as
      # rendered HTML: the words must match the Markdown sources (links, fence
      # languages and list numbers aside). Relative Markdown links must resolve.
      - name: Embedded README/QUICKSTART copies match; relative links resolve
        run: |
          python - <<'EOF'
          import html, os, re, subprocess
          errors = []
          page = open("docs/setup-wizard.html", encoding="utf-8").read()
          def words_md(t):
              t = re.sub(r"<!--.*?-->", " ", t, flags=re.S)
              t = re.sub(r"\]\([^)\s]*\)", "]", t)
              t = re.sub(r"^(\s*)```\S*", r"\1```", t, flags=re.M)
              t = re.sub(r"^\s*\d+\.\s", " ", t, flags=re.M)
              return re.findall(r"\w+", t)
          def words_html(t):
              t = re.sub(r"<!--.*?-->", " ", t, flags=re.S)
              t = re.sub(r"<[^>]+>", " ", t)
              return re.findall(r"\w+", html.unescape(t))
          for key, src in (("README", "README.md"), ("QUICKSTART", "docs/QUICKSTART.md")):
              m = re.search(rf"<!--DOC_{key}_START-->(.*?)<!--DOC_{key}_END-->", page, re.S)
              if not m:
                  errors.append(f"docs/setup-wizard.html: DOC_{key} markers missing")
                  continue
              a, b = words_md(open(src, encoding="utf-8").read()), words_html(m.group(1))
              if a != b:
                  i = next((i for i, (x, y) in enumerate(zip(a, b)) if x != y), min(len(a), len(b)))
                  errors.append(f"docs/setup-wizard.html: embedded {src} is out of date near "
                                f"{' '.join(a[max(0, i - 5):i + 5])!r} (embedded: {' '.join(b[max(0, i - 5):i + 5])!r})")
          for f in subprocess.run(["git", "ls-files", "*.md"], capture_output=True, text=True, check=True).stdout.split():
              text = re.sub(r"```.*?```", "", open(f, encoding="utf-8").read(), flags=re.S)
              for m in re.finditer(r"\]\(<?([^)\s>]+)>?(?:\s+\"[^\"]*\")?\)", text):
                  target = m.group(1)
                  if re.match(r"[a-z][a-z0-9+.-]*:", target, re.I) or target.startswith("#"):
                      continue
                  if not os.path.exists(os.path.join(os.path.dirname(f), target.split("#")[0])):
                      errors.append(f"{f}: link target {target} does not exist")
          if errors:
              raise SystemExit("\n".join(errors))
          print("embedded copies and relative links OK")
          EOF

      # The target path is the only free-text field the setup assistant puts
      # into a command: run the generated commands against stub setup scripts
      # and check that the path arrives unchanged and nothing else runs.
      - name: setup-wizard commands pass the target path through bash and PowerShell
        run: |
          W=/tmp/ci_wiz; rm -rf "$W"; mkdir -p "$W/sh" "$W/ps" "$W/home"
          printf '%s\n' '#!/bin/bash' '[ "$4" = --target ] && printf "%s" "$5" > target.txt' > "$W/sh/setup.sh"
          chmod +x "$W/sh/setup.sh"
          printf '%s\n' 'param([string]$WorkType, [string]$Structure, [string]$Scaffolding, [string]$Target, [switch]$NonInteractive)' \
            '[IO.File]::WriteAllText((Join-Path $PSScriptRoot "target.txt"), "$Target|$($NonInteractive.IsPresent)")' > "$W/ps/setup.ps1"
          node - "$W" <<'EOF'
          const fs = require("fs"), cp = require("child_process"), path = require("path");
          const W = process.argv[2], HOME = path.join(W, "home");
          const script = fs.readFileSync("docs/setup-wizard.html", "utf8").split("<script>")[1].split("</script>")[0];
          const grab = (a, b) => {
            const i = script.indexOf(a), j = script.indexOf(b, i);
            if (i < 0 || j < 0) throw new Error("marker not found: " + a);
            return script.slice(i, j);
          };
          const state = { work: "Bachelor thesis", struct: "Long-form", scaf: "full" };
          const F = new Function("state", "document", grab("function esc(s)", "// ----- command -----") +
            grab("function shQuote(x)", "  // ----- render -----") + grab("function launcher()", "  var dlBtn=") +
            "\nreturn { buildCmd: buildCmd, launcher: launcher, hereDir: hereDir, detectOs: detectOs, psQuote: psQuote };")(state, null);
          const text = h => h.replace(/<[^>]*>/g, "").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&");
          const Q = ["\u2018", "\u2019", "\u201A", "\u201B"];
          const sh = ["~", "~/Documents/Thesis", "~/x y", "~/it's", "~/$(touch PWNED)", "~-/x", "~+", "~1/x", "a;touch PWNED",
                      "$(touch PWNED)", "`touch PWNED`", "$HOME", "'", "\"", "a\\", "Müller [final]", "-rf", "x\u2019y"];
          const ps = ["'", "''", "\"", "$(New-Item -ItemType File PWNED)", "`n", "$env:HOME", "a;b", "C:\\Thesis\\x\\",
                      "M\u00fcller\\Arbeit", "-NonInteractive:$false", "\"C:\\Thesis\\x y\"", "x'\u2019; New-Item -ItemType File PWNED; #"]
            .concat(Q.map(q => "x" + q + "; New-Item -ItemType File PWNED; #"), Q.map(q => q + "+(New-Item PWNED)+" + q));
          let bad = 0;
          const check = (os, x, got, want, cmd) => {
            if (got !== want) { bad++; console.log(`FAIL ${os} ${JSON.stringify(x)}: got ${JSON.stringify(got)}, want ${JSON.stringify(want)}\n  ${cmd}`); }
          };
          for (const x of sh) {
            Object.assign(state, { os: "linux", target: x });
            const cmd = text(F.buildCmd()), out = path.join(W, "sh", "target.txt");
            fs.rmSync(out, { force: true });
            cp.spawnSync("bash", ["-c", cmd], { cwd: path.join(W, "sh"), env: { ...process.env, HOME } });
            const want = x === "~" || x.startsWith("~/") ? HOME + x.slice(1) : x;
            check("bash", x, fs.existsSync(out) ? fs.readFileSync(out, "utf8") : null, want, cmd);
          }
          for (const x of ps) {
            Object.assign(state, { os: "windows", target: x });
            const cmd = text(F.buildCmd()), out = path.join(W, "ps", "target.txt");
            fs.rmSync(out, { force: true });
            cp.spawnSync("pwsh", ["-NoProfile", "-NonInteractive", "-Command", cmd], { cwd: path.join(W, "ps") });
            check("pwsh", x, fs.existsSync(out) ? fs.readFileSync(out, "utf8") : null, x.replace(/"/g, "").trim() + "|True", cmd);
          }
          // The .sh launcher: the same targets arrive unchanged, a failing
          // setup is reported with its exit code, and a misplaced launcher stops.
          fs.mkdirSync(path.join(W, "fail")); fs.mkdirSync(path.join(W, "away"));
          fs.writeFileSync(path.join(W, "fail", "setup.sh"), "#!/bin/bash\nexit 3\n");
          const runLauncher = (dir, x) => {
            Object.assign(state, { os: "linux", target: x });
            const L = F.launcher(), file = path.join(W, dir, L.name);
            fs.writeFileSync(file, L.text.join("\n") + "\n");
            return cp.spawnSync("bash", [file], { cwd: W, input: "", env: { ...process.env, HOME }, encoding: "utf8" });
          };
          for (const x of sh) {
            const out = path.join(W, "sh", "target.txt");
            fs.rmSync(out, { force: true });
            const r = runLauncher("sh", x);
            const want = x === "~" || x.startsWith("~/") ? HOME + x.slice(1) : x;
            check("launcher", x, fs.existsSync(out) ? fs.readFileSync(out, "utf8") : null, want, "status " + r.status);
          }
          const failed = runLauncher("fail", "t");
          check("launcher", "failing setup", failed.status + " " + /Setup failed \(exit 3\)/.test(failed.stdout), "3 true", failed.stdout);
          const away = runLauncher("away", "t");
          check("launcher", "no setup.sh", away.status + " " + /Could not find setup\.sh/.test(away.stdout), "1 true", away.stdout);
          // Opened from a local cephalo folder, the command and the launcher cd there
          // themselves, from any directory, with an odd folder name and without the
          // execute bit; the folder comes only from a file: URL ending in docs/setup-wizard.html
          // (a drive or UNC location gives a Windows path, used only for the Windows command).
          const odd = path.join(W, "it's $(touch PWNED) & x");
          fs.mkdirSync(odd); fs.copyFileSync(path.join(W, "sh", "setup.sh"), path.join(odd, "setup.sh"));
          fs.chmodSync(path.join(odd, "setup.sh"), 0o644);
          for (const here of [path.join(W, "sh"), odd]) {
            const out = path.join(here, "target.txt");
            Object.assign(state, { os: "macos", target: "~/x y", here });
            const cmd = text(F.buildCmd());
            fs.rmSync(out, { force: true });
            cp.spawnSync("bash", ["-c", cmd], { cwd: HOME, env: { ...process.env, HOME } });
            check("located", here, fs.existsSync(out) ? fs.readFileSync(out, "utf8") : null, HOME + "/x y", cmd);
            fs.rmSync(out, { force: true });
            const r = runLauncher("away", "~/x y");
            check("located launcher", here, fs.existsSync(out) ? fs.readFileSync(out, "utf8") : null, HOME + "/x y", "status " + r.status);
          }
          state.here = HOME;  // no setup.sh there either
          const lost = runLauncher("away", "t");
          check("located launcher", "no setup.sh", lost.status + " " + /Could not find setup\.sh/.test(lost.stdout), "1 true", lost.stdout);
          state.here = "";
          for (const [loc, want] of [
            [["file:", "", "/home/a/Downloads/cephalo-1.0.0/docs/setup-wizard.html"], "/home/a/Downloads/cephalo-1.0.0"],
            [["file:", "", "/home/a/My%20Files/M%C3%BCller's%20%25/docs/setup-wizard.html"], "/home/a/My Files/M\u00fcller's %"],
            [["file:", "", "/C:/Thesis/cephalo/docs/setup-wizard.html"], "C:\\Thesis\\cephalo"],
            [["file:", "", "/D:/x%20y/%25/docs/setup-wizard.html"], "D:\\x y\\%"],
            [["file:", "", "/C:/docs/setup-wizard.html"], "C:\\"],
            [["file:", "server", "/share/cephalo/docs/setup-wizard.html"], "\\\\server\\share\\cephalo"],
            [["file:", "localhost", "/C$/Thesis/w5/docs/setup-wizard.html"], "\\\\localhost\\C$\\Thesis\\w5"],
            [["https:", "example.org", "/cephalo/docs/setup-wizard.html"], ""],
            [["file:", "", "/home/a/Desktop/setup-wizard.html"], ""],
            [["file:", "", "/docs/setup-wizard.html"], ""],
            [["file:", "", "/home/a/%E0%A4%A/docs/setup-wizard.html"], ""]]) {
            check("hereDir", loc.join(" "), F.hereDir({ protocol: loc[0], host: loc[1], pathname: loc[2] }), want, "");
          }
          // Windows: the command changes to the folder and allows the script for this window
          // only; a folder name with a quote, $( ) and & reaches Set-Location unchanged (read
          // back from the parsed command), and the rest of the command runs. A folder of the
          // other kind is not used, and the .cmd launcher falls back to the folder.
          const winHere = "D:\\Thesis\\it's $(New-Item -ItemType File PWNED) & x";
          Object.assign(state, { os: "windows", target: "x y", here: winHere });
          const wcmd = text(F.buildCmd());
          const parsed = cp.spawnSync("pwsh", ["-NoProfile", "-NonInteractive", "-Command",
            "$e = $null; $a = [System.Management.Automation.Language.Parser]::ParseInput($env:WCMD, [ref]$null, [ref]$e); " +
            "$a.Find({ param($n) $n -is [System.Management.Automation.Language.CommandAst] }, $true).CommandElements[2].Value"],
            { env: { ...process.env, WCMD: wcmd }, encoding: "utf8" });
          check("windows located", "parsed folder", parsed.stdout.trim(), winHere, wcmd);
          const wout = path.join(W, "ps", "target.txt");
          fs.rmSync(wout, { force: true });
          cp.spawnSync("pwsh", ["-NoProfile", "-NonInteractive", "-Command", wcmd.replace(F.psQuote(winHere), F.psQuote(path.join(W, "ps")))], { cwd: HOME });
          check("windows located", "run", fs.existsSync(wout) ? fs.readFileSync(wout, "utf8") : null, "x y|True", wcmd);
          // A folder that is gone stops the line: setup.ps1 must not run in the current folder.
          fs.rmSync(wout, { force: true });
          cp.spawnSync("pwsh", ["-NoProfile", "-NonInteractive", "-Command", wcmd.replace(F.psQuote(winHere), F.psQuote(path.join(W, "gone")))], { cwd: path.join(W, "ps") });
          check("windows located", "missing folder", fs.existsSync(wout), false, wcmd);
          Object.assign(state, { os: "linux", target: "", here: "D:\\Thesis\\cephalo" });
          check("windows located", "not for bash", /^cd /.test(text(F.buildCmd())), false, text(F.buildCmd()));
          Object.assign(state, { os: "windows", here: "/home/a/cephalo" });
          check("windows located", "no POSIX folder", /Set-Location/.test(text(F.buildCmd())), false, text(F.buildCmd()));
          Object.assign(state, { os: "windows", here: "D:\\Thesis\\50% off (1)\\cephalo" });
          const LW = F.launcher().text;
          check("windows located", "cmd fallback", LW.includes('if not exist ".\\setup.ps1" if exist "D:\\Thesis\\50%% off (1)\\cephalo\\setup.ps1" (')
            && LW.includes('  pushd "D:\\Thesis\\50%% off (1)\\cephalo"'), true, LW.join("\n"));
          state.here = "";
          // The preselected system: from the platform or the user agent, none for phones.
          for (const [nav, want] of [
            [{ platform: "Win32", userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/140.0" }, "windows"],
            [{ userAgentData: { platform: "Windows" }, platform: "", userAgent: "" }, "windows"],
            [{ platform: "MacIntel", userAgent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7) Safari/605.1.15" }, "macos"],
            [{ platform: "Linux x86_64", userAgent: "Mozilla/5.0 (X11; Linux x86_64) Firefox/140.0" }, "linux"],
            [{ platform: "Linux armv8l", userAgent: "Mozilla/5.0 (Linux; Android 14) Chrome/140.0" }, ""],
            [{ platform: "iPhone", userAgent: "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X)" }, ""],
            [{}, ""]]) {
            check("detectOs", JSON.stringify(nav), F.detectOs(nav), want, "");
          }
          // The .cmd launcher (cmd.exe is not available here): CRLF, UTF-8 code page,
          // and the -Target argument as cmd.exe and powershell -File will parse it.
          for (const [x, arg] of [["D:\\Thesis\\", '-Target "D:\\Thesis\\\\"'], ["\"D:\\x y\"", '-Target "D:\\x y"'], ["50% off", '-Target "50%% off"']]) {
            Object.assign(state, { os: "windows", target: x });
            const L = F.launcher(), run = L.text.find(l => l.startsWith("powershell "));
            check("cmd", x, [L.crlf, L.text.includes("chcp 65001 >nul"), run.includes(arg + " -NonInteractive")].join(), "true,true,true", run);
          }
          const canaries = cp.execSync(`find "${W}" -name "PWNED*"`).toString().trim();
          if (canaries) { bad++; console.log("injected command ran: " + canaries); }
          console.log(`${sh.length} bash and ${ps.length} PowerShell targets and the launchers checked, ${bad} failures`);
          process.exit(bad ? 1 : 0);
          EOF

      - name: Utility scripts on generated files (exit codes, safety checks)
        run: |
          W=/tmp/ci_util; rm -rf "$W"; mkdir -p "$W/good" "$W/evil" "$W/aes" "$W/zipmix" "$W/bomb" "$W/badzip"
          python - "$W" <<'EOF'
          import os, sys, unicodedata, zipfile
          from docx import Document
          w = sys.argv[1]
          d = Document()
          d.add_paragraph("Schmidt 2020, S. 15 führt aus. Müller (2021) stimmt zu. Die WHO (2019) auch. "
                          "Im Jahr 2020 stieg es. Die EU (2020) beschloss es. Das Kapitel (2020) zeigt es.")
          d.add_paragraph("U.S.A. and B2B, CO2, PM\u2081\u2080, 5G, BENELUX, GmbH; e.g. z. B. 2020.")
          d.add_paragraph("Fischers' (2020) Modell.")  # possessive of a name ending in s
          d.add_paragraph("Wie O\u2019Brien (2021) zeigt.")  # typographic apostrophe; the entry has a straight one
          d.add_heading("Literaturverzeichnis", 1)
          for entry in ("Schmidt, K. (2020). A.", "Müller, J. (2021). B.", "WHO. (2019). C.", "Fischers, P. (2020). E.", "O'Brien, K. (2021). F."):
              d.add_paragraph(entry)
          d.save(os.path.join(w, "ok.docx"))
          d.add_paragraph("Uncited, U. (2019). D.")
          d.add_paragraph("Van der Berg, J. (2017). G.")  # a capitalized particle does not hide an entry
          d.save(os.path.join(w, "findings.docx"))
          # recognized forms: highest-level heading wins, typed number and colon, slash
          # authors, u. a., Ö as first letter, a cited middle author, NFC, month/structure
          # words, a surname-like month after "von", a capitalized particle, a filler
          # after the lead word, a co-author with full given names after "/", three
          # authors named in the text, also in parentheses and after "However,", a German
          # genitive without apostrophe
          f = Document()
          f.add_heading("3.2 Sources", 2)
          f.add_paragraph(unicodedata.normalize("NFD", "(Müller/Schmidt 2019), Öztürk (2020), (Dawson u. a. 2018), "
                                               "Ellis (2018), (März 2021), (Tabelle 3, 2020), (von Mai 2020 bis Juni 2021), (v. Mai 2020 bis Juni 2021), (De Vries 2018), (vgl. auch Weber 2020), (Fischer/Wolf 2017), "
                                               "(e.g., De Dreu & Weingart, 2003). Van Dijk and De Vries (2019) argue. (De Vries 2018, Kap. 3). "
                                               "(see Le Grand 2007 for a critique). (De Beers, n.d.). (Weber, 1922, zit. nach Keller, 2018, S. 5). Braun (2017: 15 f.) widerspricht. "
                                               "Kraus, Lang und Roth (2016) zeigen es (vgl. Adam/Berg/Cohn 2015). (Nagel, Otto und Peters 2014). "
                                               "However, Quinn, Ross, and Stone (2013) argue. Luhmanns (1984) Begriff und Van Dijks (2019) Ansatz."))
          # the other forms docs/scripts.md lists: year suffixes, lowercase particles
          # (also abbreviated: v., v. d.), lead words, narrative page locators, a narrative et al.
          f.add_paragraph("(Wagner, 2022a) Schulz (2022a) zeigt. (van der Linde, 2020). (von Wright 2019). (de la Rosa, 2018). "
                          "(ter Horst, 2020). (ten Brink 2017). (siehe Hahn, 2020, S. 3). (cf. Smith, 2020, p. 15). (nach Vogel 2020). "
                          "Mayer (2020, S. 15) zeigt. Krause (2021: 15) auch. Brown et al. (2021) argue. "
                          "(v. Rosenstiel 2007). (v. d. Oelsnitz, 2019).")
          # secondary citations: the original before the marker needs no entry (Ortlieb,
          # Abel), and an original that has one is not reported as uncited (Zorn)
          f.add_paragraph("(Ortlieb 2009, S. 58, zitiert nach Sander 2017, S. 114). (Abel, 1999, as cited in Kurz, 2016). "
                          "(Zorn 2001, zit. n. Sander 2017).")
          # a repeated citation with ebd. or ibid. (in_text.repeated_citation) names no author
          f.add_paragraph("(ebd., S. 58). (vgl. ebd.). (Ebd.: 4). (ibid., p. 3). (Ibid.).")
          f.add_heading("7 Literaturverzeichnis:", 1)
          for entry in ("Müller, H./Schmidt, K. (2019). A.", "Öztürk, A. (2020). B.", "Dawson, R., Ellis, S., & Fowler, T. (2018). C.",
                        "De Vries, R. (2018). D.", "Weber, E. (2020). E.", "Fischer, Hans/Wolf, Karl (2017): G.",
                        "De Dreu, C. K. W., & Weingart, L. R. (2003). H.", "Van Dijk, T. A., & De Vries, R. (2019). I.",
                        "Le Grand, J. (2007). J.", "De Beers. (n.d.). K.", "Keller, T. (2018). L.", "Braun, P. (2017). M.", "Ders. (2019). N.",
                        "Kraus, A., Lang, B., & Roth, C. (2016). O.", "Adam, A./Berg, B./Cohn, C. (2015): P.",
                        "Nagel, N., Otto, O., & Peters, P. (2014). Q.", "Quinn, Q., Ross, R., & Stone, S. (2013). R.",
                        "Luhmann, N. (1984). S.", "Wagner, A. (2022a). T.", "Schulz, B. (2022a). U.", "van der Linde, C. (2020). V.",
                        "von Wright, G. H. (2019). W.", "de la Rosa, E. (2018). X.", "ter Horst, F. (2020). Y.", "ten Brink, G. (2017). Z.",
                        "Hahn, H. (2020). AA.", "Smith, J. (2020). AB.", "Vogel, V. (2020). AC.", "Mayer, M. (2020). AD.",
                        "Krause, K. (2021). AE.", "Brown, B., Green, G., & White, W. (2021). AF.",
                        "von Rosenstiel, L. (2007). AG.", "von der Oelsnitz, D. (2019). AH.",
                        "Sander, E. (2017). AI.", "Kurz, K. (2016). AJ.", "Zorn, Z. (2001). AK."):
              f.add_paragraph(entry)
          f.save(os.path.join(w, "forms.docx"))
          # prose that looks like a citation with a capitalized particle, a filler or
          # a list of names, and real citations after "de"/"Der"/"von" that must still
          # be reported when their entry is missing
          r = Document()
          r.add_paragraph("(Von der Rentenreform 2001 profitierten viele.) (Chirac/Le Pen 2002; La Liga 2018/19). "
                          "(see also Horizon 2020). (De Vries 2018). (Der Freitag, 2020). (de Winter et al., 2014). "
                          "(Meier 2019, S. 3). (Von Mai 2020 bis April 2021 wurden 300 Personen befragt.) "
                          "(Kopernikus, De revolutionibus, 1543). (Interview 7, La Paz, 2019). (Studie von Sommer, 2019). "
                          "Thatcher and Major (1979–1997) privatised. (von Herbst 2012 mit Daten für 1991 bis 2010 geschätzt). "
                          "However, Smith and Jones (2019) argue. Das Verfahren, das Müller und Schmidt (2019) entwickelt haben, gilt. "
                          "(Juni, Juli und August 2020). (January, February, and March 2021). "
                          "Reagan, Kohl und Thatcher (1980–1990) prägten die Dekade. (Adams, 2019). Adam (2015) stimmt zu. "
                          "(v. Wedel 2015). (Roe v. Wade, 1973). (Cranach d. Ä., 1530). "
                          "(Pohl 2005, zit. nach Adam 2015). Pohl (2005) zeigt es.")
          r.add_heading("References", 1)
          for entry in ("De Vries, R. (2018). A.", "Fischer, Hans, Titel, in Schulz, Eva/Meier, Karl (Hrsg.), Band, Berlin 2019.",
                        "Mai, Manfred (2018): Medienpolitik.", "Thatcher, M. (1993). Memoirs.", "Adam, A. (2015). B."):
              r.add_paragraph(entry)
          r.save(os.path.join(w, "prose.docx"))
          n = Document()
          n.add_paragraph("As shown in [1], it works.")
          n.add_heading("References", 1)
          n.add_paragraph('[1] J. Smith, "Title," Journal, 2020.')
          n.save(os.path.join(w, "numeric.docx"))
          a = Document()
          a.add_paragraph("Schmidt (2020) zeigt es.")
          a.add_heading("Literaturverzeichnis", 1)
          a.add_heading("Monographien", 2)
          a.add_paragraph("Schmidt, K. (2020). A.")
          a.add_paragraph("Keller, T. (2018). B.")
          a.add_heading("Gesetze, Verordnungen", 2)  # a sub-heading is not an entry
          a.add_heading("Anhang", 1)
          a.add_paragraph("Im Interview verwies die Befragte auf Keller (2018).")
          a.add_heading("Eidesstattliche Erklärung", 1)
          a.add_paragraph("Ort, Datum")
          a.save(os.path.join(w, "appendix.docx"))
          # a body paragraph that reads just "Literatur" does not start the bibliography
          # before the styled "Literaturverzeichnis" heading
          b = Document()
          for text in ("Müller (2020) zeigt es.", "Literatur", "Weber (2019) auch."):
              b.add_paragraph(text)
          b.add_heading("Literaturverzeichnis", 1)
          b.add_paragraph("Müller, H. (2020). A.")
          b.add_paragraph("Weber, E. (2019). B.")
          b.save(os.path.join(w, "plainlit.docx"))
          # a table whose first row holds a vertical-merge continuation (converter output)
          from docx.oxml import OxmlElement
          v = Document()
          vt = v.add_table(rows=2, cols=2)
          vt.cell(0, 1).text = "ABC"; vt.cell(1, 0).text = "DEF"; vt.cell(1, 1).text = "GHI"
          vt.rows[0]._tr.tc_lst[0].get_or_add_tcPr().append(OxmlElement("w:vMerge"))
          v.save(os.path.join(w, "vmerge.docx"))
          with zipfile.ZipFile(os.path.join(w, "notword.docx"), "w") as z:
              z.writestr("hello.txt", "a ZIP, but not a Word document")
          with zipfile.ZipFile(os.path.join(w, "good", "guide.pdf"), "w") as z:
              z.writestr("rules.txt", "Example rule text")
          with zipfile.ZipFile(os.path.join(w, "evil", "guide.pdf"), "w") as z:
              z.writestr("../../escaped.txt", "x")
          with zipfile.ZipFile(os.path.join(w, "bomb", "guide.pdf"), "w") as z:
              z.writestr("big.txt", "x")
              z.infolist()[0].file_size = 600 << 20  # declared unpacked size, over the 512 MiB cap
          with zipfile.ZipFile(os.path.join(w, "zipmix", "guide.pdf"), "w") as z:
              z.writestr("rules.txt", "Example rule text")
              z.writestr("broken.pdf", b"%PDF-1.4 broken")
          # a corrupt LZMA member and an entry without a name, then a good archive
          p = os.path.join(w, "badzip", "a_lzma.pdf")
          with zipfile.ZipFile(p, "w", zipfile.ZIP_LZMA) as z:
              z.writestr("rules.txt", "Rule text " * 2000)
          b = bytearray(open(p, "rb").read())
          i = b.find(b"rules.txt") + len(b"rules.txt") + 20
          b[i:i + 16] = bytes(x ^ 0xFF for x in b[i:i + 16])
          open(p, "wb").write(bytes(b))
          with zipfile.ZipFile(os.path.join(w, "badzip", "b_noname.pdf"), "w") as z:
              z.writestr("rules.txt", "Rule text")
              z.writestr(zipfile.ZipInfo(""), "x")
          with zipfile.ZipFile(os.path.join(w, "badzip", "c_guide.pdf"), "w") as z:
              z.writestr("./", "")  # a "./" folder entry, as bsdtar writes it, is no nameless entry
              z.writestr("./rules.txt", "Example rule text")
          # ok.docx plus a footnote whose acronym Word split across two runs
          with zipfile.ZipFile(os.path.join(w, "ok.docx")) as z, zipfile.ZipFile(os.path.join(w, "notes.docx"), "w") as out:
              for i in z.infolist():
                  data = z.read(i.filename)
                  if i.filename == "[Content_Types].xml":
                      data = data.replace(b"</Types>", b'<Override PartName="/word/footnotes.xml" ContentType='
                                          b'"application/vnd.openxmlformats-officedocument.wordprocessingml.footnotes+xml"/></Types>')
                  elif i.filename == "word/_rels/document.xml.rels":
                      data = data.replace(b"</Relationships>", b'<Relationship Id="rIdFn" Type="http://schemas.openxmlformats.org'
                                          b'/officeDocument/2006/relationships/footnotes" Target="footnotes.xml"/></Relationships>')
                  out.writestr(i, data)
              out.writestr("word/footnotes.xml", '<w:footnotes xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
                           '<w:footnote w:id="1"><w:p><w:r><w:t>Die UNES</w:t></w:r><w:r><w:t>CO.</w:t></w:r></w:p></w:footnote></w:footnotes>')
          # copy-protected guideline: AES-256, empty open password (needs pypdf[crypto])
          from pypdf import PdfWriter
          from pypdf.generic import DictionaryObject, NameObject, StreamObject
          pw = PdfWriter()
          page = pw.add_blank_page(width=300, height=200)
          font = DictionaryObject({NameObject("/Type"): NameObject("/Font"), NameObject("/Subtype"): NameObject("/Type1"),
                                   NameObject("/BaseFont"): NameObject("/Helvetica")})
          page[NameObject("/Resources")] = DictionaryObject({NameObject("/Font"): DictionaryObject({NameObject("/F1"): pw._add_object(font)})})
          content = StreamObject()
          content.set_data(b"BT /F1 12 Tf 20 100 Td (Encrypted rule text) Tj ET")
          page[NameObject("/Contents")] = pw._add_object(content)
          pw.encrypt(user_password="", owner_password="owner", algorithm="AES-256")
          pw.write(os.path.join(w, "aes", "guide.pdf"))
          EOF
          expect() {
            want=$1; shift
            set +e; "$@" >"$W/out.txt" 2>&1; code=$?; set -e
            if [ "$code" -ne "$want" ]; then cat "$W/out.txt"; echo "expected exit $want, got $code: $*"; exit 1; fi
          }
          # bibliography_check.py: 0 = consistent, 1 = findings, 2 = unreadable input (one line)
          expect 0 python scripts/bibliography_check.py "$W/ok.docx"
          expect 1 python scripts/bibliography_check.py "$W/findings.docx"
          grep -q Uncited "$W/out.txt"
          grep -q Berg "$W/out.txt"
          expect 2 python scripts/bibliography_check.py "$W/notword.docx"
          test "$(wc -l < "$W/out.txt")" -eq 1
          expect 0 python scripts/bibliography_check.py "$W/forms.docx"
          sed -n '/original of a secondary citation/,/^$/p' "$W/out.txt" > "$W/secondary.txt"
          for a in Ortlieb Abel; do grep -qx "    $a" "$W/secondary.txt"; done
          if grep -qx "    Zorn" "$W/out.txt"; then echo "listed original Zorn reported"; exit 1; fi
          expect 1 python scripts/bibliography_check.py "$W/prose.docx"
          # (Adams: a German genitive counts as the listed name only in that form;
          # Pohl: an original also cited the usual way still needs its entry)
          for a in Freitag Winter Meier Fischer Mai Sommer Thatcher Herbst Adams Wedel Pohl; do grep -qx "    $a" "$W/out.txt"; done
          if grep -q "original of a secondary citation" "$W/out.txt"; then echo "Pohl listed as a secondary original only"; exit 1; fi
          for a in Rentenreform Chirac Pen Liga Horizon Vries De Interview However Verfahren Juni Juli August January February March Wade Ä.; do
            if grep -qx "    $a" "$W/out.txt"; then echo "prose read as a citation of $a"; exit 1; fi
          done
          # a numeric bibliography cannot be checked: exit 2, not a passed check
          expect 2 python scripts/bibliography_check.py "$W/numeric.docx"
          # the bibliography ends at the next top-level heading (appendix, declaration)
          expect 0 python scripts/bibliography_check.py "$W/appendix.docx"
          expect 0 python scripts/bibliography_check.py "$W/plainlit.docx"
          # a heading added to BIBLIOGRAPHY_HEADERS as it is spelled in the document is found
          python -c "import sys; sys.path.insert(0, 'scripts'); import bibliography_check as b; b.BIBLIOGRAPHY_HEADERS.append('Works Consulted'); assert b.split_text_and_bibliography([('(Smith, 2020).', None), ('Works Consulted', 1), ('Smith, J. (2020). X.', None)])[1]"
          # abbreviations_extract.py: dotted, digit and mixed-case forms; clean error otherwise
          expect 0 python scripts/abbreviations_extract.py "$W/ok.docx"
          for a in B2B CO2 PM10 5G BENELUX GmbH; do grep -qx "  $a" "$W/out.txt"; done
          if grep -qx "  US" "$W/out.txt"; then echo "U.S.A. was truncated to US"; exit 1; fi
          expect 1 python scripts/abbreviations_extract.py "$W/notword.docx"
          test "$(wc -l < "$W/out.txt")" -eq 1
          # footnotes are read, and an acronym split across runs stays whole
          expect 0 python scripts/abbreviations_extract.py "$W/notes.docx"
          grep -qx "  UNESCO" "$W/out.txt"
          # a table with an irregular vertical merge is read, not ended with a traceback
          expect 0 python scripts/abbreviations_extract.py "$W/vmerge.docx"
          for a in ABC DEF GHI; do grep -qx "  $a" "$W/out.txt"; done
          # docx_postprocess.sh: hyphenation on, package still valid, [Content_Types].xml first,
          # permission bits of the replaced file kept
          chmod 600 "$W/ok.docx"
          expect 0 bash scripts/docx_postprocess.sh "$W/ok.docx"
          test "$(stat -c %a "$W/ok.docx")" = 600
          # a read-only document is replaced without a question in a terminal (GNU mv
          # would ask, BSD mv report success when declined) and stays read-only
          # (the runner is no root user, for whom mv would not ask)
          cp "$W/findings.docx" "$W/ro.docx"; chmod 444 "$W/ro.docx"
          echo n | script -qec "bash scripts/docx_postprocess.sh $W/ro.docx" /dev/null >/dev/null
          test "$(stat -c %a "$W/ro.docx")" = 444
          unzip -p "$W/ro.docx" word/settings.xml | grep -q autoHyphenation
          # a symbolic link to the document: the document is patched, the link stays
          cp "$W/findings.docx" "$W/target.docx"; ln -s target.docx "$W/linked.docx"
          expect 0 bash scripts/docx_postprocess.sh "$W/linked.docx"
          test -L "$W/linked.docx"
          unzip -p "$W/target.docx" word/settings.xml | grep -q autoHyphenation
          python - "$W/ok.docx" <<'EOF'
          import sys, zipfile, docx
          docx.Document(sys.argv[1])
          z = zipfile.ZipFile(sys.argv[1])
          assert z.testzip() is None
          assert z.infolist()[0].filename == "[Content_Types].xml"
          assert "<w:autoHyphenation/>" in z.read("word/settings.xml").decode()
          # variants: a disabled open/close element; a non-w: namespace prefix
          W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main"
          for name, xml in (
              ("openclose.docx", z.read("word/settings.xml").decode().replace(
                  "<w:autoHyphenation/>", '<w:autoHyphenation w:val="0"></w:autoHyphenation>')),
              ("prefix.docx", '<ns0:settings xmlns:ns0="%s"><ns0:zoom ns0:percent="100"/></ns0:settings>' % W),
          ):
              with zipfile.ZipFile(sys.argv[1].replace("ok.docx", name), "w") as out:
                  for i in z.infolist():
                      out.writestr(i.filename, xml if i.filename == "word/settings.xml" else z.read(i.filename))
          EOF
          expect 0 bash scripts/docx_postprocess.sh "$W/openclose.docx"
          test "$(unzip -p "$W/openclose.docx" word/settings.xml | grep -o '<w:autoHyphenation' | wc -l)" -eq 1
          unzip -p "$W/openclose.docx" word/settings.xml | grep -q '<w:autoHyphenation/>'
          # the format-verifier's read-only flag check, run as its definition gives it
          flagcheck() { bash -c "$(grep -m1 '^python3 -c .*hyphenation flag' .claude/agents/format-verifier.md | sed 's#^python3 #python #; s#workspace/output/document\.docx$#"$1"#')" flagcheck "$1"; }
          flagcheck "$W/ok.docx" | grep -qx 'hyphenation flag: set'
          flagcheck "$W/openclose.docx" | grep -qx 'hyphenation flag: set'
          flagcheck "$W/findings.docx" | grep -qx 'hyphenation flag: missing'
          cp "$W/prefix.docx" "$W/prefix.orig"
          flagcheck "$W/prefix.orig" | grep -qx 'hyphenation flag: missing'
          expect 1 bash scripts/docx_postprocess.sh "$W/prefix.docx"
          cmp "$W/prefix.docx" "$W/prefix.orig"
          # a symbolic-link entry is refused before anything is unpacked, and the file stays as it was
          python - "$W/ok.docx" "$W/link.docx" <<'EOF'
          import stat, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z, zipfile.ZipFile(sys.argv[2], "w") as out:
              for i in z.infolist():
                  out.writestr(i, z.read(i.filename))
              link = zipfile.ZipInfo("word/media/image1.png")
              link.create_system = 3
              link.external_attr = (stat.S_IFLNK | 0o777) << 16
              out.writestr(link, "../../../in.docx")
          EOF
          cp "$W/link.docx" "$W/link.orig"
          expect 1 bash scripts/docx_postprocess.sh "$W/link.docx"
          grep -q "symbolic links" "$W/out.txt"
          cmp "$W/link.docx" "$W/link.orig"
          # also a link declared only in Info-ZIP's ASi extra field: unzip applies its
          # mode when the attributes carry no Unix bits (0x20, the MS-DOS archive bit;
          # Git Bash's unzip then writes a copy of the target). The pre-check reads
          # the field in any case (0o644 variant).
          for attr in 0x20 0o644; do
            python - "$W/ok.docx" "$W/asilink.docx" "$attr" <<'EOF'
          import stat, struct, sys, zipfile, zlib
          with zipfile.ZipFile(sys.argv[1]) as z, zipfile.ZipFile(sys.argv[2], "w") as out:
              for i in z.infolist():
                  out.writestr(i, z.read(i.filename))
              target = b"../../../in.docx"
              asi = struct.pack("<IHIHH", zlib.crc32(target), stat.S_IFLNK | 0o777, 0, 0, 0) + target
              link = zipfile.ZipInfo("word/media/image1.png")
              link.create_system = 3
              link.external_attr = int(sys.argv[3], 0) if sys.argv[3] == "0x20" else 0o644 << 16
              link.extra = struct.pack("<HH", 0x756E, len(asi)) + asi
              out.writestr(link, target)
          EOF
            cp "$W/asilink.docx" "$W/asilink.orig"
            expect 1 bash scripts/docx_postprocess.sh "$W/asilink.docx"
            grep -q "symbolic links" "$W/out.txt"
            cmp "$W/asilink.docx" "$W/asilink.orig"
          done
          # a file named like the repacked document is not ours: it is neither
          # overwritten nor deleted, and no temporary archive is left behind
          cp "$W/ok.docx" "$W/own.docx"; echo notes > "$W/own.docx.new"
          expect 0 bash scripts/docx_postprocess.sh "$W/own.docx"
          test "$(cat "$W/own.docx.new")" = notes
          test "$(ls "$W" | grep -c '^own\.docx\.')" -eq 1
          # [ ] in the name is not a wildcard: unzip must not open "Chapter 2.docx" instead
          cp "$W/ok.docx" "$W/Chapter [2].docx"; cp "$W/findings.docx" "$W/Chapter 2.docx"
          expect 0 bash scripts/docx_postprocess.sh "$W/Chapter [2].docx"
          expect 0 python scripts/bibliography_check.py "$W/Chapter [2].docx"
          # extract_styleguide.sh without Python (pdftotext-only mode) reads the same
          # files as the Python path, a linked PDF included; pdftotext is stubbed, as
          # only the file selection is tested here
          mkdir -p "$W/nopy" "$W/lg"
          for b in bash find sort head tr grep wc rm basename cat mkdir dirname env ls mktemp; do
            ln -s "$(command -v "$b")" "$W/nopy/$b"
          done
          cat > "$W/nopy/pdftotext" <<'STUB'
          #!/bin/bash
          echo "text" > "${@: -1}"
          STUB
          chmod +x "$W/nopy/pdftotext"
          printf '%%PDF-1.4 stub' > "$W/lg/a.pdf"; ln -s a.pdf "$W/lg/b.pdf"
          PATH="$W/nopy" bash scripts/extract_styleguide.sh "$W/lg" "$W/lg_out" > "$W/out.txt" 2>&1
          grep -q 'pdftotext-only' "$W/out.txt"
          test -f "$W/lg_out/a.txt"
          test -f "$W/lg_out/b.txt"
          # ... also when the guidelines folder itself is given as a link
          ln -s lg "$W/lglink"
          PATH="$W/nopy" bash scripts/extract_styleguide.sh "$W/lglink" "$W/lgl_out" > "$W/out.txt" 2>&1
          test -f "$W/lgl_out/a.txt"
          test -f "$W/lgl_out/b.txt"
          # extract_styleguide.sh: a ZIP disguised as PDF is unpacked; path traversal is blocked
          expect 0 bash scripts/extract_styleguide.sh "$W/good" "$W/out_good"
          grep -q "Example rule text" "$W/out_good/guide.txt"
          # a text file left over from an earlier run is named, not deleted
          echo old > "$W/out_good/removed_guide.txt"
          expect 0 bash scripts/extract_styleguide.sh "$W/good" "$W/out_good"
          grep -q "not written by this run.*removed_guide.txt" "$W/out.txt"
          test -f "$W/out_good/removed_guide.txt"
          expect 1 bash scripts/extract_styleguide.sh "$W/evil" "$W/out_evil"
          grep -q "Blocked (security)" "$W/out.txt"
          # a disguised ZIP over the unpacked-size cap is blocked before unpacking
          expect 1 bash scripts/extract_styleguide.sh "$W/bomb" "$W/out_bomb"
          grep -q "Blocked (security): archive too large" "$W/out.txt"
          # a PDF inside a disguised ZIP that cannot be read is an error, not a silent gap
          expect 1 bash scripts/extract_styleguide.sh "$W/zipmix" "$W/out_zipmix"
          grep -q "ERR broken.pdf (in archive)" "$W/out.txt"
          grep -q "Example rule text" "$W/out_zipmix/guide.txt"
          # a corrupt or nameless archive entry is reported for its file, and the run goes on
          expect 1 bash scripts/extract_styleguide.sh "$W/badzip" "$W/out_badzip"
          grep -q "ERR a_lzma.pdf - could not unpack archive" "$W/out.txt"
          grep -q "Blocked (security): Zip contains an entry without a file name" "$W/out.txt"
          grep -q "Example rule text" "$W/out_badzip/c_guide.txt"
          expect 0 bash scripts/extract_styleguide.sh "$W/aes" "$W/out_aes"
          grep -q "Encrypted rule text" "$W/out_aes/guide.txt"
          # cross_session_audit.py: 0 = clean, 1 = findings, 2 = not a repository
          g() { git -c user.name=ci -c user.email=ci@example.com "$@"; }
          g init -q "$W/repo" && g -C "$W/repo" commit -q --allow-empty -m init
          expect 0 python scripts/cross_session_audit.py --repo-root "$W/repo"
          # its own --report-file is no finding on the next run (new folder, space in the name)
          for i in 1 2; do expect 0 python scripts/cross_session_audit.py --repo-root "$W/repo" --report-file "$W/repo/audit/my report.md"; done
          rm -rf "$W/repo/audit"
          g -C "$W/repo" worktree add -q -b side "$W/side"
          echo "# note" > "$W/side/_note.md"
          expect 1 python scripts/cross_session_audit.py --repo-root "$W/side"
          grep -qF "**Main worktree:** \`$W/repo\`" "$W/out.txt"
          expect 2 python scripts/cross_session_audit.py --repo-root "$W/good"
          # a dangling ref in a phase README.md is found (only top-level framework docs are skipped)
          g init -q "$W/refs" && mkdir -p "$W/refs/03_Theory"
          printf 'see `03_Theory/missing.md`\n' > "$W/refs/03_Theory/README.md"
          g -C "$W/refs" add -A && g -C "$W/refs" commit -qm refs
          expect 1 python scripts/cross_session_audit.py --repo-root "$W/refs"
          grep -qF '`03_Theory/missing.md`' "$W/out.txt"
          # an earlier report kept in the repository (e.g. a dated one) is not scanned for refs
          expect 1 python scripts/cross_session_audit.py --repo-root "$W/refs" --report-file "$W/refs/audit/w1.md"
          g -C "$W/refs" add -A && g -C "$W/refs" commit -qm w1
          expect 1 python scripts/cross_session_audit.py --repo-root "$W/refs" --report-file "$W/refs/audit/w2.md"
          grep -qF 'links to non-existent files):** 1' "$W/out.txt"
          # a worktree whose folder is missing (moved, unmounted) is an error, not a clean result
          g -C "$W/refs" worktree add -q -b gone "$W/gone" && mv "$W/gone" "$W/gone.moved"
          expect 2 python scripts/cross_session_audit.py --repo-root "$W/refs"
          # a bare repository with a worktree made inside it: Layer 2 does not read the
          # worktree's files with references resolved from the bare folder
          mkdir -p "$W/src/03_Theory"
          printf 'see `03_Theory/chapter_3.md`\n' > "$W/src/03_Theory/README.md"
          echo "# ch3" > "$W/src/03_Theory/chapter_3.md"
          g init -q "$W/src" && g -C "$W/src" add -A && g -C "$W/src" commit -qm src
          g clone -q --bare "$W/src" "$W/bare.git" && g -C "$W/bare.git" worktree add -q main
          expect 0 python scripts/cross_session_audit.py --repo-root "$W/bare.git/main"

      - name: state_check.py on a state file (open items, rows, word counts, long lines)
        run: |
          W=/tmp/ci_state; rm -rf "$W"; mkdir -p "$W/ch" "$W/ch2"
          expect() {
            local want=$1; shift
            set +e; "$@" > "$W/out.txt" 2>&1; local got=$?; set -e
            if [ "$got" != "$want" ]; then echo "expected exit $want, got $got: $*"; cat "$W/out.txt"; exit 1; fi
          }
          has() { grep -qF -- "$1" "$W/out.txt" || { echo "missing: $1"; cat "$W/out.txt"; exit 1; }; }
          hasnt() { if grep -qF -- "$1" "$W/out.txt"; then echo "unexpected: $1"; cat "$W/out.txt"; exit 1; fi; }
          quote=$(printf 'x%.0s' $(seq 1 600))
          printf '%s\n' '# State' '' '## Current state' '- Workflow: seminar_2agent' '- Page count: 2 of 3' '' \
            '## Chapter status' '| Chapter | Written | Source-verified |' '|:-|:-:|-|' \
            '| 2 Body | ✅ ch_2_body.md, 4 of 600 words | ✅ R1: ✅ 3; loop 0 |' '' \
            '## Source registry (WITH ORIGINAL QUOTES)' "| Src | 2 | 5 | $quote | paraphrase |" '' \
            '## Open issues' '- [ ] An open item' '- [x] A ticked item' > "$W/state.md"
          printf '%s\n' '# Body' '' 'One two three.' > "$W/ch/ch_2_body.md"
          printf 'not a chapter\n' > "$W/ch/.gitkeep"
          expect 0 python scripts/state_check.py "$W/state.md" "$W/ch"
          has '(17 lines)'
          has 'Summary: open items 1, ticked 1; chapter files counted 1 of 1; lines over 500 characters in Current state and Chapter status: 0'
          has 'l. 4: - Workflow: seminar_2agent'
          has '1 row(s) below the table'
          has 'l. 10: | 2 Body | ✅ ch_2_body.md, 4 of 600 words | ✅ R1: ✅ 3; loop 0 |'
          has 'l. 16 [Open issues]: - [ ] An open item'
          has 'ch_2_body.md: Words: 4 '                   # the heading counts, as with --words
          hasnt 'gitkeep'
          # a long line in Current state, or a long row in Chapter status: exit 1, named with its line
          long=$(printf 'y%.0s' $(seq 1 520))
          sed "s/^- Workflow: seminar_2agent\$/- Last agent: $long/" "$W/state.md" > "$W/long.md"
          expect 1 python scripts/state_check.py "$W/long.md"
          has 'l. 4 [Current state], 534 characters'
          has 'Shorten each'
          sed "s/^| 2 Body | /| 2 Body $long | /" "$W/state.md" > "$W/longrow.md"
          expect 1 python scripts/state_check.py "$W/longrow.md"
          has 'l. 10 [Chapter status]'
          # any heading ends a section; a heading may carry more words; a long line elsewhere does not count
          printf '%s\n' '### Current state (2026-10-28)' '- Stand: offen' '## Chapter status' '| A | B |' \
            '#### Notes' "$long" '- [ ] An item under the notes' > "$W/levels.md"
          expect 0 python scripts/state_check.py "$W/levels.md"
          has 'l. 2: - Stand: offen'
          has 'l. 7 [Notes]: - [ ] An item under the notes'
          # Windows line endings, a byte order mark, UTF-16 and Windows-1252 are read the same way
          sed 's/$/\r/' "$W/state.md" > "$W/crlf.md"
          expect 0 python scripts/state_check.py "$W/crlf.md"
          has '(17 lines)'
          has 'l. 16 [Open issues]: - [ ] An open item'
          printf '\xef\xbb\xbf' | cat - "$W/state.md" > "$W/bom.md"
          expect 0 python scripts/state_check.py "$W/bom.md"
          has 'l. 4: - Workflow: seminar_2agent'
          iconv -f utf-8 -t utf-16 "$W/state.md" > "$W/utf16.md"
          expect 0 python scripts/state_check.py "$W/utf16.md"
          has 'l. 16 [Open issues]: - [ ] An open item'
          printf '## Current state\n- Stand: Prüfung\n## Chapter status\n' | iconv -f utf-8 -t cp1252 > "$W/ansi.md"
          expect 0 python scripts/state_check.py "$W/ansi.md"
          has 'l. 2: - Stand: Prüfung'
          # a chapter it cannot count is named, and the report goes on with the state file's exit code
          printf 'not a zip' > "$W/ch2/broken.docx"; printf 'x' > "$W/ch.pdf"
          expect 1 python scripts/state_check.py "$W/long.md" "$W/ch2" "$W/ch.pdf" "$W/none" "$W/ch/ch_2_body.md"
          has 'chapter files counted 1 of 2'
          has 'broken.docx: not counted:'
          has 'ch.pdf: not counted (not a .md, .txt or .docx chapter)'
          has 'none: not found'
          has 'l. 4 [Current state], 534 characters'
          # not a state file, a missing state file, no arguments: exit 2
          printf '# Notes\n' > "$W/notes.md"
          expect 2 python scripts/state_check.py "$W/notes.md"
          has 'no "Current state" heading'
          expect 2 python scripts/state_check.py "$W/missing.md"
          expect 2 python scripts/state_check.py
          expect 0 python scripts/state_check.py --help
          has 'Exit codes:'

      - name: repeated_citations.py on chapter files (pairs, footnotes, reference list, order, errors)
        run: |
          W=/tmp/ci_repeated; rm -rf "$W"; mkdir -p "$W/ch/sub" "$W/other" "$W/empty"
          python - "$W" <<'EOF'
          import os, sys
          w = sys.argv[1]
          def put(name, text, encoding="utf-8"):
              with open(os.path.join(w, name), "w", encoding=encoding, newline="") as f:
                  f.write(text)
          put("ch/ch_1_intro.md",
              "---\nchapter: 1\ntitle: \"Einleitung (Keller 2018)\"\n---\n# 1 Einleitung\n\n"
              # line 7: ebd. after a citation; line 8: a citation over a line break
              "Ein Satz (vgl. Keller 2018, S.\\ 4). Noch einer (ebd., S.\\ 5). Und einer\n"
              "über zwei Zeilen (vgl. Keller\n2018, S.\\ 6).\n\n"
              # a comment and a code block are no text
              "<!-- (Keller 2018, S. 7) -->\n\n```r\nx <- f(1)  # (Keller 2018)\n```\n\n"
              # line 17: a citation in the sentence between two of Keller: no pair
              "Nach Weber (2019, S. 12) gilt das. Wieder Keller (Keller 2018, S. 8).\n"
              # line 18: two sources, then ebd.: the source named last
              "Zwei Quellen (vgl. Keller 2018, S.\\ 9; Weber/Schulz 2020, S. 3), dann (ebd., S. 4).\n"
              # line 19: the same source in other forms; a parenthesis with a year that is no citation
              "Dann (Weber & Schulz, 2020, p. 6), Weber und Schulz (2020, S. 7) und eine Zahl (Stand 2020).\n")
          put("ch/ch_2_body.md",
              "# 2 Hauptteil\n\n"
              # line 3: et al. and u. a. are one source
              "Weiter mit Weber und Schulz (2020). Dann (Müller et al. 2017) und (Müller u. a. 2017, S. 3).\n\n"
              # line 5: a block quote's citation
              "> Ein Blockzitat, lang genug für eines. (Müller et al. 2017, S. 4)\n\n"
              # line 7: three pairs in one line, after a secondary citation too
              "Danach (ebd., S. 5). Sekundär (Weber 1922, S.\\ 31, zit. nach Keller 2018, S.\\ 5), dann (ebd., S. 6)"
              " und (Keller 2018, S. 7).\n"
              # line 8: two years, two letters
              "Jahre (Keller 2018, 2020), dann (Keller 2020, S. 3). Briefe (Brown 2019a, b), dann (Brown 2019b, S. 2).\n"
              # line 9: no date; a footnote between two citations of Berg
              "Ohne Jahr (Horst o. J.) und (Horst o. J., S. 2). Eine Fußnote.[^1] Danach (Berg 2015).\n"
              # line 10: a page alone, a non-breaking space, a name particle
              "Seite allein (S. 45), dann (vgl. auch Berg 2015, S. 46) und (von Wagner 2016) (ebd.).\n\n"
              "| A | B |\n|---|---|\n| 1 | 2 |\n\n"
              # line 16: a table's source line is a citation too, so line 18 is no pair
              "Quelle: Smith 2010, S. 3\n\n"
              "Nach der Tabelle (Wagner 2016, S. 8).\n\n"
              # line 20: the footnote, read at its mark in line 9
              "[^1]: Vgl. Berg 2015, S. 3; dazu (Berg 2015, S. 4).\n")
          put("ch/ch_10_end.md",
              "# 10 Fazit\n\n"
              # line 3: ebd. right after the last citation of the chapter file before; citekeys
              "(ebd., S. 9). Citekeys [@keller2018, p. 5], [see @keller2018, p. 6; @weber2019] and @weber2019 [p. 7].\n"
              # line 4: a secondary citation with a citekey
              "Secondary [Weber 1922, S.\\ 31, zit. nach @keller2018, S. 5], then [@keller2018, S. 6].\n"
              # line 5: an e-mail address is no citekey; APA forms, ibid.
              "Mail name@example.com (Smith, 2001, as cited in Jones, 2015), (Jones, 2015, p. 4), (Ibid., p. 5) and (ibid.).\n\n"
              "```{=openxml}\n<w:p><w:r><w:br w:type=\"page\"/></w:r></w:p>\n```\n\n"
              # lines 11-17: the reference list is left out
              "# Literaturverzeichnis\n\n::: {custom-style=\"Bibliography\"}\nKeller, Anna (2018): Titel. Ort: Verlag.\n\n"
              "Weber, Bernd (2019): Titel. Ort: Verlag, S.\\ 1–20.\n:::\n")
          # not read from a folder: a hidden file, a .txt file, a subfolder
          for name in ("ch/.hidden.md", "ch/notes.txt", "ch/sub/ch_9_draft.md"):
              put(name, "(Keller 2018) (Keller 2018)\n")
          put("alone.md", "(ebd.) Ein Satz (S. 4).\n\nDann (Keller 2018) und (Weber 2019).\n")
          # a year in parentheses after a word is a citation only with a locator after it
          put("prose.md", "Ein Wert (Keller 2018, S. 4), in Deutschland (2020: 5,9 %) und im Umsatz (2020, in Mio. €),"
              " dann (ebd., S. 5).\nSmith's (2020) study and Smith (2020, p. 4) agree.\n")
          put("other/ch_1_intro.md", "(Smith 2010) (ibid.)\n")
          put("crlf.md", "(Keller 2018, S. 4)\r\n(ebd., S. 5)\r\n")
          put("utf16.md", "(Müller 2017, S. 4)\n(ebd., S. 5)\n", encoding="utf-16")
          put("ansi.md", "(Müller 2017, S. 4)\n(ebd., S. 5)\n", encoding="cp1252")
          put("chapter.docx", "not a zip")
          EOF
          expect() {
            local want=$1; shift
            set +e; "$@" > "$W/out.txt" 2>&1; local got=$?; set -e
            if [ "$got" != "$want" ]; then echo "expected exit $want, got $got: $*"; cat "$W/out.txt"; exit 1; fi
            if grep -q '^Traceback' "$W/out.txt"; then cat "$W/out.txt"; echo "traceback: $*"; exit 1; fi
          }
          has() { grep -qF -- "$1" "$W/out.txt" || { echo "missing: $1"; cat "$W/out.txt"; exit 1; }; }
          hasnt() { if grep -qF -- "$1" "$W/out.txt"; then echo "unexpected: $1"; cat "$W/out.txt"; exit 1; fi; }
          # a folder: its .md files in the order of their numbers, one pair per line
          expect 0 python scripts/repeated_citations.py "$W/ch"
          has 'read in this order: ch_1_intro.md, ch_2_body.md, ch_10_end.md'
          has 'Reference list left out: ch_10_end.md, l. 11–17'
          has 'Pairs: 28'
          has '- ch_1_intro.md:7 — Keller 2018, cited again as `(ebd., S.\ 5)`'
          has '- ch_1_intro.md:8 — Keller 2018, cited again as `(vgl. Keller 2018, S.\ 6)`'
          hasnt 'ch_1_intro.md:17 —'
          has '- ch_1_intro.md:18 — Keller 2018, cited again as `vgl. Keller 2018, S.\ 9` in `(vgl. Keller 2018, S.\ 9; Weber/Schulz 2020, S. 3)`'
          has '- ch_1_intro.md:18 — Weber/Schulz 2020, cited again as `(ebd., S. 4)`; the previous citation names 2 sources: `(vgl. Keller 2018, S.\ 9; Weber/Schulz 2020, S. 3)`; read as the source named last'
          has '- ch_1_intro.md:19 — Weber & Schulz 2020, cited again as `(Weber & Schulz, 2020, p. 6)`'
          has '- ch_1_intro.md:19 — Weber und Schulz 2020, cited again as `Weber und Schulz (2020, S. 7)`'
          hasnt 'Stand 2020'
          has '- ch_2_body.md:3 — Weber und Schulz 2020, cited again as `Weber und Schulz (2020)`; the previous citation is in ch_1_intro.md:19: `Weber und Schulz (2020, S. 7)`'
          has '- ch_2_body.md:3 — Müller u. a. 2017, cited again as `(Müller u. a. 2017, S. 3)`'
          has '- ch_2_body.md:5 — Müller et al. 2017, cited again as `(Müller et al. 2017, S. 4)`'
          test "$(grep -c '^- ch_2_body.md:7 — ' "$W/out.txt")" = 3 || { echo "expected 3 pairs in ch_2_body.md:7"; cat "$W/out.txt"; exit 1; }
          has '- ch_2_body.md:7 — Keller 2018, cited again as `(ebd., S. 6)`; the previous citation is a secondary citation: `(Weber 1922, S.\ 31, zit. nach Keller 2018, S.\ 5)`; read as the source named last'
          has '- ch_2_body.md:8 — Keller 2020, cited again as `(Keller 2020, S. 3)`; the previous citation names 2 sources: `(Keller 2018, 2020)`'
          has '- ch_2_body.md:8 — Brown 2019b, cited again as `(Brown 2019b, S. 2)`; the previous citation names 2 sources: `(Brown 2019a, b)`'
          has '- ch_2_body.md:9 — Horst o. J., cited again as `(Horst o. J., S. 2)`'
          has '- ch_2_body.md:20 — Berg 2015, cited again as `(Berg 2015, S. 4)` (footnote [^1], marked in l. 9)'
          has '- ch_2_body.md:9 — Berg 2015, cited again as `(Berg 2015)`'
          has '- ch_2_body.md:10 — Berg 2015, cited again as `(S. 45)`'
          has "$(printf -- '- ch_2_body.md:10 — Berg 2015, cited again as `(vgl. auch Berg 2015, S.\302\24046)`')"
          has '- ch_2_body.md:10 — von Wagner 2016, cited again as `(ebd.)`'
          has 'Smith 2010 (1)'
          hasnt 'ch_2_body.md:18 —'
          has '- ch_10_end.md:3 — Wagner 2016, cited again as `(ebd., S. 9)`; the previous citation is in ch_2_body.md:18: `(Wagner 2016, S. 8)`'
          has '- ch_10_end.md:3 — @keller2018, cited again as `see @keller2018, p. 6` in `[see @keller2018, p. 6; @weber2019]`'
          has '- ch_10_end.md:3 — @weber2019, cited again as `@weber2019 [p. 7]`; the previous citation names 2 sources'
          has '- ch_10_end.md:4 — @keller2018, cited again as `[@keller2018, S. 6]`; the previous citation is a secondary citation: `[Weber 1922, S.\ 31, zit. nach @keller2018, S. 5]`'
          has '- ch_10_end.md:5 — Jones 2015, cited again as `(Jones, 2015, p. 4)`; the previous citation is a secondary citation'
          has '- ch_10_end.md:5 — Jones 2015, cited again as `(Ibid., p. 5)`'
          has '- ch_10_end.md:5 — Jones 2015, cited again as `(ibid.)`'
          has 'Citekeys: the export shows the form the CSL style gives'
          hasnt '@example'
          hasnt 'Anna'
          has 'Keller 2018 (9)'                         # not the hidden file, the .txt file or the subfolder
          hasnt 'no citation before it'
          # files in the order given; an ebd. with no citation before it
          expect 0 python scripts/repeated_citations.py "$W/ch/ch_10_end.md" "$W/ch/ch_1_intro.md"
          has 'read in this order: ch_10_end.md, ch_1_intro.md'
          has '- ch_1_intro.md:7 — Keller 2018, cited again as `(ebd., S.\ 5)`'
          has 'ebd., ibid. or a page alone with no citation before it: 1'
          has '- ch_10_end.md:3 — `(ebd., S. 9)`'
          expect 0 python scripts/repeated_citations.py "$W/alone.md"
          has 'Pairs: 0'
          has 'Reference list left out: none found in these files'
          has '- alone.md:1 — `(ebd.)`'
          has '- alone.md:1 — `(S. 4)`'
          expect 0 python scripts/repeated_citations.py "$W/prose.md"
          has '- prose.md:1 — Keller 2018, cited again as `(ebd., S. 5)`'
          has '- prose.md:2 — Smith 2020, cited again as `Smith (2020, p. 4)`'
          hasnt 'Deutschland'
          hasnt 'Umsatz'
          # two files of the same name are named by their path
          expect 0 python scripts/repeated_citations.py "$W/ch" "$W/other/ch_1_intro.md"
          has "- $W/other/ch_1_intro.md:1 — Smith 2010, cited again as \`(ibid.)\`"
          has "- $W/ch/ch_1_intro.md:7 — Keller 2018"
          # a footnote's form keeps its period; a file named twice is read once; a heading with
          # a long run of spaces (a blanked comment) takes no time
          printf '%s\n' '# Text' '' 'Ein Satz.[^1] Noch einer.[^2]' '' '[^1]: Keller 2018, S. 4.' '[^2]: Ebd.' > "$W/notes.md"
          expect 0 python scripts/repeated_citations.py "$W/notes.md" "$W/./notes.md" "$W/notes.md"
          has 'read in this order: notes.md'
          hasnt 'notes.md, '
          has '- notes.md:6 — Keller 2018, cited again as `Ebd.` (footnote [^2]'
          printf '## Grundlagen%3000s und Begriffe\n\nText (Keller 2018). Dann (ebd.).\n' '' > "$W/slow.md"
          expect 0 timeout 20 python scripts/repeated_citations.py "$W/slow.md"
          has '- slow.md:3 — Keller 2018, cited again as `(ebd.)`'
          # Windows line endings, UTF-16 and Windows-1252 are read the same way
          expect 0 python scripts/repeated_citations.py "$W/crlf.md" "$W/utf16.md" "$W/ansi.md"
          has '- crlf.md:2 — Keller 2018, cited again as `(ebd., S. 5)`'
          has '- utf16.md:2 — Müller 2017, cited again as `(ebd., S. 5)`'
          has '- ansi.md:2 — Müller 2017, cited again as `(ebd., S. 5)`'
          # a missing path, a Word file, a folder without .md files, bad arguments: exit 2
          expect 2 python scripts/repeated_citations.py "$W/ch" "$W/missing.md"
          has 'Error: not found:'
          hasnt 'Pairs:'
          expect 2 python scripts/repeated_citations.py "$W/chapter.docx"
          has 'is a Word file'
          expect 2 python scripts/repeated_citations.py "$W/empty"
          has 'no .md chapter files in the folder'
          expect 2 python scripts/repeated_citations.py
          expect 2 python scripts/repeated_citations.py --pairs "$W/ch"
          expect 0 python scripts/repeated_citations.py --help
          has 'Exit codes:'

      - name: verbatim_check.py on generated chapters and sources
        run: |
          V=/tmp/ci_verbatim; rm -rf "$V"; mkdir -p "$V/src/extracts" "$V/src/_guidelines" "$V/src/pdf"
          python - "$V" <<'EOF'
          import os, sys
          from docx import Document
          from pypdf import PdfWriter
          from pypdf.generic import DictionaryObject, NameObject, StreamObject
          v = sys.argv[1]
          def pdf(path, pages, password=None):
              pw = PdfWriter()
              for lines in pages:
                  page = pw.add_blank_page(width=400, height=300)
                  font = DictionaryObject({NameObject("/Type"): NameObject("/Font"), NameObject("/Subtype"): NameObject("/Type1"),
                                           NameObject("/BaseFont"): NameObject("/Helvetica")})
                  page[NameObject("/Resources")] = DictionaryObject({NameObject("/Font"): DictionaryObject({NameObject("/F1"): pw._add_object(font)})})
                  content = StreamObject()
                  content.set_data(("BT /F1 10 Tf 20 280 Td 12 TL " + " ".join(f"({l}) '" for l in lines) + " ET").encode("latin-1"))
                  page[NameObject("/Contents")] = pw._add_object(content)
              if password:
                  pw.encrypt(user_password=password, owner_password="owner", algorithm="AES-128")
              pw.write(path)
          # an extract with quote IDs and pages
          with open(os.path.join(v, "src", "extracts", "Keller_2018.md"), "w", encoding="utf-8") as f:
              f.write("# Keller (2018) — Stadtklima\n\n**Status:** verified\n\n## Page 44\n\n### Q1\n"
                      "- **Original:** \"Die urbane Wärmeinsel bezeichnet den Temperaturunterschied zwischen einer Stadt "
                      "und ihrem weniger dicht bebauten Umland, der vor allem in windstillen Nächten auftritt.\"\n"
                      "- **Core claim:** Die Wärmeinsel ist nachts am stärksten.\n\n### Q2\n"
                      "- **Original:** \"Bäume kühlen ihre Umgebung durch Verdunstung und Beschattung, wobei die Wirkung "
                      "von der Wasserversorgung abhängt.\"\n\n## Page 45\n\n### Q3\n"
                      "- **Original:** \"Wer die Wirkung von Stadtgrün allein an der Lufttemperatur misst, unterschätzt sie regelmäßig.\"\n")
          # a guideline repeating a source sentence: guidelines are not sources
          with open(os.path.join(v, "src", "_guidelines", "guide.txt"), "w", encoding="utf-8") as f:
              f.write("Zitate ab 40 Wörtern werden eingerückt und bezeichnen den Temperaturunterschied zwischen einer Stadt.\n")
          # a PDF whose sentence is hyphenated across a page break
          pdf(os.path.join(v, "src", "pdf", "smith.pdf"),
              [["Green roofs lower the surface temperature of a building by", "several degrees on a hot summer day, as long as the plants are well water-"],
               ["ed and the substrate stays moist.", "Shade matters more than evaporation in narrow streets."]])
          pdf(os.path.join(v, "scan.pdf"), [[]])
          pdf(os.path.join(v, "locked.pdf"), [["text behind a password"]], password="secret")
          with open(os.path.join(v, "chapter.md"), "w", encoding="utf-8") as f:
              f.write("---\ntitle: \"2 Grundlagen\"\n---\n# 2 Grundlagen\n\n"
                      # line 6: 15 words from Q1, across a line break
                      "Die urbane Wärmeinsel bezeichnet den Temperaturunterschied zwischen einer Stadt und ihrem\n"
                      "weniger dicht bebauten Umland [vgl. @Keller_2018, S. 44]. Kurz: Bäume kühlen ihre Umgebung durch Verdunstung.\n\n"
                      # line 9: a changed direct quote, and one that is correct
                      "Keller folgert: „Wer die Wirkung von Stadtgrün allein an der Lufttemperatur misst, unterschätzt sie häufig.“ "
                      "Wichtig ist, dass „die Wirkung von der Wasserversorgung abhängt“ (Keller 2018, S. 44).\n\n"
                      # line 11: a block quote is a marked direct quote
                      "> Bäume kühlen ihre Umgebung durch Verdunstung und Beschattung, wobei die Wirkung von der Wasserversorgung abhängt.\n\n"
                      # line 13: 8 words from the PDF, across its page break
                      "In short, plants that are well watered and the substrate stays moist, as studies show.\n\n"
                      # line 15: a quoted sentence in straight marks is not counted
                      "\"Shade matters more than evaporation in narrow streets.\"\n")
          d = Document()
          d.add_paragraph("Die urbane Wärmeinsel bezeichnet den Temperaturunterschied zwischen einer Stadt und ihrem Umland.")
          d.add_paragraph("Bäume kühlen ihre Umgebung durch Verdunstung und Beschattung, wobei die Wirkung von der Wasserversorgung abhängt.", style="Quote")
          d.save(os.path.join(v, "chapter.docx"))
          with open(os.path.join(v, "clean.md"), "w", encoding="utf-8") as f:
              f.write("Stadtgrün senkt die Temperatur vor allem nachts, wenn die Bebauung Wärme abgibt (Keller 2018, S. 44).\n")
          EOF
          expect() {
            want=$1; shift
            set +e; "$@" >"$V/out.txt" 2>&1; code=$?; set -e
            if [ "$code" -ne "$want" ]; then cat "$V/out.txt"; echo "expected exit $want, got $code: $*"; exit 1; fi
            # a crash also exits 1, the code for findings
            if grep -q '^Traceback' "$V/out.txt"; then cat "$V/out.txt"; echo "traceback: $*"; exit 1; fi
          }
          # 0 = nothing of 8 or more words, 1 = a run of 8 or more, 2 = unreadable input
          expect 1 python scripts/verbatim_check.py "$V/chapter.md" "$V/src"
          grep -qF '❌ 15 words, line 6:' "$V/out.txt"
          grep -qF 'in Keller_2018.md Q1 (p. 44)' "$V/out.txt"
          grep -qF '🟡 6 words, line 7:' "$V/out.txt"
          grep -qF '⚠️  8 words, line 13:' "$V/out.txt"
          grep -qF 'in smith.pdf (PDF pages 1-2)' "$V/out.txt"
          # the changed quotation is listed, the correct one and the block quote are not
          grep -qF 'line 9: "Wer die Wirkung von Stadtgrün allein an der Lufttemperatur misst, unterschätzt sie häufig."' "$V/out.txt"
          if grep -q 'Wasserversorgung abhängt' "$V/out.txt"; then echo "a correct quotation was listed"; exit 1; fi
          # quoted text is not counted; the guideline folder is not read
          if grep -q 'line 15\|narrow streets\|guide.txt' "$V/out.txt"; then cat "$V/out.txt"; echo "quoted text or a guideline was counted"; exit 1; fi
          grep -qF 'Sources: 1 extract(s) with 3 quotes, 1 PDF(s), 0 text file(s)' "$V/out.txt"
          grep -qxF 'Summary: ❌ 1, ⚠️ 1, 🟡 1. Runs of 1-4 words are not listed;' "$V/out.txt"
          # Word: a paragraph in a quote style is a direct quote
          expect 1 python scripts/verbatim_check.py "$V/chapter.docx" "$V/src"
          grep -qF '⚠️  11 words, paragraph 1:' "$V/out.txt"
          if grep -q 'paragraph 2' "$V/out.txt"; then echo "a quote-style paragraph was counted"; exit 1; fi
          expect 0 python scripts/verbatim_check.py "$V/clean.md" "$V/src"
          grep -qF '✅ No verbatim run of 5 or more words' "$V/out.txt"
          # a scan is listed as not checked; a password-protected PDF is an error
          expect 0 python scripts/verbatim_check.py "$V/clean.md" "$V/src" "$V/scan.pdf"
          grep -qF 'scan.pdf (no text layer' "$V/out.txt"
          expect 2 python scripts/verbatim_check.py "$V/clean.md" "$V/src" "$V/locked.pdf"
          grep -qF 'locked.pdf (' "$V/out.txt"
          # the other quote layouts: "- p. 42:" lines, the "Secondary citation?" field and the
          # source registry table of a seminar's state.md; a ZIP named .pdf is not unpacked
          mkdir -p "$V/other"
          printf '%s\n' '# Author A (2020)' '' '## Page 42' '' \
            '- p. 42: "The central challenge is the particularly pronounced' '  uncertainty inherent to this early phase."' \
            '- **Secondary citation?** Yes — Author A cites Author B (2006):' '  "markets punish delay more than they reward caution in every downturn"' > "$V/other/author_a.md"
          printf '%s\n' '| Source | Chapter | Page | Original quote | Rating |' '|---|---|---|---|---|' \
            '| Weber 2019 | 2 | 15 | "Stadtbäume senken die Oberflächentemperatur von Fassaden an heißen Tagen deutlich" | paraphrase |' > "$V/other/state.md"
          printf 'PK\003\004not a pdf' > "$V/other/fake.pdf"
          # the worked example of checklists/plagiarism_protection.md: one run of 9 words, and
          # "The central challenge" (3 words) is not listed
          printf '%s\n' 'The central challenge lies in the particularly pronounced uncertainty inherent to this early phase.' \
            'As noted, markets punish delay more than they reward caution in every downturn.' \
            'Stadtbäume senken die Oberflächentemperatur von Fassaden an heißen Tagen.' > "$V/other.md"
          expect 1 python scripts/verbatim_check.py "$V/other.md" "$V/other"
          grep -qF '⚠️  9 words, line 1: "the particularly pronounced uncertainty inherent to this early phase"' "$V/out.txt"
          grep -qF 'in author_a.md (p. 42, secondary citation)' "$V/out.txt"
          grep -qF 'in state.md: Weber 2019 (p. 15)' "$V/out.txt"
          grep -qF 'fake.pdf (a ZIP archive named .pdf' "$V/out.txt"
          # words are counted as written: with two hyphenated compounds, a run of 9 tokens is
          # 5 words, a 🟡 (exit 0); a quotation of 8 tokens in 4 words is a short one, which
          # keeps the copied sentence around it one run
          printf '%s\n' 'Planners need up-to-date maps of day-to-day heat stress in the old town.' > "$V/compound_src.txt"
          printf '%s\n' 'Cities collect up-to-date maps of day-to-day heat in summer.' > "$V/compound.md"
          expect 0 python scripts/verbatim_check.py "$V/compound.md" "$V/compound_src.txt"
          grep -qF '🟡 5 words, line 1: "up-to-date maps of day-to-day heat"' "$V/out.txt"
          grep -qxF 'Summary: ❌ 0, ⚠️ 0, 🟡 1. Runs of 1-4 words are not listed;' "$V/out.txt"
          printf '%s\n' 'Planners need „up-to-date maps of day-to-day“ heat stress in the old town.' > "$V/compound_quoted.md"
          expect 1 python scripts/verbatim_check.py "$V/compound_quoted.md" "$V/compound_src.txt"
          grep -qF '⚠️  8 words (and 4 in quotation marks), line 1:' "$V/out.txt"
          if grep -q 'not found verbatim' "$V/out.txt"; then cat "$V/out.txt"; echo "a short quotation was taken for a direct quote"; exit 1; fi
          # a dash between words separates them, closed (an em dash, or a typed --- that
          # Pandoc turns into one) as well as spaced: the run is 9 words as written, a ⚠️
          printf '%s\n' 'Many authors agree that trees cool their surroundings—as planners know—through evaporation and shade.' > "$V/dash_src.txt"
          printf '%s\n' 'Research shows that trees cool their surroundings—as planners know—through shade.' > "$V/dash.md"
          expect 1 python scripts/verbatim_check.py "$V/dash.md" "$V/dash_src.txt"
          grep -qF '⚠️  9 words, line 1: "that trees cool their surroundings—as planners know—through"' "$V/out.txt"
          grep -qF 'Words: 12 (as written,' "$V/out.txt"
          printf '%s\n' 'Research shows that trees cool their surroundings---as planners know---through shade.' > "$V/dash_typed.md"
          expect 1 python scripts/verbatim_check.py "$V/dash_typed.md" "$V/dash_src.txt"
          grep -qF '⚠️  9 words, line 1: "that trees cool their surroundings---as planners know---through"' "$V/out.txt"
          # the script's thresholds are those of the checklist's table
          python - <<'EOF'
          import re, sys
          sys.path.insert(0, "scripts")
          import verbatim_check as v
          table = open("checklists/plagiarism_protection.md", encoding="utf-8").read()
          bands = re.findall(r"^\| *(?:(\d+)-\d+|≥ *(\d+)) *\|", table, re.M)
          starts = sorted(int(a or b) for a, b in bands)
          assert starts == [1, v.POLISH, v.RISK, v.SERIOUS], (starts, v.POLISH, v.RISK, v.SERIOUS)
          EOF
          # bad arguments
          expect 2 python scripts/verbatim_check.py "$V/chapter.md"
          expect 2 python scripts/verbatim_check.py "$V/missing.md" "$V/src"
          mkdir -p "$V/empty"; expect 2 python scripts/verbatim_check.py "$V/chapter.md" "$V/empty"
          expect 2 python scripts/verbatim_check.py "$V/src/pdf/smith.pdf" "$V/src"
          # a damaged Word chapter: one error line
          printf 'PK\003\004broken' > "$V/broken.docx"
          expect 2 python scripts/verbatim_check.py "$V/broken.docx" "$V/src"
          grep -q '^Error: cannot read .*broken.docx as .docx' "$V/out.txt"
          test "$(wc -l < "$V/out.txt")" -eq 1
          # brackets, spaces and umlauts in the paths
          mkdir -p "$V/Quellen [alt] ä"; cp "$V/src/extracts/Keller_2018.md" "$V/Quellen [alt] ä/"
          cp "$V/chapter.md" "$V/Kapitel [2] ü.md"
          expect 1 python scripts/verbatim_check.py "$V/Kapitel [2] ü.md" "$V/Quellen [alt] ä"
          grep -qF 'Verbatim check for: Kapitel [2] ü.md' "$V/out.txt"
          grep -qF 'in Keller_2018.md Q1 (p. 44)' "$V/out.txt"
          # a run continues across an author-year citation; quotes in single marks are direct quotes
          printf '%s\n' 'Die urbane Wärmeinsel bezeichnet den Temperaturunterschied (Keller 2018, S. 44) zwischen einer Stadt und ihrem weniger dicht bebauten Umland.' \
            'Er schreibt, ‘Bäume kühlen ihre Umgebung durch Verdunstung und Beschattung’.' > "$V/cited.md"
          expect 1 python scripts/verbatim_check.py "$V/cited.md" "$V/src"
          grep -qF '❌ 15 words, line 1: "Die urbane Wärmeinsel bezeichnet den Temperaturunterschied (Keller 2018, S. 44)' "$V/out.txt"
          if grep -q 'line 2' "$V/out.txt"; then cat "$V/out.txt"; echo "a quote in single marks was counted"; exit 1; fi
          # ... and across a repeated citation with ebd. (in_text.repeated_citation), after a comma or a colon
          sed 's/(Keller 2018, S. 44)/(vgl. ebd., S. 44)/' "$V/cited.md" > "$V/cited_ebd.md"
          expect 1 python scripts/verbatim_check.py "$V/cited_ebd.md" "$V/src"
          grep -qF '❌ 15 words, line 1: "Die urbane Wärmeinsel bezeichnet den Temperaturunterschied (vgl. ebd., S. 44)' "$V/out.txt"
          sed 's/(Keller 2018, S. 44)/(ebd.: 44)/' "$V/cited.md" > "$V/cited_ebd_colon.md"
          expect 1 python scripts/verbatim_check.py "$V/cited_ebd_colon.md" "$V/src"
          grep -qF '❌ 15 words, line 1: "Die urbane Wärmeinsel bezeichnet den Temperaturunterschied (ebd.: 44)' "$V/out.txt"
          # Pandoc exports a Markdown block quote in the style "Block Text"
          python - "$V" <<'EOF'
          import os, sys
          from docx import Document
          from docx.enum.style import WD_STYLE_TYPE
          d = Document()
          d.styles.add_style("Block Text", WD_STYLE_TYPE.PARAGRAPH)
          d.add_paragraph("Bäume kühlen ihre Umgebung durch Verdunstung und Beschattung, wobei die Wirkung von der Wasserversorgung abhängt.", style="Block Text")
          d.save(os.path.join(sys.argv[1], "blocktext.docx"))
          EOF
          expect 0 python scripts/verbatim_check.py "$V/blocktext.docx" "$V/src"
          # pages: a heading without a page starts a part without one (also between the
          # sources of one file), roman numerals count; a quote is split at an omission
          mkdir -p "$V/pages/verification"
          printf '%s\n' '## Smith (2020), p. xii' '' '### Q1' '' '- **Original:** "Green roofs lower the surface temperature of a building by several degrees."' '' \
            '## Jones (2019)' '' '### Q2' '' '- **Original:** "Shade matters more than evaporation in the narrow streets of old towns."' '' \
            '### Q3' '' '- **Original:** "Bäume spenden Schatten [...] und kühlen die Straßen an heißen Tagen merklich ab."' > "$V/pages/key_sources.md"
          printf '%s\n' 'Green roofs lower the surface temperature of a building by several degrees.' \
            'Shade matters more than evaporation in the narrow streets of old towns.' \
            'Bäume spenden Schatten und kühlen die Straßen an heißen Tagen merklich ab.' > "$V/pages.md"
          # a saved report repeats the chapter: the verification folder is not read
          cp "$V/pages.md" "$V/pages/verification/pages_round_1_verbatim.txt"
          printf 'x' > "$V/pages/book.docx"
          expect 1 python scripts/verbatim_check.py "$V/pages.md" "$V/pages" "$V/no_such_folder"
          grep -qx '    in key_sources.md Q1 (p. xii)' "$V/out.txt"
          grep -qx '    in key_sources.md Q2' "$V/out.txt"
          grep -qF '⚠️  9 words, line 3: "und kühlen die Straßen an heißen Tagen merklich ab"' "$V/out.txt"
          if grep -q 'verbatim.txt\|line 3: "Bäume' "$V/out.txt"; then cat "$V/out.txt"; echo "a report was read, or a quote joined across its omission"; exit 1; fi
          grep -qF 'book.docx (.docx is not read' "$V/out.txt"
          grep -qF 'no_such_folder (not found)' "$V/out.txt"
          # without pypdf the PDFs are listed as not checked; the extracts are still checked
          expect 1 python -c "import sys, runpy; sys.modules['pypdf'] = None; sys.argv = ['verbatim_check.py'] + sys.argv[1:]; runpy.run_path('scripts/verbatim_check.py', run_name='__main__')" "$V/chapter.md" "$V/src"
          grep -qF 'smith.pdf (pypdf not installed' "$V/out.txt"
          grep -qF 'in Keller_2018.md Q1 (p. 44)' "$V/out.txt"
          # an unreadable source is part of the report on stdout
          set +e; python scripts/verbatim_check.py "$V/clean.md" "$V/src" "$V/locked.pdf" > "$V/stdout.txt" 2>/dev/null; set -e
          grep -qF 'Could not be read:' "$V/stdout.txt"
          # nothing to compare against is an error, not a clean result
          mkdir -p "$V/notes"; printf '# Notes\n\nno quotes here\n' > "$V/notes/handover.md"
          expect 2 python scripts/verbatim_check.py "$V/clean.md" "$V/notes"
          grep -q '^Error: nothing to compare against' "$V/out.txt"
          test "$(wc -l < "$V/out.txt")" -eq 1
          # the research-agent's output format, filled in, is read with its quote IDs and pages
          python - <<'EOF'
          import re, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
