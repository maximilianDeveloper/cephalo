          sed 's/BlockText/Quote/' "$V/raw_quote.md" > "$V/raw_quote_id.md"
          expect 1 python scripts/verbatim_check.py "$V/raw_quote_id.md" "$V/raw_text_src.txt"
          grep -qF '16 words, line 6' "$V/out.txt"
          sed 's|<w:br/>|<w:br></w:br>|' "$V/raw_br.md" > "$V/raw_br_pair.md"
          expect 1 python scripts/verbatim_check.py "$V/raw_br_pair.md" "$V/raw_text_src.txt"
          grep -qF '16 words, line 6' "$V/out.txt"
          sed 's/{=openxml}/{=docx}/' "$V/raw_text.md" > "$V/raw_docx.md"
          expect 0 python scripts/verbatim_check.py "$V/raw_docx.md" "$V/raw_text_src.txt"
          # a text box in a quoted paragraph: the paragraph's text after the box stays in the quote
          printf '# 1 Einleitung\n\nEin kurzer eigener Satz steht hier.\n\n```{=openxml}\n<w:p><w:pPr><w:pStyle w:val="BlockText"/></w:pPr><w:r><w:t xml:space="preserve">Vor dem Kasten. </w:t></w:r><w:r><mc:AlternateContent xmlns:mc="http://schemas.openxmlformats.org/markup-compatibility/2006"><mc:Choice Requires="wps"><w:drawing><wp:inline><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.microsoft.com/office/word/2010/wordprocessingShape"><wps:wsp xmlns:wps="http://schemas.microsoft.com/office/word/2010/wordprocessingShape"><wps:txbx><w:txbxContent><w:p><w:r><w:t>Notiz.</w:t></w:r></w:p></w:txbxContent></wps:txbx></wps:wsp></a:graphicData></a:graphic></wp:inline></w:drawing></mc:Choice><mc:Fallback><w:pict><v:shape><v:textbox><w:txbxContent><w:p><w:r><w:t>Notiz.</w:t></w:r></w:p></w:txbxContent></v:textbox></v:shape></w:pict></mc:Fallback></mc:AlternateContent></w:r><w:r><w:t>Die Bäume kühlen ihre Umgebung durch Verdunstung und senken die Temperatur in dicht bebauten Vierteln deutlich.</w:t></w:r></w:p>\n```\n' > "$V/raw_box.md"
          expect 0 python scripts/verbatim_check.py "$V/raw_box.md" "$V/raw_text_src.txt"
          sed 's|<w:pPr><w:pStyle w:val="BlockText"/></w:pPr>||' "$V/raw_box.md" > "$V/raw_box_plain.md"
          expect 1 python scripts/verbatim_check.py "$V/raw_box_plain.md" "$V/raw_text_src.txt"
          grep -qF '16 words, line 6' "$V/out.txt"
          # an empty copy for older readers (<mc:Fallback/>) hides nothing after it
          sed 's|<mc:Fallback>.*</mc:Fallback>|<mc:Fallback/>|' "$V/raw_box_plain.md" > "$V/raw_box_empty.md"
          grep -qF '<mc:Fallback/>' "$V/raw_box_empty.md"
          expect 1 python scripts/verbatim_check.py "$V/raw_box_empty.md" "$V/raw_text_src.txt"
          grep -qF '16 words, line 6' "$V/out.txt"
          # a raw paragraph in the bibliography is one of its entries: with a year it stays out with
          # the reference list; without one the section is no reference list and is compared
          printf '# 1 Einleitung\n\nEin kurzer eigener Satz steht hier.\n\n# Literaturverzeichnis\n\nMuster, A. (2019): Ein Buch. Berlin.\n\n```{=openxml}\n<w:p><w:r><w:t>Keller, A. (2018): Die Bäume kühlen ihre Umgebung durch Verdunstung und senken die Temperatur in dicht bebauten Vierteln deutlich.</w:t></w:r></w:p>\n```\n' > "$V/raw_bib.md"
          expect 0 python scripts/verbatim_check.py "$V/raw_bib.md" "$V/raw_text_src.txt"
          grep -qF 'the bibliography, from line 5 on' "$V/out.txt"
          if grep -q 'words, line' "$V/out.txt"; then cat "$V/out.txt"; echo "an entry of the reference list was matched as a run"; exit 1; fi
          sed 's/Keller, A. (2018): //' "$V/raw_bib.md" > "$V/raw_bib_noyear.md"
          expect 1 python scripts/verbatim_check.py "$V/raw_bib_noyear.md" "$V/raw_text_src.txt"
          grep -qF '16 words, line 10' "$V/out.txt"
          # --chapters: the runs a chapter shares with the other chapters (A.2 of
          # checklists/consistency.md), after the part on the sources. The conclusion shares
          # 5 words across a comma with chapter 2 and quotes the research question of the
          # Word introduction; the definition in a block quote and the quotation that both
          # chapters have, the run that lies wholly within a run from the source, the
          # reference list (on either side) and the chapter itself take no part; a run longer
          # than its part from the source is listed with that part; no exit code changes
          X="$V/xch"; mkdir -p "$X/chapters"
          printf '%s\n' 'Ein Speicher ist ein Gebäude, das Waren zwischen ihrer Ankunft und ihrem Verkauf trocken und sicher verwahrt.' \
            'Wer die Speicher leer stehen lässt, gibt den Hafen ein zweites Mal auf.' 'Am Wasser stiegen die Mieten binnen zehn Jahren um ein Drittel.' \
            'Die alten Kräne am Kai wurden abgebaut.' > "$X/lange.txt"
          printf '%s\n' '---' 'chapter: 2' '---' '' '# 2 Der alte Hafen' '' \
            'Viele Befragte schilderten das Gefühl, am alten Hafen beginne etwas Neues (Lange 2020, S. 14).' '' \
            '> Ein Speicher ist ein Gebäude, das Waren zwischen ihrer Ankunft und ihrem Verkauf trocken und sicher verwahrt. (Lange 2020, S. 9)' '' \
            'Lange hält fest: „Wer die Speicher leer stehen lässt, gibt den Hafen ein zweites Mal auf.“ (Lange 2020, S. 15)' '' \
            'Dort stiegen die Mieten binnen zehn Jahren spürbar (Lange 2020, S. 21). Die alten Kräne am Kai wurden abgebaut und verschrottet.' '' \
            'Die Hefte der Hafenchronik erscheinen in loser Folge bei einem Verlag am Ort.' > "$X/chapters/ch_2_hafen.md"
          printf '%s\n' '---' 'chapter: 3' '---' '' '# 3 Fazit' '' \
            'Die Frage, „wie sich die leeren Speicher am alten Hafen nutzen lassen“, beantwortet die Literatur nur zum Teil. Hinzu kommt das Gefühl, am alten Hafen entstehe etwas Neues (Lange 2020, S. 14).' '' \
            '> Ein Speicher ist ein Gebäude, das Waren zwischen ihrer Ankunft und ihrem Verkauf trocken und sicher verwahrt. (Lange 2020, S. 9)' '' \
            'Lange warnt: „Wer die Speicher leer stehen lässt, gibt den Hafen ein zweites Mal auf.“ (Lange 2020, S. 15)' '' \
            'Zugleich stiegen die Mieten binnen zehn Jahren (Lange 2020, S. 21).' '' 'Die alten Kräne am Kai wurden abgebaut und verschrottet.' '' \
            '# Literaturverzeichnis' '' 'Lange, Ida (2020): Die Hefte der Hafenchronik erscheinen in loser Folge. Hafenstadt: Stadtverlag.' > "$X/chapters/ch_3_fazit.md"
          python -c "import sys; from docx import Document; d = Document(); d.add_heading('1 Einleitung', 1); d.add_paragraph('Diese Arbeit fragt, wie sich die leeren Speicher am alten Hafen nutzen lassen.'); d.save(sys.argv[1])" "$X/chapters/ch_1_einleitung.docx"
          expect 0 python scripts/verbatim_check.py "$X/chapters/ch_3_fazit.md" "$X/lange.txt" --chapters "$X/chapters/"
          grep -qxF '  Other chapters: 2 (ch_1_einleitung.docx, ch_2_hafen.md)' "$V/out.txt"
          grep -qxF 'Summary: ❌ 0, ⚠️ 0, 🟡 2. Runs of 1-4 words are not listed;' "$V/out.txt"
          sed -n '/^Runs shared with other chapters/,$p' "$V/out.txt" > "$X/shared.txt"
          printf '%s\n' 'Runs shared with other chapters (A.2 of checklists/consistency.md; not rated):' \
            '5 words, line 7: "das Gefühl, am alten Hafen"' '    in ch_2_hafen.md (line 7)' \
            '9 words, line 15: "Die alten Kräne am Kai wurden abgebaut und verschrottet"' \
            '    in ch_2_hafen.md (line 13); 7 of these words also in a run from the sources above' \
            'quotation, line 7: "wie sich die leeren Speicher am alten Hafen nutzen lassen"' \
            '    in ch_1_einleitung.docx (paragraph 2), there outside quotation marks' > "$X/shared_want.txt"
          if ! diff "$X/shared_want.txt" "$X/shared.txt"; then cat "$V/out.txt"; echo "the runs shared with other chapters differ"; exit 1; fi
          # the source part is the report without --chapters, apart from the header line
          expect 0 python scripts/verbatim_check.py "$X/chapters/ch_3_fazit.md" "$X/lange.txt"
          if grep -q 'Other chapters\|Runs shared' "$V/out.txt"; then cat "$V/out.txt"; echo "a report without --chapters changed"; exit 1; fi
          cp "$V/out.txt" "$X/plain.txt"
          expect 0 python scripts/verbatim_check.py "$X/chapters/ch_3_fazit.md" "$X/lange.txt" --chapters "$X/chapters/"
          grep -v '^  Other chapters:' "$V/out.txt" | head -n "$(wc -l < "$X/plain.txt")" > "$X/sources_part.txt"
          if ! diff "$X/plain.txt" "$X/sources_part.txt"; then echo "the part on the sources differs with --chapters"; exit 1; fi
          # from chapter 2: the conclusion's reference list is left out on its side too
          expect 0 python scripts/verbatim_check.py "$X/chapters/ch_2_hafen.md" "$X/lange.txt" --chapters "$X/chapters/"
          grep -qxF '    in ch_3_fazit.md (line 7)' "$V/out.txt"
          if grep -q 'line 15:\|Hefte' "$V/out.txt"; then cat "$V/out.txt"; echo "a reference list took part"; exit 1; fi
          # a Word chapter checked against named files; a path that does not exist and a file that
          # is no chapter are not checked (the line on the sources still says they were all read),
          # a Word chapter that cannot be read is an error, as a source is; --chapters alone
          # compares with none; it comes after the sources and not with --words
          printf 'PK\003\004broken' > "$X/broken.docx"; printf 'x' > "$X/notes.pdf"
          expect 0 python scripts/verbatim_check.py "$X/chapters/ch_1_einleitung.docx" "$X/lange.txt" --chapters "$X/chapters/ch_3_fazit.md" "$X/no_such_chapter.md" "$X/notes.pdf"
          grep -qxF '  Other chapters: 1 (ch_3_fazit.md)' "$V/out.txt"
          grep -qF 'no_such_chapter.md (not found)' "$V/out.txt"
          grep -qF 'notes.pdf (.pdf is not read' "$V/out.txt"
          grep -qxF '✅ No verbatim run of 5 or more words outside quotation marks.' "$V/out.txt"
          # the introduction's own sentence that the conclusion quotes is listed from this side too
          grep -qxF '10 words, paragraph 2: "wie sich die leeren Speicher am alten Hafen nutzen lassen"' "$V/out.txt"
          grep -qxF '    in ch_3_fazit.md (line 7, in quotation marks there)' "$V/out.txt"
          # a hard link of the chapter is the chapter itself
          ln "$X/chapters/ch_3_fazit.md" "$X/chapters/zz_link.md"
          expect 0 python scripts/verbatim_check.py "$X/chapters/ch_3_fazit.md" "$X/lange.txt" --chapters "$X/chapters/"
          grep -qxF '  Other chapters: 2 (ch_1_einleitung.docx, ch_2_hafen.md)' "$V/out.txt"
          rm "$X/chapters/zz_link.md"
          # a heading with a long run of spaces (a blanked comment) takes no time
          printf '# Kapitel <!--%3000s--> eins\n\nEin Satz ohne Belege, der lang genug ist.\n' '' > "$X/slow.md"
          expect 0 timeout 20 python scripts/verbatim_check.py "$X/slow.md" "$X/lange.txt"
          expect 2 python scripts/verbatim_check.py "$X/chapters/ch_3_fazit.md" "$X/lange.txt" --chapters "$X/broken.docx"
          grep -qF 'Verbatim check for: ch_3_fazit.md' "$V/out.txt"
          grep -A1 -xF 'Could not be read:' "$V/out.txt" | grep -qF 'broken.docx (cannot read it as .docx'
          expect 0 python scripts/verbatim_check.py "$X/chapters/ch_3_fazit.md" "$X/lange.txt" --chapters
          grep -qxF '  Other chapters: 0' "$V/out.txt"
          grep -qxF "Runs shared with other chapters (A.2 of checklists/consistency.md): no other chapter compared." "$V/out.txt"
          expect 2 python scripts/verbatim_check.py "$X/chapters/ch_3_fazit.md" --chapters "$X/chapters/" "$X/lange.txt"
          expect 2 python scripts/verbatim_check.py --words "$X/chapters/ch_3_fazit.md" --chapters "$X/chapters/"
          expect 0 python scripts/verbatim_check.py --help
          grep -qF -- '--chapters <chapter or folder>' "$V/out.txt"

      - name: build_reference_docx.py (styles, page settings, errors; round trip through Pandoc)
        run: |
          R=/tmp/ci_refdoc; rm -rf "$R"; mkdir -p "$R"
          expect() {
            want=$1; shift
            set +e; "$@" >"$R/out.txt" 2>&1; code=$?; set -e
            if [ "$code" -ne "$want" ]; then cat "$R/out.txt"; echo "expected exit $want, got $code: $*"; exit 1; fi
          }
          # An error is one line that names the option: not argparse's usage block, which also exits 2.
          one_error() {
            if [ "$(wc -l < "$R/out.txt")" -ne 1 ] || ! grep -q "^Error: $1" "$R/out.txt"; then cat "$R/out.txt"; echo "expected one line 'Error: $1...'"; exit 1; fi
          }
          python -c "import docx, sys; docx.Document().save(sys.argv[1])" "$R/base.docx"
          ARGS="--font Arial --size 11 --line-spacing 1,5 --align justify --space-after 6 --first-line-indent 0.5
                --heading-sizes 14,12,11 --heading-bold yes --heading-color 000000 --quote-indent 1 --quote-size 10
                --quote-line-spacing 1 --footnote-size 10 --bib-hanging 1 --bib-line-spacing 1 --link-color 000000
                --page-size A4 --margins 2.5,3,2.5,3 --page-number bottom-right --title-page not-counted --toc-bold 1 --lang de-DE"
          # Without Pandoc: from a python-docx document, which lacks Pandoc's own styles (they are added)
          # and sets its headings in theme fonts and colours, which a plain value must replace.
          # shellcheck disable=SC2086
          expect 0 python scripts/build_reference_docx.py "$R/ref.docx" --base "$R/base.docx" $ARGS
          grep -q '^Reference document written' "$R/out.txt"
          python - "$R/ref.docx" <<'EOF'
          import re, sys, zipfile
          import docx
          from docx.shared import Pt
          path = sys.argv[1]
          d = docx.Document(path)
          st = {s.name: s for s in d.styles}
          styles_xml = zipfile.ZipFile(path).read("word/styles.xml").decode("utf-8")
          def xml(style_id):
              m = re.search(r'<w:style [^>]*w:styleId="' + style_id + r'"[^>]*>.*?</w:style>', styles_xml, re.S)
              return m.group(0) if m else ""
          def check(cond, what):
              if not cond:
                  raise SystemExit("build_reference_docx.py: " + what)
          def cm(length, value):  # Word stores lengths in twips: 0.5 cm comes back as 0.4992 cm
              return length is not None and abs(length.cm - value) < 0.01
          for name in ("Body Text", "First Paragraph", "Block Text", "Bibliography", "Footnote Text"):
              check(name in st, f"style {name} missing")
          n = st["Normal"]
          check(n.font.name == "Arial" and n.font.size == Pt(11) and n.paragraph_format.line_spacing == 1.5, "Normal")
          b = st["Body Text"].paragraph_format
          check(b.space_before == Pt(0) and b.space_after == Pt(6), "Body Text spacing: 0 before when only --space-after is given")
          check(cm(b.first_line_indent, 0.5) and b.alignment == 3, "Body Text indent and alignment")
          for name in ("First Paragraph", "Block Text"):
              check(cm(st[name].paragraph_format.first_line_indent, 0), f"{name} without first-line indent")
          for level in (1, 4):  # a level beyond --heading-sizes takes font, weight and colour too
              h = xml(f"Heading{level}")
              check(h and "asciiTheme" not in h and "themeColor" not in h, f"Heading {level} keeps a theme font or colour")
              check('w:ascii="Arial"' in h and 'w:val="000000"' in h, f"Heading {level}: font or colour not set")
          check(st["Heading 1"].font.size == Pt(14) and st["Heading 3"].font.size == Pt(11) and st["Heading 1"].font.bold, "heading sizes")
          q = st["Block Text"]
          check(cm(q.paragraph_format.left_indent, 1) and cm(q.paragraph_format.right_indent, 0) and q.font.size == Pt(10), "Block Text")
          bib = st["Bibliography"].paragraph_format
          check(cm(bib.left_indent, 1) and cm(bib.first_line_indent, -1) and bib.line_spacing == 1.0, "Bibliography")
          # The table of contents styles, named as Word names them, with Word's own layout; only the weight is set.
          toc = sorted(n for n in st if (n or "").startswith("toc "))
          check(toc == ["toc 1", "toc 2", "toc 3"], f"table of contents styles: {toc}")
          for level in (1, 2, 3):
              t = st[f"toc {level}"]
              f = t.paragraph_format
              check(t.style_id == f"TOC{level}" and t.base_style.name == "Normal" and t.next_paragraph_style.name == "Normal",
                    f"toc {level}: style ID, base or next style")
              check("w:customStyle" not in xml(f"TOC{level}"), f"toc {level} written as a style of its own, not Word's")
              check(bool(t.font.bold) == (level == 1), f"toc {level}: weight")
              indent = f.left_indent.twips if f.left_indent is not None else 0
              check(f.space_after is not None and f.space_after.twips == 100 and indent == 220 * (level - 1),
                    f"toc {level}: not Word's layout (space after 100, left indent {220 * (level - 1)} twips)")
          # The heading style for front matter that shows no page number: the look of Heading 1, but no outline level,
          # so that the table of contents does not list it, and no number.
          fmh = xml("FrontMatterHeading")
          check("Front Matter Heading" in st and st["Front Matter Heading"].base_style.name == "Heading 1" and '<w:outlineLvl w:val="9"/>' in fmh
                and '<w:numId w:val="0"/>' in fmh and fmh.index("<w:numPr") < fmh.index("<w:outlineLvl"),
                f"Front Matter Heading: {fmh}")
          s0 = d.sections[-1]
          check(cm(s0.page_width, 21.0) and cm(s0.page_height, 29.7), "page size")
          check(cm(s0.top_margin, 2.5) and cm(s0.left_margin, 3), "margins")
          check(s0.different_first_page_header_footer, "different first page")
          doc_xml = zipfile.ZipFile(path).read("word/document.xml").decode("utf-8")
          sect = doc_xml[doc_xml.rfind("<w:sectPr"):]
          pgmar = re.search(r"<w:pgMar[^>]*/>", sect).group(0)
          check(all(f"w:{a}=" in pgmar for a in ("top", "right", "bottom", "left", "header", "footer", "gutter")), f"incomplete {pgmar}")
          tags = re.findall(r"<w:(\w+)", sect)[1:]
          check('w:start="0"' in sect, "page numbering start 0")
          check(tags.index("pgMar") < tags.index("pgNumType") < tags.index("titlePg"), f"order of the section properties: {tags}")
          footers = [f for f in zipfile.ZipFile(path).namelist() if f.startswith("word/footer")]
          check(sum(zipfile.ZipFile(path).read(f).decode("utf-8").count("PAGE") for f in footers) == 1, "not exactly one PAGE field")
          print("OK: reference document from a python-docx document")
          EOF
          # A template's own page number gives way to the new one; its table of contents styles keep
          # their layout and change only their weight.
          expect 0 python scripts/build_reference_docx.py "$R/again.docx" --base "$R/ref.docx" --page-number bottom-center --toc-bold 2
          grep -q 'table of contents: level 2 bold, levels 1 and 3 regular' "$R/out.txt" || { cat "$R/out.txt"; exit 1; }
          python - "$R/again.docx" <<'EOF'
          import sys, zipfile
          import docx
          z = zipfile.ZipFile(sys.argv[1])
          n = sum(z.read(f).decode("utf-8").count("PAGE") for f in z.namelist() if f.startswith("word/footer"))
          if n != 1:
              raise SystemExit(f"build_reference_docx.py: {n} PAGE fields after a rebuild over a page number")
          toc = [s for s in docx.Document(sys.argv[1]).styles if (s.name or "").startswith("toc ")]
          weights = {s.name: bool(s.font.bold) for s in toc}
          if len(toc) != 3 or weights != {"toc 1": False, "toc 2": True, "toc 3": False}:
              raise SystemExit(f"build_reference_docx.py: table of contents styles after a rebuild: {weights}")
          if [s for s in toc if s.name == "toc 2"][0].paragraph_format.left_indent.twips != 220:
              raise SystemExit("build_reference_docx.py: a rebuild changed the layout of toc 2")
          if len([s for s in docx.Document(sys.argv[1]).styles if s.name == "Front Matter Heading"]) != 1:
              raise SystemExit("build_reference_docx.py: a rebuild does not keep one style Front Matter Heading")
          EOF
          # Errors: one line, exit 2, nothing written.
          expect 2 python scripts/build_reference_docx.py "$R/x.docx" --base "$R/base.docx" --margins 2.5,3
          one_error "--margins"
          expect 2 python scripts/build_reference_docx.py "$R/x.docx" --base "$R/base.docx" --heading-color blue
          one_error "--heading-color"
          expect 2 python scripts/build_reference_docx.py "$R/x.docx" --base "$R/base.docx" --size 11cm
          one_error "--size"
          expect 2 python scripts/build_reference_docx.py "$R/x.docx" --base "$R/base.docx" --toc-bold bold
          one_error "--toc-bold"
          expect 2 python scripts/build_reference_docx.py "$R/x.docx" --base "$R/missing.docx"
          one_error "--base"
          expect 2 python scripts/build_reference_docx.py "$R/nofolder/x.docx" --base "$R/base.docx"
          one_error "the folder"
          expect 2 python scripts/build_reference_docx.py "$R/x.docx" --pandoc "$R/no-pandoc"
          one_error "Pandoc"
          test ! -e "$R/x.docx"
          # With Pandoc: from Pandoc's own reference document, and a round trip whose DOCX carries the
          # styles and page settings. On a GitHub runner Pandoc is installed for this check.
          if ! command -v pandoc >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq >/dev/null 2>&1 && sudo apt-get install -y -qq pandoc >/dev/null 2>&1 || true
          fi
          if ! command -v pandoc >/dev/null 2>&1; then
            if [ "${GITHUB_ACTIONS:-}" = "true" ]; then echo "Pandoc could not be installed"; exit 1; fi
            echo "Pandoc not installed: round trip skipped"
            exit 0
          fi
          pandoc --version | head -1
          # shellcheck disable=SC2086
          expect 0 python scripts/build_reference_docx.py "$R/pandoc-ref.docx" $ARGS
          printf '# 1 Kapitel\n\nErster Absatz.\n\nZweiter Absatz.\n\n> Ein Blockzitat.\n\n| A | B |\n|---|---|\n| x | y |\n\n#### Ebene vier\n\nText.\n\n## Literaturverzeichnis\n\n::: {custom-style="Bibliography"}\nAutor, Anna (2020): Titel.\n:::\n' > "$R/doc.md"
          pandoc "$R/doc.md" --reference-doc "$R/pandoc-ref.docx" -o "$R/doc.docx"
          python - "$R/doc.docx" <<'EOF'
          import sys, zipfile
          import docx
          from docx.shared import Pt
          d = docx.Document(sys.argv[1])
          def eff(st, get):
              while st is not None:
                  v = get(st)
                  if v is not None:
                      return v
                  st = st.base_style
          seen = {p.style.name: p.style for p in d.paragraphs}
          def check(cond, what):
              if not cond:
                  raise SystemExit("round trip: " + what)
          def cm(length, value):
              return length is not None and abs(length.cm - value) < 0.01
          for name in ("Heading 1", "Heading 4", "First Paragraph", "Body Text", "Block Text", "Bibliography"):
              check(name in seen, f"no paragraph in {name}: {sorted(seen)}")
          check(eff(seen["Body Text"], lambda s: s.font.name) == "Arial", "body font")
          check(eff(seen["Body Text"], lambda s: s.font.size) == Pt(11), "body size")
          check(eff(seen["Heading 1"], lambda s: s.font.size) == Pt(14), "heading size")
          check(str(eff(seen["Heading 4"], lambda s: s.font.color.rgb if s.font.color.type else None)) == "000000", "Heading 4 colour")
          check(cm(eff(seen["Block Text"], lambda s: s.paragraph_format.left_indent), 1), "block quote indent")
          check(cm(eff(seen["Bibliography"], lambda s: s.paragraph_format.first_line_indent), -1), "hanging indent")
          cells = [c.paragraphs[0] for t in d.tables for r in t.rows for c in r.cells]
          check(cells and all(cm(eff(p.style, lambda s: s.paragraph_format.first_line_indent), 0) for p in cells), "first-line indent in table cells")
          toc = {s.name: s for s in d.styles if (s.name or "").startswith("toc ")}
          check(sorted(toc) == ["toc 1", "toc 2", "toc 3"] and toc["toc 1"].style_id == "TOC1", f"table of contents styles in the export: {sorted(toc)}")
          check(toc["toc 1"].font.bold and not toc["toc 2"].font.bold, "table of contents weights in the export")
          check(toc["toc 2"].paragraph_format.left_indent.twips == 220 and toc["toc 3"].paragraph_format.left_indent.twips == 440,
                "table of contents indents in the export")
          xml = zipfile.ZipFile(sys.argv[1]).read("word/document.xml").decode("utf-8")
          sect = xml[xml.rfind("<w:sectPr"):]
          for part in ('<w:pgSz', 'w:start="0"', "<w:titlePg", "<w:footerReference", "w:footer="):
              check(part in sect, f"{part} not in the exported section properties")
          print("OK: Pandoc round trip")
          EOF

      - name: docx_pagination.py (front and back matter as sections of their own; errors)
        run: |
          R=/tmp/ci_pagination; rm -rf "$R"; mkdir -p "$R"
          expect() {
            want=$1; shift
            set +e; "$@" >"$R/out.txt" 2>&1; code=$?; set -e
            if [ "$code" -ne "$want" ]; then cat "$R/out.txt"; echo "expected exit $want, got $code: $*"; exit 1; fi
          }
          one_error() {
            if [ "$(wc -l < "$R/out.txt")" -ne 1 ] || ! grep -q "^Error: $1" "$R/out.txt"; then cat "$R/out.txt"; echo "expected one line 'Error: $1...'"; exit 1; fi
          }
          expect 2 python scripts/docx_pagination.py "$R/missing.docx" --front-matter roman --main-text restart
          one_error ".*not found"
          if ! command -v pandoc >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq >/dev/null 2>&1 && sudo apt-get install -y -qq pandoc >/dev/null 2>&1 || true
          fi
          if ! command -v pandoc >/dev/null 2>&1; then
            if [ "${GITHUB_ACTIONS:-}" = "true" ]; then echo "Pandoc could not be installed"; exit 1; fi
            echo "Pandoc not installed: docx_pagination.py checks skipped"
            exit 0
          fi
          # The title page file as docs/reference_management.md gives it: the front matter ends with the
          # page break that carries the bookmark.
          MARK='<w:p><w:bookmarkStart w:id="990001" w:name="_cephalo_front_matter_end"/><w:bookmarkEnd w:id="990001"/><w:r><w:br w:type="page"/></w:r></w:p>'
          {
            printf '::: {custom-style="Title"}\nTitel\n:::\n\n```{=openxml}\n<w:p><w:r><w:br w:type="page"/></w:r></w:p>\n'
            printf '<w:p><w:r><w:fldChar w:fldCharType="begin" w:dirty="true"/></w:r><w:r><w:instrText xml:space="preserve"> TOC \\o "1-3" \\h \\z \\u </w:instrText></w:r><w:r><w:fldChar w:fldCharType="separate"/></w:r><w:r><w:t>Inhaltsverzeichnis</w:t></w:r><w:r><w:fldChar w:fldCharType="end"/></w:r></w:p>\n'
            printf '<w:p><w:r><w:br w:type="page"/></w:r></w:p>\n```\n\n**Abkürzungen**\n\n```{=openxml}\n%s\n```\n' "$MARK"
          } > "$R/title_page.md"
          sed 's/_cephalo_front_matter_end/_other/' "$R/title_page.md" > "$R/nomark.md"
          { cat "$R/title_page.md"; printf '\n```{=openxml}\n%s\n```\n' "$MARK"; } > "$R/twice.md"
          # The bookmark in a paragraph of its own before the page break, and text after the break.
          BM='<w:bookmarkStart w:id="990001" w:name="_cephalo_front_matter_end"/><w:bookmarkEnd w:id="990001"/>'
          sed "s|$MARK|<w:p>$BM</w:p><w:p><w:r><w:br w:type=\"page\"/></w:r></w:p>|" "$R/title_page.md" > "$R/beside.md"
          sed "s|$MARK|<w:p>$BM<w:r><w:br w:type=\"page\"/><w:t>Text</w:t></w:r></w:p>|" "$R/title_page.md" > "$R/after.md"
          # The list's heading as a heading, which the table of contents lists, and in a style of its own.
          sed 's/^\*\*Abkürzungen\*\*$/# Abkürzungen {-}/' "$R/title_page.md" > "$R/heading.md"
          sed 's/^\*\*Abkürzungen\*\*$/::: {custom-style="Front Matter Heading"}\nAbkürzungen\n:::/' "$R/title_page.md" > "$R/styled.md"
          printf '# 1 Einleitung\n\nText.\n\n# 2 Hauptteil\n\nText.\n' > "$R/ch.md"
          python scripts/build_reference_docx.py "$R/counted.docx" --page-number bottom-right --title-page counted >/dev/null
          python scripts/build_reference_docx.py "$R/notcounted.docx" --page-number bottom-right --title-page not-counted >/dev/null
          python scripts/build_reference_docx.py "$R/top.docx" --page-number top-right --title-page counted >/dev/null
          # A running head beside the page number: it stays in the front matter, the number goes.
          python - "$R/top.docx" <<'EOF'
          import sys, docx
          d = docx.Document(sys.argv[1])
          d.sections[-1].header.add_paragraph("Laufkopf")
          d.save(sys.argv[1])
          EOF
          # A template with a logo and a link in the header that gets the page number: the front matter's
          # copy of that header keeps both.
          python - "$R/base-logo.docx" <<'EOF'
          import io, struct, sys, zlib
          import docx
          from docx.opc.constants import RELATIONSHIP_TYPE as RT
          from docx.oxml import OxmlElement
          from docx.oxml.ns import qn
          def chunk(kind, data):
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
          raw = b"".join(b"\x00" + b"\x00\x00\xff" * 8 for _ in range(8))
          png = (b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", 8, 8, 8, 2, 0, 0, 0))
                 + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b""))
          d = docx.Document()
          header = d.sections[0].header
          header.is_linked_to_previous = False
          p = header.paragraphs[0]
          p.add_run().add_picture(io.BytesIO(png))
          link = OxmlElement("w:hyperlink")
          link.set(qn("r:id"), header.part.relate_to("https://example.org/", RT.HYPERLINK, is_external=True))
          run, text = OxmlElement("w:r"), OxmlElement("w:t")
          text.text = "Link"
          run.append(text)
          link.append(run)
          p._p.append(link)
          d.save(sys.argv[1])
          EOF
          python scripts/build_reference_docx.py "$R/logo.docx" --base "$R/base-logo.docx" --page-number top-right --title-page counted >/dev/null
          # The same template with a running head and "Seite 1 von 9" in the paragraph of the logo and the link, and a
          # footer whose number stands before a text: only the number goes, with the text between the same tabs, in the
          # reference document (--page-number) and in the front and back matter (the template's own number kept).
          python - "$R/base-logo.docx" "$R/base-samepar.docx" <<'EOF'
          import sys
          import docx
          from docx.oxml import parse_xml
          from docx.oxml.ns import nsdecls
          def runs(p, *xml):
              for x in xml:
                  p._p.append(parse_xml(f'<w:r {nsdecls("w")}>{x}</w:r>'))
          def simple(p, instr):
              p._p.append(parse_xml(f'<w:fldSimple {nsdecls("w")} w:instr=" {instr} "><w:r><w:t>1</w:t></w:r></w:fldSimple>'))
          d = docx.Document(sys.argv[1])
          p = d.sections[0].header.paragraphs[0]
          runs(p, '<w:tab/><w:t>Laufkopf</w:t><w:tab/><w:t xml:space="preserve">Seite </w:t>', '<w:fldChar w:fldCharType="begin"/>',
               '<w:instrText xml:space="preserve"> PAGE </w:instrText>', '<w:fldChar w:fldCharType="separate"/>', '<w:t>1</w:t>',
               '<w:fldChar w:fldCharType="end"/>', '<w:t xml:space="preserve"> von </w:t>')
          simple(p, "NUMPAGES")
          footer = d.sections[0].footer
          footer.is_linked_to_previous = False
          simple(footer.paragraphs[0], "PAGE")
          runs(footer.paragraphs[0], '<w:tab/><w:tab/><w:t>Fusszeile</w:t>')
          d.save(sys.argv[2])
          EOF
          python scripts/build_reference_docx.py "$R/samepar.docx" --base "$R/base-samepar.docx" --title-page counted >/dev/null
          python scripts/build_reference_docx.py "$R/samepar-numbered.docx" --base "$R/base-samepar.docx" --page-number bottom-right --title-page counted >/dev/null
          # A template whose footer is a table with the page number in a cell: the cell keeps a paragraph when
          # the number goes, in the reference document (--page-number) and in the front matter (the template's
          # own number kept).
          python - "$R/base-table.docx" <<'EOF'
          import sys
          import docx
          from docx.oxml import OxmlElement
          from docx.oxml.ns import qn
          from docx.shared import Cm
          d = docx.Document()
          footer = d.sections[0].footer
          footer.is_linked_to_previous = False
          cells = footer.add_table(1, 3, Cm(15)).rows[0].cells
          cells[0].paragraphs[0].add_run("Name")
          field, run, text = OxmlElement("w:fldSimple"), OxmlElement("w:r"), OxmlElement("w:t")
          field.set(qn("w:instr"), " PAGE ")
          text.text = "1"
          run.append(text)
          field.append(run)
          cells[2].paragraphs[0]._p.append(field)
          d.save(sys.argv[1])
          EOF
          python scripts/build_reference_docx.py "$R/table-numbered.docx" --base "$R/base-table.docx" --page-number bottom-right --title-page counted >/dev/null
          python scripts/build_reference_docx.py "$R/table.docx" --base "$R/base-table.docx" --title-page counted >/dev/null
          # A template that numbers its pages "- 1 -" keeps that format in the main text; one in Roman numerals
          # gives the main text Arabic numerals.
          python - "$R/notcounted.docx" "$R/dash.docx" "$R/upper.docx" <<'EOF'
          import sys, docx
          from docx.oxml.ns import qn
          for fmt, out in (("numberInDash", sys.argv[2]), ("upperRoman", sys.argv[3])):
              d = docx.Document(sys.argv[1])
              d.sections[-1]._sectPr.find(qn("w:pgNumType")).set(qn("w:fmt"), fmt)
              d.save(out)
          EOF
          # Pandoc's own reference document restarts the footnotes in each section in newer Pandoc versions (3.9
          # does), not in the one a runner may install: set it in each reference document here, so that every export
          # carries it whatever the Pandoc version, and the checks below see the split take it out.
          python - "$R/counted.docx" "$R/notcounted.docx" "$R/top.docx" "$R/logo.docx" "$R/table.docx" "$R/dash.docx" \
                   "$R/upper.docx" "$R/samepar.docx" <<'EOF'
          import sys, docx
          from docx.oxml import OxmlElement
          from docx.oxml.ns import qn
          for path in sys.argv[1:]:
              d = docx.Document(path)
              sect = d.sections[-1]._sectPr
              notes = sect.find(qn("w:footnotePr"))
              if notes is None:
                  notes = OxmlElement("w:footnotePr")
                  refs = [c for c in sect if c.tag in (qn("w:headerReference"), qn("w:footerReference"))]
                  if refs:
                      refs[-1].addnext(notes)
                  else:
                      sect.insert(0, notes)
              if notes.find(qn("w:numRestart")) is None:
                  restart = OxmlElement("w:numRestart")
                  restart.set(qn("w:val"), "eachSect")
                  notes.append(restart)
              d.save(path)
          EOF
          for ref in counted notcounted top logo table dash upper; do
            pandoc "$R/title_page.md" "$R/ch.md" --reference-doc "$R/$ref.docx" -o "$R/$ref-export.docx"
          done
          pandoc "$R/nomark.md" "$R/ch.md" --reference-doc "$R/counted.docx" -o "$R/nomark-export.docx"
          pandoc "$R/twice.md" "$R/ch.md" --reference-doc "$R/counted.docx" -o "$R/twice-export.docx"
          for form in beside after heading styled; do
            pandoc "$R/$form.md" "$R/ch.md" --reference-doc "$R/counted.docx" -o "$R/$form-export.docx"
          done
          # The back matter (pagination.back_matter): the file after the chapters starts with the page break that
          # carries the bookmark _cephalo_back_matter_start, before the reference list and an appendix.
          BACK='<w:p><w:bookmarkStart w:id="990002" w:name="_cephalo_back_matter_start"/><w:bookmarkEnd w:id="990002"/><w:r><w:br w:type="page"/></w:r></w:p>'
          printf '```{=openxml}\n%s\n```\n\n# Literaturverzeichnis {-}\n\nAutor, A. (2020): Titel.\n\n# Anhang {-}\n\nText.\n' "$BACK" > "$R/back.md"
          { cat "$R/back.md"; printf '\n```{=openxml}\n%s\n```\n' "$BACK"; } > "$R/back-twice.md"
          BBM='<w:bookmarkStart w:id="990002" w:name="_cephalo_back_matter_start"/><w:bookmarkEnd w:id="990002"/>'
          sed "s|$BACK|<w:p>$BBM</w:p><w:p><w:r><w:br w:type=\"page\"/></w:r></w:p>|" "$R/back.md" > "$R/back-beside.md"
          for ref in counted notcounted top dash upper samepar; do
            pandoc "$R/title_page.md" "$R/ch.md" "$R/back.md" --reference-doc "$R/$ref.docx" -o "$R/back-$ref-export.docx"
          done
          pandoc "$R/nomark.md" "$R/ch.md" "$R/back.md" --reference-doc "$R/counted.docx" -o "$R/back-nomark-export.docx"
          for form in twice beside; do
            pandoc "$R/title_page.md" "$R/ch.md" "$R/back-$form.md" --reference-doc "$R/counted.docx" -o "$R/back-$form-export.docx"
          done
          pandoc "$R/back.md" "$R/title_page.md" "$R/ch.md" --reference-doc "$R/counted.docx" -o "$R/back-early-export.docx"
          run() {  # run <reference> <front> <main> <name>: a fresh copy of that export, split
            cp "$R/$1-export.docx" "$R/$4.docx"
            expect 0 python scripts/docx_pagination.py "$R/$4.docx" --front-matter "$2" --main-text "$3"
          }
          run counted roman restart roman
          grep -q "^Front matter set as a section of its own" "$R/out.txt"
          cp "$R/roman.docx" "$R/roman-before.docx"
          expect 0 python scripts/docx_pagination.py "$R/roman.docx" --front-matter hidden --main-text continue
          grep -q "a section of its own already: nothing changed" "$R/out.txt"
          cmp -s "$R/roman.docx" "$R/roman-before.docx"
          run counted roman-lower continue lower
          run counted hidden continue hidden
          run counted none continue none-counted
          run notcounted none continue none-notcounted
          run notcounted hidden continue hidden-notcounted
          run counted arabic restart arabic
          run top hidden continue top
          run logo hidden restart logo
          run table hidden continue table
          run dash arabic restart dash-arabic
          run dash roman continue dash-roman
          run dash none continue dash-none
          run upper hidden continue upper
          # A heading in front matter whose number is not shown, before a main text that repeats the count:
          # a warning, which a heading in a style of its own, or front matter that shows its count, does not get.
          warned() {
            grep -q '^  - warning: the table of contents lists "Abkürzungen"' "$R/out.txt" && return 0
            if grep -q "warning" "$R/out.txt"; then cat "$R/out.txt"; echo "an unexpected warning"; exit 1; fi
            return 1
          }
          run heading none continue heading-none
          warned || { cat "$R/out.txt"; echo "no warning: none, continue"; exit 1; }
          run heading hidden restart heading-hidden
          warned || { cat "$R/out.txt"; echo "no warning: hidden, restart"; exit 1; }
          run heading roman restart heading-roman
          ! warned || { echo "a warning: roman, restart"; exit 1; }
          run heading hidden continue heading-hidden
          ! warned || { echo "a warning: hidden, continue"; exit 1; }
          run styled none continue styled
          ! warned || { echo "a warning for a heading in a style of its own"; exit 1; }
          cp "$R/counted-export.docx" "$R/unchanged.docx"
          expect 0 python scripts/docx_pagination.py "$R/unchanged.docx" --front-matter arabic --main-text continue
          grep -q "nothing to change" "$R/out.txt"
          cmp -s "$R/unchanged.docx" "$R/counted-export.docx"
          expect 2 python scripts/docx_pagination.py "$R/nomark-export.docx" --front-matter roman --main-text restart
          one_error "no end of the front matter marked"
          expect 2 python scripts/docx_pagination.py "$R/twice-export.docx" --front-matter roman --main-text restart
          one_error "the bookmark _cephalo_front_matter_end occurs 2 times"
          for form in beside after; do
            cp "$R/$form-export.docx" "$R/$form.docx"
            expect 2 python scripts/docx_pagination.py "$R/$form.docx" --front-matter roman --main-text restart
            one_error "the bookmark _cephalo_front_matter_end is not on the page break that ends the front matter"
            cmp -s "$R/$form.docx" "$R/$form-export.docx"
          done
          cp "$R/counted-export.docx" "$R/wrong.txt"
          expect 2 python scripts/docx_pagination.py "$R/wrong.txt" --front-matter roman --main-text restart
          one_error ".*expected a .docx file"
          expect 2 python scripts/docx_pagination.py "$R/unchanged.docx" --front-matter roman
          bm() {  # bm <reference> <front> <main> <back> <name> [start]: a fresh copy of that export with back matter, split
            cp "$R/back-$1-export.docx" "$R/$5.docx"
            expect 0 python scripts/docx_pagination.py "$R/$5.docx" --front-matter "$2" --main-text "$3" --back-matter "$4" ${6:+--back-matter-start "$6"}
          }
          # Like the main text, the default: the bookmark changes nothing.
          run back-counted roman restart back-default
          bm counted roman restart main back-main
          bm counted roman restart roman-continue rc-counted
          grep -q "^Front matter and back matter set as sections of their own" "$R/out.txt"
          grep -q "back matter in Roman numerals from IV, continuing the front matter's count" "$R/out.txt"
          cp "$R/rc-counted.docx" "$R/rc-before.docx"
          expect 0 python scripts/docx_pagination.py "$R/rc-counted.docx" --front-matter roman --main-text restart --back-matter roman-continue
          grep -q "a section of its own already: nothing changed" "$R/out.txt"
          cmp -s "$R/rc-counted.docx" "$R/rc-before.docx"
          # Nor does a first number given then: the docs have it set in Word in a DOCX split already.
          expect 0 python scripts/docx_pagination.py "$R/rc-counted.docx" --front-matter roman --main-text restart --back-matter roman-continue --back-matter-start 5
          grep -q "a section of its own already: nothing changed" "$R/out.txt"
          cmp -s "$R/rc-counted.docx" "$R/rc-before.docx"
          bm notcounted roman restart roman-continue rc-notcounted
          grep -q "from III, continuing" "$R/out.txt"
          bm counted roman-lower restart roman-continue rc-lower
          grep -q "from iv, continuing" "$R/out.txt"
          bm counted roman restart roman-continue rc-given 7
          grep -q "from VII (--back-matter-start 7)" "$R/out.txt"
          bm counted roman restart roman back-roman
          bm counted roman restart roman-lower back-roman-lower
          bm counted roman restart restart back-restart
          bm dash roman restart restart back-dash
          bm counted hidden continue none back-none
          bm top roman restart none back-none-top
          bm samepar hidden restart none back-samepar
          # Front matter numbered like the main text: only the back matter is split, also without the front
          # matter's bookmark, unless its count is needed.
          bm counted arabic continue restart back-only
          grep -q "^Back matter set as a section of its own" "$R/out.txt"
          cp "$R/back-only.docx" "$R/back-only-before.docx"
          expect 0 python scripts/docx_pagination.py "$R/back-only.docx" --front-matter arabic --main-text continue --back-matter restart
          grep -q "the back matter is a section of its own already: nothing changed" "$R/out.txt"
          cmp -s "$R/back-only.docx" "$R/back-only-before.docx"
          # Nor does a second run that would split the front matter, with the back matter left at main.
          expect 0 python scripts/docx_pagination.py "$R/back-only.docx" --front-matter roman --main-text restart
          grep -q "the back matter is a section of its own already: nothing changed" "$R/out.txt"
          cmp -s "$R/back-only.docx" "$R/back-only-before.docx"
          bm counted arabic continue roman-continue back-only-rc
          bm upper arabic continue restart back-upper
          bm nomark arabic continue none back-nomark
          cp "$R/back-nomark-export.docx" "$R/back-nomark-rc.docx"
          expect 2 python scripts/docx_pagination.py "$R/back-nomark-rc.docx" --front-matter arabic --main-text continue --back-matter roman-continue
          one_error "no end of the front matter marked, from which --back-matter roman-continue counts"
          cmp -s "$R/back-nomark-rc.docx" "$R/back-nomark-export.docx"
          bm nomark arabic continue roman-continue back-nomark-given 3
          cp "$R/back-counted-export.docx" "$R/back-err.docx"
          expect 2 python scripts/docx_pagination.py "$R/back-err.docx" --front-matter none --main-text continue --back-matter roman-continue
          one_error "--back-matter roman-continue continues the front matter's count, which --front-matter none"
          expect 2 python scripts/docx_pagination.py "$R/back-err.docx" --front-matter roman --main-text restart --back-matter roman --back-matter-start 4
          one_error "--back-matter-start goes with --back-matter roman-continue only"
          expect 2 python scripts/docx_pagination.py "$R/back-err.docx" --front-matter roman --main-text restart --back-matter roman-continue --back-matter-start 0
          one_error "--back-matter-start needs a number from 1 on"
          cmp -s "$R/back-err.docx" "$R/back-counted-export.docx"
          cp "$R/counted-export.docx" "$R/back-missing.docx"
          expect 2 python scripts/docx_pagination.py "$R/back-missing.docx" --front-matter roman --main-text restart --back-matter roman
          one_error "no start of the back matter marked"
          cmp -s "$R/back-missing.docx" "$R/counted-export.docx"
          for form in twice beside early; do
            cp "$R/back-$form-export.docx" "$R/back-$form.docx"
            expect 2 python scripts/docx_pagination.py "$R/back-$form.docx" --front-matter roman --main-text restart --back-matter roman
            case $form in
              twice) one_error "the bookmark _cephalo_back_matter_start occurs 2 times" ;;
              beside) one_error "the bookmark _cephalo_back_matter_start is not on the page break before the back matter" ;;
              early) one_error "the bookmark _cephalo_back_matter_start stands before the end of the front matter" ;;
            esac
            cmp -s "$R/back-$form.docx" "$R/back-$form-export.docx"
          done
          python - "$R" <<'EOF'
          import re, sys, zipfile
          import xml.etree.ElementTree as ET
          R = sys.argv[1]
          W = "{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
          def check(cond, what):
              if not cond:
                  raise SystemExit("docx_pagination: " + what)
          def sections(name, n=2):
              """The section properties in document order (front matter, main text, back matter), and the document XML."""
              xml = zipfile.ZipFile(f"{R}/{name}.docx").read("word/document.xml").decode("utf-8")
              sects = re.findall(r"<w:sectPr\b.*?</w:sectPr>", xml, re.S)
              check(len(sects) == n, f"{name}: {len(sects)} sections, not {n}")
              return (*sects, xml)
          def refs(sect, tag, kind="default"):
              """The relationship ids of the section's header or footer references of that type."""
              out = []
              for el in re.findall(r"<w:%sReference\b[^>]*>" % tag, sect):
                  if 'w:type="%s"' % kind in el:
                      out += re.findall(r'r:id="([^"]+)"', el)
              return out
          def footers(sect):
              return refs(sect, "footer")
          def num(sect):
              m = re.search(r"<w:pgNumType\b[^>]*/>", sect)
              return m.group(0) if m else ""
          f, m, xml = sections("roman")
          check('w:fmt="upperRoman"' in num(f) and "w:start" not in num(f), f"roman: front matter {num(f)}")
          check("<w:titlePg" in f and "<w:titlePg" not in m, "roman: the title page belongs to the front matter only")
          check('w:start="1"' in num(m) and "w:fmt" not in num(m), f"roman: main text {num(m)}")
          check(footers(f) and footers(f) == footers(m), "roman: the front matter keeps the page number footer")
          marker = re.search(r'<w:p\b(?:(?!</w:p>).)*?_cephalo_front_matter_end.*?</w:p>', xml, re.S).group(0)
          check("<w:sectPr" in marker and 'w:type="page"' not in marker, "roman: the page break became the section break")
          f, m, _ = sections("lower")
          check('w:fmt="lowerRoman"' in num(f) and num(m) == "", f"lower: {num(f)} / {num(m)}")
          f, m, _ = sections("hidden")
          check(not footers(f) and footers(m) and num(m) == "", f"hidden: footers {footers(f)}, main text {num(m)}")
          f, m, _ = sections("none-counted")
          check('w:start="2"' in num(m), f"none after a counted title page: main text {num(m)}")
          f, m, _ = sections("none-notcounted")
          check('w:start="1"' in num(m) and 'w:start="0"' in num(f), f"none after an uncounted title page: {num(f)} / {num(m)}")
          f, m, _ = sections("hidden-notcounted")
          check('w:start="0"' in num(f) and num(m) == "", f"hidden after an uncounted title page: {num(f)} / {num(m)}")
          f, m, _ = sections("arabic")
          check(footers(f) == footers(m) and 'w:start="1"' in num(m), f"arabic restart: {num(m)}")
          def part_of(name, rid):
              """The XML of the document part that relationship id of word/document.xml names."""
              rels = zipfile.ZipFile(f"{R}/{name}.docx").read("word/_rels/document.xml.rels").decode("utf-8")
              target = re.search(r'Id="%s"[^>]*Target="([^"]+)"|Target="([^"]+)"[^>]*Id="%s"' % (rid, rid), rels)
              return zipfile.ZipFile(f"{R}/{name}.docx").read("word/" + (target.group(1) or target.group(2))).decode("utf-8")
          f, m, _ = sections("dash-arabic")
          check('w:fmt="numberInDash"' in num(f) and 'w:fmt="numberInDash"' in num(m) and 'w:start="1"' in num(m),
                f"a template's - 1 -, arabic restart: {num(f)} / {num(m)}")
          f, m, _ = sections("dash-roman")
          check('w:fmt="upperRoman"' in num(f) and 'w:fmt="numberInDash"' in num(m) and "w:start" not in num(m),
                f"a template's - 1 -, roman continue: {num(f)} / {num(m)}")
          f, m, _ = sections("dash-none")
          check('w:fmt="numberInDash"' in num(m) and 'w:start="1"' in num(m), f"a template's - 1 -, none: {num(m)}")
          f, m, _ = sections("upper")
          check("w:fmt" not in num(m), f"a template in Roman numerals: the main text {num(m)}")
          f, m, _ = sections("top")
          hf = lambda s: refs(s, "header")
          check(hf(f) and hf(m) and hf(f) != hf(m), f"top: the front matter has a header of its own: {hf(f)} / {hf(m)}")
          part = part_of("top", hf(f)[0])
          check("Laufkopf" in part and "PAGE" not in part, "top: the front matter's header keeps its text, not the number")
          z = zipfile.ZipFile(f"{R}/top.docx")
          check("[Content_Types].xml" in z.namelist() and any(n.startswith("word/header") for n in z.namelist()), "top: package")
          f, m, _ = sections("logo")
          check(hf(f) and hf(m) and hf(f) != hf(m), f"logo: the front matter has a header of its own: {hf(f)} / {hf(m)}")
          part = part_of("logo", hf(f)[0])
          check("r:embed=" in part and "<w:hyperlink" in part and "PAGE" not in part,
                "logo: the front matter's header keeps the picture and the link, not the number")
          for doc in ("logo", "back-samepar", "samepar-numbered"):
              z = zipfile.ZipFile(f"{R}/{doc}.docx")
              for name in z.namelist():
                  if re.fullmatch(r"word/(header|footer)\d+\.xml", name):
                      used = set(re.findall(r'\br:(?:embed|id)="([^"]+)"', z.read(name).decode("utf-8")))
                      rels = "word/_rels/" + name[len("word/"):] + ".rels"
                      ids = set(re.findall(r'\bId="([^"]+)"', z.read(rels).decode("utf-8"))) if rels in z.namelist() else set()
                      check(used <= ids, f"{doc}: {name} refers to {sorted(used - ids)}, which {rels} does not define")
          # A page number in a paragraph with a logo, a link and a running head, and one before a text: only the
          # number goes, with "Seite ... von" and the NUMPAGES field between the same tabs.
          f, m, b, _ = sections("back-samepar", 3)
          for where, s in (("front matter", f), ("back matter", b)):
              check(hf(s) and footers(s), f"samepar: the {where} has no header or footer of its own")
              head, foot = part_of("back-samepar", hf(s)[0]), part_of("back-samepar", footers(s)[0])
              check(all(x in head for x in ("r:embed=", "<w:hyperlink", "Laufkopf")) and "Fusszeile" in foot,
                    f"samepar: the {where} loses what stands beside the page number")
              check("PAGE" not in head + foot and "Seite" not in head and " von " not in head,
                    f"samepar: the {where} keeps the page number or its words")
          head, foot = part_of("back-samepar", hf(m)[0]), part_of("back-samepar", footers(m)[0])
          check(" PAGE " in head and "Seite" in head and " PAGE " in foot, "samepar: the main text keeps its page numbers")
          z = zipfile.ZipFile(f"{R}/samepar-numbered.docx")
          parts = {n: z.read(n).decode("utf-8") for n in z.namelist() if re.fullmatch(r"word/(header|footer)\d+\.xml", n)}
          heads = "".join(x for n, x in parts.items() if "header" in n)
          foots = "".join(x for n, x in parts.items() if "footer" in n)
          check(all(x in heads for x in ("r:embed=", "<w:hyperlink", "Laufkopf")) and "Fusszeile" in foots
                and "PAGE" not in heads and "Seite" not in heads and foots.count(" PAGE ") == 1,
                "samepar: the reference document keeps the template's content beside its page number, and one PAGE field")
          def empty_cells(path):
              """The headers and footers of a DOCX with a table cell that holds no paragraph or table."""
              z = zipfile.ZipFile(path)
              return [name for name in z.namelist() if re.fullmatch(r"word/(header|footer)\d+\.xml", name)
                      and any(tc.find(W + "p") is None and tc.find(W + "tbl") is None
                              for tc in ET.fromstring(z.read(name)).iter(W + "tc"))]
          z = zipfile.ZipFile(f"{R}/table-numbered.docx")
          pages = sum(z.read(n).decode("utf-8").count("PAGE") for n in z.namelist() if n.startswith("word/footer"))
          check(not empty_cells(f"{R}/table-numbered.docx") and pages == 1,
                f"table: reference document: {pages} PAGE fields, empty cells in {empty_cells(f'{R}/table-numbered.docx')}")
          f, m, _ = sections("table")
          check(footers(f) and footers(f) != footers(m), f"table: the front matter has a footer of its own: {footers(f)} / {footers(m)}")
          part = part_of("table", footers(f)[0])
          check("<w:tbl" in part and "Name" in part and "PAGE" not in part, "table: the front matter's footer keeps the table, not the number")
          check("PAGE" in part_of("table", footers(m)[0]), "table: the main text keeps the number in the cell")
          check(not empty_cells(f"{R}/table.docx"), f"table: a cell without a paragraph in {empty_cells(f'{R}/table.docx')}")
          # The list's heading in the style build_reference_docx.py writes for it, which the export takes over: the
          # look of Heading 1, outside the table of contents (and no warning, above).
          z = zipfile.ZipFile(f"{R}/styled-export.docx")
          fmh = re.search(r'<w:style [^>]*w:styleId="FrontMatterHeading"[^>]*>.*?</w:style>', z.read("word/styles.xml").decode("utf-8"), re.S)
          check(fmh and 'w:basedOn w:val="Heading1"' in fmh.group(0) and 'w:outlineLvl w:val="9"' in fmh.group(0),
                f"styled: the export's style Front Matter Heading: {fmh and fmh.group(0)}")
          check('<w:pStyle w:val="FrontMatterHeading"' in z.read("word/document.xml").decode("utf-8"), "styled: the heading's style")
          # The back matter.
          doc_xml = lambda name: zipfile.ZipFile(f"{R}/{name}.docx").read("word/document.xml")
          # The footnotes count on through the sections: the restart in each section that Pandoc's reference
          # document sets, and the export takes over, goes when the export is split.
          restart = b'numRestart w:val="eachSect"'
          check(restart in doc_xml("back-counted-export"), "the export has no restart of the footnotes in each section")
          for name in ("roman", "hidden", "rc-counted", "back-none", "back-only"):
              check(restart not in doc_xml(name), f"{name}: the footnotes restart in each section")
          f, m, _ = sections("back-main")
          check(doc_xml("back-main") == doc_xml("back-default"), "back matter main: not the same as without --back-matter")
          f, m, b, xml = sections("rc-counted", 3)
          check('w:fmt="upperRoman"' in num(b) and 'w:start="4"' in num(b), f"roman-continue: back matter {num(b)}")
          check('w:start="1"' in num(m) and "w:fmt" not in num(m), f"roman-continue: main text {num(m)}")
          check(footers(b) and footers(b) == footers(m) and "<w:titlePg" not in b,
                "roman-continue: the back matter keeps the main text's footer, without a title page")
          marker = re.search(r'<w:p\b(?:(?!</w:p>).)*?_cephalo_back_matter_start.*?</w:p>', xml, re.S).group(0)
          check("<w:sectPr" in marker and 'w:type="page"' not in marker,
                "roman-continue: the page break before the back matter became the section break")
          for name, want in (("rc-notcounted", ('w:fmt="upperRoman"', 'w:start="3"')),
                             ("rc-lower", ('w:fmt="lowerRoman"', 'w:start="4"')),
                             ("rc-given", ('w:fmt="upperRoman"', 'w:start="7"')),
                             ("back-roman", ('w:fmt="upperRoman"', 'w:start="1"')),
                             ("back-roman-lower", ('w:fmt="lowerRoman"', 'w:start="1"')),
                             ("back-dash", ('w:fmt="numberInDash"', 'w:start="1"'))):
              f, m, b, _ = sections(name, 3)
              check(all(w in num(b) for w in want), f"{name}: back matter {num(b)}")
          f, m, b, _ = sections("back-restart", 3)
          check('w:start="1"' in num(b) and "w:fmt" not in num(b), f"back-restart: back matter {num(b)}")
          f, m, b, _ = sections("back-none", 3)
          check(footers(b) and footers(b) != footers(m), f"back-none: the back matter has a footer of its own: {footers(b)} / {footers(m)}")
          check("PAGE" not in part_of("back-none", footers(b)[0]) and "PAGE" in part_of("back-none", footers(m)[0]),
                "back-none: the back matter's footer without the number, the main text's with it")
          f, m, b, _ = sections("back-none-top", 3)
          check(hf(b) and hf(b) != hf(m), f"back-none-top: the back matter has a header of its own: {hf(b)} / {hf(m)}")
          part = part_of("back-none-top", hf(b)[0])
          check("Laufkopf" in part and "PAGE" not in part, "back-none-top: the back matter's header keeps its text, not the number")
          for name, want in (("back-only", 'w:start="1"'), ("back-only-rc", 'w:start="4"'), ("back-nomark-given", 'w:start="3"')):
              f, b, _ = sections(name)
              check("<w:titlePg" in f and "<w:titlePg" not in b and want in num(b),
                    f"{name}: the title page in the first section only, back matter {num(b)}")
          f, b, _ = sections("back-upper")
          check('w:fmt="upperRoman"' in num(f) and "w:fmt" not in num(b) and 'w:start="1"' in num(b),
                f"back-upper: a template in Roman numerals, back matter from 1: {num(f)} / {num(b)}")
          f, b, _ = sections("back-nomark")
          check(footers(b) and footers(b) != footers(f) and "PAGE" not in part_of("back-nomark", footers(b)[0]),
                "back-nomark: the back matter's footer without the number")
          print("OK: docx_pagination.py")
          EOF

  windows:
    name: PowerShell 5.1 parse & setup smoke (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # "shell: powershell" is Windows PowerShell 5.1 — exactly the floor the
      # scripts document. (pwsh would be PowerShell 7 and hides 5.1 issues.)
      - name: setup.ps1 parses under Windows PowerShell 5.1
        shell: powershell
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\setup.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs.Count -gt 0) { $errs | ForEach-Object { Write-Host $_.Message }; exit 1 }
          Write-Host "0 parse errors"

      - name: Non-interactive setup smoke (long-form)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\setup.ps1 -WorkType "Bachelor thesis" -Structure "Long-form" -Scaffolding full -Target "$env:TEMP\ci_long" -NonInteractive
          if ($LASTEXITCODE -ne 0) { Write-Host "expected exit 0, got $LASTEXITCODE"; exit 1 }
          if (-not (Test-Path "$env:TEMP\ci_long\00_Status.md")) { Write-Host "00_Status.md missing"; exit 1 }

      - name: Typo in -Structure fails fast without stray copy
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\setup.ps1 -WorkType "Bachelor thesis" -Structure "Langform" -Scaffolding full -Target "$env:TEMP\ci_typo" -NonInteractive
          if ($LASTEXITCODE -ne 2) { Write-Host "expected exit 2, got $LASTEXITCODE"; exit 1 }
          if (Test-Path "$env:TEMP\ci_typo") { Write-Host "stray target directory was created"; exit 1 }
          # Both assertions passed. Reset the deliberately provoked exit code: the
          # runner appends `exit $LASTEXITCODE` to every powershell block, so
          # leaving it at 2 would fail this step even though the test succeeded.
          $LASTEXITCODE = 0

      # The same argument checks as the Ubuntu job runs for setup.sh: each call
      # must fail without creating the target and without scaffolding into the
      # template checkout. PowerShell rejects an unknown parameter itself (exit 1).
      - name: Invalid arguments fail fast (no stray target, no in-place setup)
        shell: powershell
        run: |
          $typo = Join-Path $env:TEMP "ci_typo2"
          function Expect-Failure([int]$Want, [string[]]$SetupArgs) {
            # The runner sets 'Stop': PowerShell's own error text on stderr (unknown
            # parameter) would end the step instead of being discarded.
            $ErrorActionPreference = 'Continue'
            & powershell -NoProfile -ExecutionPolicy Bypass -File .\setup.ps1 @SetupArgs *> $null
            $code = $LASTEXITCODE
            if ($code -eq 0 -or ($Want -gt 0 -and $code -ne $Want)) { Write-Host "expected exit $Want, got $code for: $SetupArgs"; exit 1 }
            foreach ($p in $typo, "ci_inside", "00_Status.md", "workspace", "02_Literature") {
              if (Test-Path -LiteralPath $p) { Write-Host "created $p for: $SetupArgs"; exit 1 }
            }
          }
          Expect-Failure 2 @("-WorkType", "Bachelorarbeit", "-Structure", "Long-form", "-Scaffolding", "full", "-Target", $typo, "-NonInteractive")
          Expect-Failure 2 @("-WorkType", "Bachelor thesis", "-Structure", "Long-form", "-Scaffolding", "fulll", "-Target", $typo, "-NonInteractive")
          Expect-Failure 2 @("-WorkType", "Seminar paper", "-Structure", "Long-form", "-Scaffolding", "full", "-Target", $typo, "-NonInteractive")
          Expect-Failure 2 @("-WorkType", "Presentation", "-Structure", "Multi-project", "-Scaffolding", "full", "-Target", $typo, "-NonInteractive")
          Expect-Failure 2 @("-WorkType", "Bachelor thesis", "-Structure", "Long-form", "-Target", $typo, "-NonInteractive")
          Expect-Failure 2 @("-WorkType", "Bachelor thesis", "-Structure", "Long-form", "-Scaffolding", "full", "-Target", "ci_inside", "-NonInteractive")
          Expect-Failure 2 @("-WorkType", "Bachelor thesis", "-Structure", "Long-form", "-Scaffolding", "full", "-Target", ".\ci_inside\sub", "-NonInteractive")
          Expect-Failure 0 @("-WorkType", "Bachelor thesis", "-Structure", "Long-form", "-Scaffolding", "full", "-Taget", $typo, "-NonInteractive")
          Expect-Failure 0 @("Bachelor thesis", "Long-form", "full", $typo, "extra", "-NonInteractive")
          # An empty -Target (e.g. an unset variable) exits 2 instead of setting up here.
          # (Through -Command: Windows PowerShell 5.1 drops an empty argument to -File.)
          $ErrorActionPreference = 'Continue'
          & powershell -NoProfile -ExecutionPolicy Bypass -Command "& .\setup.ps1 -WorkType 'Seminar paper' -Structure Flat -Scaffolding full -Target `$NotSet -NonInteractive; exit `$LASTEXITCODE" *> $null
          if ($LASTEXITCODE -ne 2) { Write-Host "empty -Target: expected exit 2, got $LASTEXITCODE"; exit 1 }
          if (Test-Path workspace) { Write-Host "empty -Target: set up in the template folder"; exit 1 }
          $LASTEXITCODE = 0

      - name: setup.ps1 keeps its UTF-8 BOM (Windows PowerShell 5.1 needs it)
        shell: powershell
        run: |
          $b = [System.IO.File]::ReadAllBytes((Join-Path $PWD 'setup.ps1'))
          if ($b[0] -ne 0xEF -or $b[1] -ne 0xBB -or $b[2] -ne 0xBF) { Write-Host "setup.ps1 lost its UTF-8 BOM"; exit 1 }

      - name: Setup smoke (flat, multi-project), re-run and generated files
        shell: powershell
        run: |
          function Invoke-Setup([string]$Dir, [string[]]$SetupArgs) {
            Push-Location -LiteralPath $Dir
            & powershell -NoProfile -ExecutionPolicy Bypass -File ./setup.ps1 @SetupArgs
            $code = $LASTEXITCODE
            Pop-Location
            if ($code -ne 0) { Write-Host "setup.ps1 $SetupArgs in $Dir exited with $code"; exit 1 }
          }
          $flat = Join-Path $env:TEMP 'ci_ps_flat'
          $multi = Join-Path $env:TEMP 'ci_ps_multi'
          Invoke-Setup $PWD @('-WorkType', 'Seminar paper', '-Structure', 'Flat', '-Scaffolding', 'full', '-Target', $flat, '-NonInteractive')
          if (-not (Test-Path (Join-Path $flat 'workspace/sources/_guidelines'))) { Write-Host "flat: workspace/sources/_guidelines missing"; exit 1 }
          # [ ] in the target name must not be read as a wildcard pattern.
          $brk = Join-Path $env:TEMP 'ci_ps_[final]'
          Invoke-Setup $PWD @('-WorkType', 'Bachelor thesis', '-Structure', 'Long-form', '-Scaffolding', 'full', '-Target', $brk, '-NonInteractive')
          if (-not (Test-Path -LiteralPath (Join-Path $brk '00_Status.md'))) { Write-Host "brackets: 00_Status.md missing"; exit 1 }
          # ... and a re-run inside that project still finds the template there.
          Invoke-Setup $brk @('-WorkType', 'Bachelor thesis', '-Structure', 'Long-form', '-Scaffolding', 'full', '-NonInteractive')
          Invoke-Setup $PWD @('-WorkType', 'Master thesis', '-Structure', 'Multi-project', '-Scaffolding', 'minimal', '-Target', $multi, '-NonInteractive')
          # The sub-projects read ..\00_Shared_Materials\ directly: no shared\ link or copy.
          foreach ($sub in '01_Proposal', '02_Main_Work', '03_Defense') {
            if (Get-Item -LiteralPath (Join-Path $multi "$sub/shared") -Force -ErrorAction SilentlyContinue) { Write-Host "multi: $sub/shared was created"; exit 1 }
          }
          # The template ships a .gitattributes; setup appends the six LFS rules once.
          $lfs = @(Select-String -Path (Join-Path $flat '.gitattributes') -Pattern 'filter=lfs').Count
          if ($lfs -ne 6) { Write-Host "flat: expected 6 LFS rules in .gitattributes, found $lfs"; exit 1 }
          # Git LFS is set up in the project's own config (git lfs install --local), not globally.
          if (Get-Command git-lfs -ErrorAction SilentlyContinue) {
            if (-not (git -C $flat config --local --get filter.lfs.clean)) { Write-Host "flat: no LFS filter in the project's .git/config"; exit 1 }
          }
          # A re-run in place keeps edited state files and does not duplicate the LFS rules.
          $status = Join-Path $multi '02_Main_Work/00_Status.md'
          Add-Content -Path $status -Value 'ci-marker'
          Invoke-Setup $multi @('-WorkType', 'Master thesis', '-Structure', 'Multi-project', '-Scaffolding', 'minimal', '-NonInteractive')
          if (-not (Select-String -Path $status -Pattern 'ci-marker' -Quiet)) { Write-Host "re-run overwrote 02_Main_Work/00_Status.md"; exit 1 }
          $lfs = @(Select-String -Path (Join-Path $multi '.gitattributes') -Pattern 'filter=lfs').Count
          if ($lfs -ne 6) { Write-Host "re-run: expected 6 LFS rules in .gitattributes, found $lfs"; exit 1 }
          # shared\ entries from an earlier version (a copy, a link, and the text file that a
          # clone without symlink support leaves) are named in "Next steps", and kept; a
          # project without them gets no such note.
          function Get-RerunOutput {
            Push-Location -LiteralPath $multi
            $out = & powershell -NoProfile -ExecutionPolicy Bypass -File ./setup.ps1 -WorkType 'Master thesis' -Structure 'Multi-project' -Scaffolding minimal -NonInteractive | Out-String
            $code = $LASTEXITCODE
            Pop-Location
            if ($code -ne 0) { Write-Host "re-run exited with $code"; exit 1 }
            return $out
          }
          if ((Get-RerunOutput) -match 'No longer used') { Write-Host "old shared\ note although there is none"; exit 1 }
          Copy-Item -Path (Join-Path $multi '00_Shared_Materials') -Destination (Join-Path $multi '01_Proposal/shared') -Recurse
          New-Item -ItemType SymbolicLink -Path (Join-Path $multi '02_Main_Work/shared') -Target (Join-Path $multi '00_Shared_Materials') | Out-Null
          Set-Content -LiteralPath (Join-Path $multi '03_Defense/shared') -Value '../00_Shared_Materials' -NoNewline
          $out = Get-RerunOutput
          if ($out -notmatch 'No longer used.*01_Proposal\\shared 02_Main_Work\\shared 03_Defense\\shared') { Write-Host $out; Write-Host "old shared\ entries not named"; exit 1 }
          foreach ($p in '01_Proposal/shared/guidelines', '02_Main_Work/shared/guidelines', '03_Defense/shared') {
            if (-not (Test-Path -LiteralPath (Join-Path $multi $p))) { Write-Host "re-run removed $p"; exit 1 }
          }

      - name: Closed stdin exits 2 instead of prompting forever; an error exit waits for Enter
        shell: powershell
        run: |
          $empty = Join-Path $env:TEMP 'ci_empty_stdin.txt'
          $out = Join-Path $env:TEMP 'ci_stdin_out.txt'
          [System.IO.File]::WriteAllText($empty, '')
          $p = Start-Process -FilePath powershell -NoNewWindow -PassThru `
            -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', './setup.ps1', '-WorkType', '"Bachelor thesis"', '-Structure', 'Flat' `
            -RedirectStandardInput $empty -RedirectStandardOutput $out
          $null = $p.Handle   # keeps ExitCode available after the process ends
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host "setup.ps1 kept prompting on closed stdin"; exit 1 }
          if ($p.ExitCode -ne 2) { Get-Content $out -TotalCount 40; Write-Host "expected exit 2, got $($p.ExitCode)"; exit 1 }
          # A bare folder name at the target prompt lies inside the template: the prompt
          # asks again (the closed input then ends the run at the next question).
          $answers = Join-Path $env:TEMP 'ci_inside_answers.txt'
          [System.IO.File]::WriteAllText($answers, "2`r`nThesisSub`r`n")
          $p = Start-Process -FilePath powershell -NoNewWindow -PassThru `
            -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', './setup.ps1' `
            -RedirectStandardInput $answers -RedirectStandardOutput $out
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host "setup.ps1 hung at the target prompt"; exit 1 }
          $asked = (Select-String -Path $out -Pattern 'lies inside the cephalo template folder' -Quiet) -and
            (Select-String -Path $out -Pattern 'input closed before a choice was made' -Quiet) -and
            -not (Select-String -Path $out -Pattern 'must not be inside the cephalo template directory' -Quiet)
          if ($p.ExitCode -ne 2 -or -not $asked) {
            Get-Content $out -TotalCount 60; Write-Host "the target prompt did not ask again (exit $($p.ExitCode))"; exit 1
          }
          # The error exits of an interactive run wait for Enter (here a -Target inside
          # the template), so a "Run with PowerShell" window does not close at once.
          [System.IO.File]::WriteAllText($answers, "`r`n")
          $p = Start-Process -FilePath powershell -NoNewWindow -PassThru `
            -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', './setup.ps1', '-Target', 'ThesisSub' `
            -RedirectStandardInput $answers -RedirectStandardOutput $out
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host "setup.ps1 hung at the error pause"; exit 1 }
          if ($p.ExitCode -ne 2 -or -not (Select-String -Path $out -Pattern 'check the messages above' -Quiet)) {
            Get-Content $out -TotalCount 60; Write-Host "no pause before the error exit (exit $($p.ExitCode))"; exit 1
          }
          if (Test-Path -LiteralPath 'ThesisSub') { Write-Host "ThesisSub was created"; exit 1 }
          $LASTEXITCODE = 0

      - name: Python syntax (Windows)
        shell: powershell
        run: python -m py_compile scripts/abbreviations_extract.py scripts/bibliography_check.py scripts/build_reference_docx.py scripts/cephalo_guard.py scripts/cross_session_audit.py scripts/docx_pagination.py scripts/repeated_citations.py scripts/state_check.py scripts/verbatim_check.py

      # Informational only: not part of the verified baseline. Remove
      # continue-on-error once a clean run is confirmed.
      - name: PSScriptAnalyzer (errors only, informational)
        shell: powershell
        continue-on-error: true
        run: |
          if (Get-Module -ListAvailable PSScriptAnalyzer) {
            # Invoke-ScriptAnalyzer only emits records; turn findings into a failing exit code.
            $findings = Invoke-ScriptAnalyzer -Path .\setup.ps1 -Severity Error
            $findings | Format-Table -AutoSize | Out-String | Write-Host
            if ($findings) { exit 1 }
          } else {
            Write-Host "PSScriptAnalyzer not available - skipped"
          }

  # setup.sh and the shell scripts on the two other documented platforms:
  # macOS runs them with /bin/bash 3.2 and BSD tar, Windows with Git Bash
  # (MSYS: ln -s makes copies, NTFS ignores letter case, CRLF checkouts).
  shell-platforms:
    name: setup.sh and shell scripts (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS /bin/bash 3.2
            sh: /bin/bash
          - os: windows-latest
            name: Windows Git Bash
            sh: bash
    defaults:
      run:
        shell: bash
    env:
      SH: ${{ matrix.sh }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install script dependencies
        run: python -m pip install -r requirements.txt

      - name: Platform (bash version, tar, line endings)
        run: |
          "$SH" --version | head -1
          tar --version | head -1
          if [ "$RUNNER_OS" = macOS ]; then
            "$SH" --version | head -1 | grep -q 'version 3\.2'
            tar --version | grep -q bsdtar
          fi
          # The checkout may use core.autocrlf=true (Windows): .gitattributes keeps *.sh LF.
          for f in setup.sh scripts/*.sh; do
            if grep -q $'\r' "$f"; then echo "CRLF in $f"; exit 1; fi
            "$SH" -n "$f"
          done

      - name: Setup smoke (all three structures), re-run and generated files
        run: |
          "$SH" setup.sh "Seminar paper" "Flat" full --target /tmp/ci_flat </dev/null >/dev/null
          "$SH" setup.sh "Bachelor thesis" "Long-form" full --target /tmp/ci_long </dev/null >/dev/null
          "$SH" setup.sh "Master thesis" "Multi-project" full --target /tmp/ci_multi </dev/null >/tmp/ci_multi.out
          test -d /tmp/ci_flat/workspace/sources/_guidelines
          test -f /tmp/ci_long/00_Status.md
          test -f /tmp/ci_multi/02_Main_Work/05_Empirical/data/processed/.gitkeep
          # The sub-projects read ../00_Shared_Materials/ directly: no shared/ link or copy,
          # and no note about old shared/ entries in a new project.
          for sub in 01_Proposal 02_Main_Work 03_Defense; do
            if [ -e "/tmp/ci_multi/$sub/shared" ] || [ -L "/tmp/ci_multi/$sub/shared" ]; then echo "$sub/shared was created"; exit 1; fi
          done
          if grep -q 'No longer used' /tmp/ci_multi.out; then echo "old shared/ note in a new project"; exit 1; fi
          # A shared/ entry from an earlier version (here the text file that a clone
          # without symlink support leaves) is named in "Next steps", and kept.
          printf '../00_Shared_Materials' > /tmp/ci_multi/03_Defense/shared
          (cd /tmp/ci_multi && "$SH" setup.sh "Master thesis" "Multi-project" full </dev/null >/tmp/ci_multi2.out)
          grep 'No longer used' /tmp/ci_multi2.out | grep -q '03_Defense/shared'
          test -f /tmp/ci_multi/03_Defense/shared
          # A re-run keeps state files; a missing .gitignore is written as the template's.
          echo "ci-marker" >> /tmp/ci_long/00_Status.md
          (cd /tmp/ci_long && "$SH" setup.sh "Bachelor thesis" "Long-form" full </dev/null >/dev/null)
          grep -q ci-marker /tmp/ci_long/00_Status.md
          rm /tmp/ci_flat/.gitignore
          (cd /tmp/ci_flat && "$SH" setup.sh "Seminar paper" "Flat" full </dev/null >/dev/null)
          # (Compared with Git's copy: a Windows checkout may have CRLF in .gitignore.)
          git show HEAD:.gitignore | cmp - /tmp/ci_flat/.gitignore
          test "$(grep -c 'filter=lfs' /tmp/ci_long/.gitattributes)" -eq 6
          # A command that fails inside a function (mkdir in create_dir) is reported, once.
          "$SH" setup.sh "Seminar paper" "Flat" full --target /tmp/ci_err </dev/null >/dev/null
          rmdir /tmp/ci_err/workspace/sources/_guidelines
          touch /tmp/ci_err/workspace/sources/_guidelines
          set +e
          (cd /tmp/ci_err && "$SH" setup.sh "Seminar paper" "Flat" full </dev/null >/tmp/ci_err1.out 2>&1); code1=$?
          set -e
          if [ "$code1" -ne 1 ] || [ "$(grep -c 'Setup exited unexpectedly' /tmp/ci_err1.out)" -ne 1 ]; then
            cat /tmp/ci_err1.out; echo "exit $code1: the failure was not reported exactly once"; exit 1
          fi
          # The same Ctrl+C test under macOS /bin/bash 3.2, and the only test there of the
          # target prompt asking again (Python has no pty module on Windows, so not under
          # Git Bash).
          [ "$RUNNER_OS" = Windows ] || python - "$SH" <<'EOF'
          import os, pty, re, select, subprocess, sys, time
          sh = sys.argv[1]
          # Bash before 5.1 runs no Ctrl+C trap while one is running: at the pauses of
          # the Ctrl+C handler itself (a real cancellation, Ctrl+C after the setup), a
          # second Ctrl+C is held back there, and Enter closes the pause instead.
          old_bash = subprocess.run([sh, "-c", '[ "$(( BASH_VERSINFO[0] * 100 + BASH_VERSINFO[1] ))" -lt 501 ]']).returncode == 0
          def drive(args, steps, enter_later):
              pid, fd = pty.fork()
              if pid == 0:
                  os.execvp(sh, [sh, "setup.sh"] + args)
              out, pos, i, end, last = b"", 0, 0, time.time() + 60, 0
              while True:
                  m = i < len(steps) and re.search(steps[i][0], out[pos:])
                  if m:
                      pos += m.end(); time.sleep(0.2); os.write(fd, steps[i][1]); i += 1; last = time.time()
                      continue
                  if enter_later and i == len(steps) and time.time() - last > 3:
                      os.write(fd, b"\n"); enter_later = False
                  if time.time() > end:
                      os.kill(pid, 9)
                      sys.exit("timeout:\n" + out.decode(errors="replace"))
                  if select.select([fd], [], [], 0.2)[0]:
                      try:
                          data = os.read(fd, 4096)
                      except OSError:
                          data = b""
                      if data:
                          out += data
                          continue
                  done, status = os.waitpid(pid, os.WNOHANG)
                  if done:
                      return os.waitstatus_to_exitcode(status), out.decode(errors="replace"), i
          cases = [
              ("error pause", ["--target", "ThesisSub"], [(rb"check the messages above", b"\x03")], 2, "Setup cancelled by user", 0, False),
              ("asked again", [], [(rb"Your choice \[1-2", b"2\n"), (rb"Target path:", b"ThesisSub\n"), (rb"lies inside the cephalo template folder", b""), (re.escape(os.path.realpath(os.getcwd()) + "/ThesisSub").encode(), b""), (rb"Target path:", b"/tmp/ci_reask_pty\n"), (rb"What kind of work", b"1\n"), (rb"How much scaffolding", b"1\n"), (rb"Proceed\?", b"y\n"), (rb"Delete it now\?", b"n\n"), (rb"Press Enter to close", b"\n")], 0, "lies inside the cephalo template folder", 1, False),
              ("ten invalid answers", [], [(rb"Your choice \[1-2", b"1\n"), (rb"What kind of work", b"x\n" * 10), (rb"check the messages above", b"\x03")], 2, "Setup cancelled by user", 0, False),
              ("cancelled at a menu", [], [(rb"Your choice \[1-2", b"1\n"), (rb"What kind of work", b"\x03"), (rb"Press Enter to close", b"\x03")], 130, "Setup cancelled by user", 1, old_bash),
              ("completed setup", ["Seminar paper", "Flat", "full", "--target", "/tmp/ci_pause_done"], [(rb"Delete it now\?", b"n\n"), (rb"Press Enter to close", b"\x03")], 0, "Setup cancelled by user", 0, False),
              ("stopped after the setup", ["Seminar paper", "Flat", "full", "--target", "/tmp/ci_pause_done2"], [(rb"Delete it now\?", b"\x03"), (rb"Press Enter to close", b"\x03")], 0, "after the setup had completed", 1, old_bash),
          ]
          for name, args, steps, want, text, count, enter_later in cases:
              code, out, sent = drive(args, steps, enter_later)
              if code != want or sent != len(steps) or out.count(text) != count:
                  sys.exit(f"{name}: exit {code}, {sent} of {len(steps)} inputs sent\n{out}")
          EOF
          test ! -e ThesisSub

      - name: --target rules and invalid arguments
        run: |
          expect() {
            want=$1; shift
            set +e; "$SH" setup.sh "$@" </dev/null >/tmp/ci_out.txt 2>&1; code=$?; set -e
            if [ "$code" -ne "$want" ]; then cat /tmp/ci_out.txt; echo "expected exit $want, got $code: $*"; exit 1; fi
          }
          # Local artifacts stay out of a --target copy.
          mkdir -p venv scripts/.venv .claude/worktrees/x
          touch "cephalo-setup (1).sh" .claude/settings.local.json
          expect 0 "Seminar paper" "Flat" full --target /tmp/ci_excl
          for p in .github venv scripts/.venv .claude/worktrees .claude/settings.local.json "cephalo-setup (1).sh"; do
            if [ -e "/tmp/ci_excl/$p" ]; then echo "copied into --target: $p"; exit 1; fi
          done
          rm -rf venv scripts/.venv .claude/worktrees .claude/settings.local.json "cephalo-setup (1).sh"
          # A non-empty target is refused without prompts; folder metadata alone is not content.
          mkdir /tmp/ci_nonempty && touch /tmp/ci_nonempty/existing.txt
          expect 2 "Seminar paper" "Flat" full --target /tmp/ci_nonempty
          test "$(ls -A /tmp/ci_nonempty)" = existing.txt
          mkdir /tmp/ci_meta && touch /tmp/ci_meta/.DS_Store /tmp/ci_meta/Thumbs.db /tmp/ci_meta/desktop.ini
          expect 0 "Seminar paper" "Flat" full --target /tmp/ci_meta
          test -d /tmp/ci_meta/workspace/sources/_guidelines
          # The template folder under another letter case (APFS and NTFS usually ignore
          # case) is recognized: a target inside it is refused.
          up="$(dirname "$PWD")/$(basename "$PWD" | tr '[:lower:]' '[:upper:]')"
          if [ "$up" != "$PWD" ] && [ -d "$up" ]; then
            expect 2 "Seminar paper" "Flat" full --target "$up/ci_sub"
            test ! -e ci_sub
          else
            echo "case-sensitive file system: letter-case test skipped"
          fi
          # Typos exit 2 without a stray target or an in-place setup.
          for args in "Bachelorarbeit|Long-form|full" "Bachelor thesis|Long-form|fulll" "Seminar paper|Long-form|full"; do
            IFS='|' read -r a b c <<< "$args"
            expect 2 "$a" "$b" "$c" --target /tmp/ci_typo
          done
          expect 2 "Bachelor thesis" "Long-form" full --taget /tmp/ci_typo
          expect 2 "Bachelor thesis" "Long-form" full --target=
          test ! -e /tmp/ci_typo && test ! -e 00_Status.md && test ! -e workspace

      - name: setup.sh helpers under this bash (rule merge, shell quoting)
        run: |
          {
            sed -n '/^merge_missing_lines() {/,/^}/p;/^shell_quote() {/,/^}/p' setup.sh
            cat <<'EOF'
          printf '\357\273\277*.swp\r\nown/\n' > /tmp/ci_gi
          printf '# comment\n*.swp\n*.pyc\n*.pyc\n' > /tmp/ci_tpl
          test "$(merge_missing_lines /tmp/ci_tpl /tmp/ci_gi)" = 1
          test "$(tail -n 1 /tmp/ci_gi)" = '*.pyc'
          test "$(merge_missing_lines /tmp/ci_tpl /tmp/ci_gi)" = 0
          q="$(shell_quote "it's \$HOME \`x\`")"
          test "$(eval "printf '%s' $q")" = "it's \$HOME \`x\`"
          echo "helpers OK under $BASH_VERSION"
          EOF
          } > /tmp/ci_helpers.sh
          "$SH" -eu /tmp/ci_helpers.sh

      - name: docx_postprocess.sh and extract_styleguide.sh
        run: |
          R="$PWD"; W=/tmp/ci_px; rm -rf "$W"; mkdir -p "$W/good"
          python - "$W" <<'EOF'
          import os, stat, sys, zipfile
          from docx import Document
          w = sys.argv[1]
          for name, text in (("Chapter [2].docx", "eins"), ("Chapter 2.docx", "zwei"), ("-draft.docx", "drei")):
              d = Document()
              d.add_paragraph(text)
              d.save(os.path.join(w, name))
          with zipfile.ZipFile(os.path.join(w, "Chapter 2.docx")) as z, zipfile.ZipFile(os.path.join(w, "link.docx"), "w") as out:
              for i in z.infolist():
                  out.writestr(i, z.read(i.filename))
              link = zipfile.ZipInfo("word/media/image1.png")
              link.create_system = 3
              link.external_attr = (stat.S_IFLNK | 0o777) << 16
              out.writestr(link, "../../../in.docx")
          with zipfile.ZipFile(os.path.join(w, "good", "guide.pdf"), "w") as z:
              z.writestr("rules.txt", "Example rule text")
          EOF
          hyphenated() { python -c "import sys, zipfile; sys.exit('<w:autoHyphenation/>' not in zipfile.ZipFile(sys.argv[1]).read('word/settings.xml').decode())" "$1"; }
          cd "$W"
          # [ ] in the name is not a wildcard: "Chapter 2.docx" stays untouched.
          before="$(cksum < "Chapter 2.docx")"
          "$SH" "$R/scripts/docx_postprocess.sh" "Chapter [2].docx"
          hyphenated "Chapter [2].docx"
          test "$(cksum < "Chapter 2.docx")" = "$before"
          # A name starting with "-" is a file, not an option.
          "$SH" "$R/scripts/docx_postprocess.sh" -draft.docx
          hyphenated ./-draft.docx
          # A symbolic link to the document: the document is patched, the link stays.
          if [ "$RUNNER_OS" != Windows ]; then
            cp "Chapter 2.docx" target.docx; ln -s target.docx linked.docx
            "$SH" "$R/scripts/docx_postprocess.sh" linked.docx
            test -L linked.docx
            hyphenated target.docx
          fi
          # A symbolic-link entry is refused before unpacking (Git Bash's unzip would copy it).
          cp link.docx link.orig
          set +e; "$SH" "$R/scripts/docx_postprocess.sh" link.docx >out.txt 2>&1; code=$?; set -e
          test "$code" -eq 1
          grep -q "symbolic links" out.txt
          cmp link.docx link.orig
          # A ZIP disguised as a PDF is unpacked by the script's own safe extractor.
          "$SH" "$R/scripts/extract_styleguide.sh" "$W/good" "$W/out_good"
          grep -q "Example rule text" "$W/out_good/guide.txt"

      - name: cephalo guard tests on macOS (all of them, and its own file system with a folder name with an umlaut in either form)
        if: runner.os == 'macOS'
        run: python -I .github/tests/test_cephalo_guard.py -v 2>&1 | tee /tmp/ci_macfs.txt; grep -q '^OK' /tmp/ci_macfs.txt; if grep -Eq '[.]{3} skipped|[(]skipped=' /tmp/ci_macfs.txt; then echo 'a test was skipped'; exit 1; fi

      - name: cephalo guard hook command under this shell (a path with a space and an umlaut)
        run: |
          P="$RUNNER_TEMP/guard proj ü"; rm -rf "$P"; mkdir -p "$P/scripts" "$P/workspace"
          cp scripts/cephalo_guard.py scripts/cephalo_guard.sh "$P/scripts/"
          CMD="$(python -c "import json; print(json.load(open('templates/claude_settings.json'))['hooks']['PreToolUse'][0]['hooks'][0]['command'])")"
          # the hook's input, from a file: a command that does not read it must not break a pipe
          slip() { python -c "import json, sys; print(json.dumps({'session_id': 'ci', 'hook_event_name': 'PreToolUse', 'tool_name': 'Bash', 'tool_input': {'command': 'echo x >> workspace/state.md'}, 'cwd': sys.argv[1]}))" "$1" > "$1.json"; }
          # what Claude Code receives is a deny and nothing else: no allow, no changed input
          denies() { python -c "import json, sys; o = json.load(sys.stdin); h = o.get('hookSpecificOutput', {}); assert set(o) == {'hookSpecificOutput'} and set(h) == {'hookEventName', 'permissionDecision', 'permissionDecisionReason'} and h['permissionDecision'] == 'deny' and h['hookEventName'] == 'PreToolUse' and 'cephalo guard S1' in h['permissionDecisionReason'], o"; }
          # cephalo_guard.sh starts the guard with py on Windows, otherwise with python3, and without them not at all
          if { [ "$RUNNER_OS" = Windows ] && command -v py >/dev/null; } || command -v python3 >/dev/null; then want=deny; else want=none; fi
          echo "expected: $want"
          slip "$P"
          for shell in "$SH" sh; do
            out="$(CLAUDE_PROJECT_DIR="$P" "$shell" -c "$CMD" < "$P.json")"
            echo "$shell: ${out:0:120}"
            if [ "$want" = deny ]; then
              printf '%s\n' "$out" | denies
            else
              test -z "$out"
            fi
          done
          # Without the scripts the command passes silently.
          E="$RUNNER_TEMP/guard empty"; rm -rf "$E"; mkdir -p "$E"
          slip "$E"
          out="$(CLAUDE_PROJECT_DIR="$E" "$SH" -c "$CMD" < "$E.json")"
          test -z "$out"
          # A sub-project of a multi-project setup uses the scripts of the folder above; another project
          # without its own never does.
          M="$RUNNER_TEMP/guard multi ü"; rm -rf "$M"; mkdir -p "$M/scripts" "$M/00_Shared_Materials" "$M/02_Main_Work/workspace"
          cp scripts/cephalo_guard.py scripts/cephalo_guard.sh "$M/scripts/"
          slip "$M/02_Main_Work"
          out="$(CLAUDE_PROJECT_DIR="$M/02_Main_Work" "$SH" -c "$CMD" < "$M/02_Main_Work.json")"
          if [ "$want" = deny ]; then printf '%s\n' "$out" | denies; else test -z "$out"; fi
          rm -r "$M/00_Shared_Materials"
          out="$(CLAUDE_PROJECT_DIR="$M/02_Main_Work" "$SH" -c "$CMD" < "$M/02_Main_Work.json")"
          test -z "$out"
