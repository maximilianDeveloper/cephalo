name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-smoke:
    name: Lint & setup smoke (Ubuntu, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.9 backs the documented minimum; a recent version catches deprecations.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install script dependencies
        run: python -m pip install -r requirements.txt pyyaml

      - name: Python syntax
        run: python -m py_compile scripts/abbreviations_extract.py scripts/bibliography_check.py scripts/cross_session_audit.py

      - name: Shell syntax
        # One file per call: `bash -n a b c` parses only a (b and c become its arguments).
        run: for f in setup.sh scripts/docx_postprocess.sh scripts/extract_styleguide.sh; do bash -n "$f"; done

      - name: shellcheck
        run: shellcheck setup.sh scripts/docx_postprocess.sh scripts/extract_styleguide.sh

      - name: Workflow YAML parse (all 8 must load)
        run: |
          python - <<'EOF'
          import glob, yaml
          files = sorted(glob.glob("workflows/*.yaml"))
          assert len(files) == 8, f"expected 8 workflow files, found {len(files)}"
          for f in files:
              yaml.safe_load(open(f, encoding="utf-8"))
              print("OK", f)
          EOF

      - name: Agent and workflow references
        run: |
          python - <<'EOF'
          import glob, os, re, yaml
          errors = []
          agent_files = sorted(glob.glob(".claude/agents/*.md"))
          assert len(agent_files) == 10, f"expected 10 agent files, found {len(agent_files)}"
          for f in agent_files:
              front = yaml.safe_load(open(f, encoding="utf-8").read().split("---")[1])
              if front.get("name") != os.path.basename(f)[:-3]:
                  errors.append(f"{f}: frontmatter name {front.get('name')!r} does not match the file name")
          # Archives are unpacked only through scripts/extract_styleguide.sh (safe_extract_zip):
          # no agent or checklist may show another extractor as a command, in a code span
          # or in a code block (naming one in prose, e.g. to forbid it, is fine).
          cmd = r"\b(?:unzip|7z|bsdtar)\s+\S|\btar\b[^|;&`\n]*(?:\s-?[a-z]*x[a-z]*\b|--extract)|\.extractall\(|unpack_archive\(|\bExpand-Archive\s+\S"
          in_span = re.compile(r"`[^`]*?(?:" + cmd + r")[^`]*`")
          in_block = re.compile(cmd)
          for f in agent_files + sorted(glob.glob("checklists/*.md")):
              fenced = False
              for n, line in enumerate(open(f, encoding="utf-8").read().splitlines(), 1):
                  if line.lstrip().startswith("```"):
                      fenced = not fenced
                      continue
                  # In a code block, any extractor call counts (after dropping a shell comment).
                  code = re.sub(r"(^|\s)#.*", "", line)
                  if in_span.search(line) or (fenced and in_block.search(code)):
                      errors.append(f"{f}:{n}: archive extraction outside scripts/extract_styleguide.sh")
          def refs(node):
              if isinstance(node, dict):
                  for k, v in node.items():
                      if k == "agent" and isinstance(v, str):
                          yield v
                      elif k in ("agents", "active_agents", "optional_agents") and isinstance(v, list):
                          yield from (a for a in v if isinstance(a, str))
                      else:
                          yield from refs(v)
              elif isinstance(node, list):
                  for v in node:
                      yield from refs(v)
          for f in sorted(glob.glob("workflows/*.yaml")):
              wf = yaml.safe_load(open(f, encoding="utf-8"))
              declared = wf.get("agents", {})
              for key, spec in declared.items():
                  if not os.path.isfile(spec["file"]):
                      errors.append(f"{f}: agent {key!r} points to missing {spec['file']}")
              for name in refs({k: v for k, v in wf.items() if k != "agents"}):
                  if name not in declared:
                      errors.append(f"{f}: agent {name!r} is used but not declared")
          print("\n".join(errors) or "OK: agent definitions and workflow references")
          raise SystemExit(1 if errors else 0)
          EOF

      - name: Script --help smokes
        run: |
          python scripts/abbreviations_extract.py --help
          python scripts/bibliography_check.py --help
          python scripts/cross_session_audit.py --help
          bash scripts/docx_postprocess.sh --help
          bash scripts/extract_styleguide.sh --help
          bash setup.sh --help

      - name: Non-interactive setup smoke (all three structures)
        run: |
          bash setup.sh "Seminar paper" "Flat" full --target /tmp/ci_flat </dev/null
          bash setup.sh "Bachelor thesis" "Long-form" full --target /tmp/ci_long </dev/null | tee /tmp/ci_long.out
          # The calling shell stays in the template folder: the summary must name the project.
          grep -qx '   cd /tmp/ci_long' /tmp/ci_long.out
          bash setup.sh "Master thesis" "Multi-project" minimal --target /tmp/ci_multi </dev/null
          test -d /tmp/ci_flat/workspace/sources/_guidelines
          test -f /tmp/ci_long/00_Status.md
          test -d /tmp/ci_multi/00_Shared_Materials/guidelines
          for sub in 01_Proposal 02_Main_Work 03_Defense; do test -L "/tmp/ci_multi/$sub/shared"; done

      - name: Invalid arguments fail fast (exit 2, no stray target)
        run: |
          set +e
          bash setup.sh "Bachelor thesis" "Langform" full --target /tmp/ci_typo </dev/null
          code=$?
          set -e
          test "$code" -eq 2
          test ! -e /tmp/ci_typo
          # More typos: each must exit 2 without creating the target and without
          # scaffolding into the template checkout itself.
          expect_2() {
            set +e; bash setup.sh "$@" </dev/null >/dev/null 2>&1; code=$?; set -e
            if [ "$code" -ne 2 ]; then echo "expected exit 2, got $code for: $*"; exit 1; fi
            test ! -e /tmp/ci_typo && test ! -e ci_inside && test ! -e 00_Status.md && test ! -e workspace
          }
          expect_2 "Bachelorarbeit" "Long-form" full --target /tmp/ci_typo
          expect_2 "Bachelor thesis" "Long-form" fulll --target /tmp/ci_typo
          expect_2 "Bachelor thesis" "Long-form" full --taget /tmp/ci_typo
          expect_2 "Bachelor thesis" "Long-form" full /tmp/ci_typo
          expect_2 "Bachelor thesis" "Long-form" full --target=
          expect_2 "Bachelor thesis" "Long-form" full --target ci_inside

      - name: Setup regressions (re-run, generated files, menus, numbering)
        run: |
          # A re-run must keep existing state files (this once caused data loss).
          for f in 00_Status.md 00_Decisions.md 00_Feedback_log.md; do echo "ci-marker" >> "/tmp/ci_long/$f"; done
          (cd /tmp/ci_long && bash setup.sh "Bachelor thesis" "Long-form" full </dev/null >/dev/null)
          for f in 00_Status.md 00_Decisions.md 00_Feedback_log.md; do grep -q ci-marker "/tmp/ci_long/$f"; done
          # Generated projects: LFS rules next to the template's eol rule, once;
          # state files come from templates/, not from the minimal fallback.
          test "$(grep -c 'filter=lfs' /tmp/ci_long/.gitattributes)" -eq 6
          grep -q '^\*\.sh text eol=lf' /tmp/ci_long/.gitattributes
          for sub in 01_Proposal 02_Main_Work 03_Defense; do
            cmp templates/status.md "/tmp/ci_multi/$sub/00_Status.md"
            cmp templates/decisions.md "/tmp/ci_multi/$sub/00_Decisions.md"
            cmp templates/feedback_log.md "/tmp/ci_multi/$sub/00_Feedback_log.md"
          done
          # The .gitignore that setup writes when none exists equals the template's.
          rm /tmp/ci_flat/.gitignore
          (cd /tmp/ci_flat && bash setup.sh "Seminar paper" "Flat" full </dev/null >/dev/null)
          cmp .gitignore /tmp/ci_flat/.gitignore
          # Invalid menu input is answered with a hint; closed stdin then exits 2.
          set +e
          printf '9\nabc\n' | bash setup.sh >/dev/null 2>/tmp/ci_menu.err
          code=$?
          set -e
          test "$code" -eq 2
          test "$(grep -c 'Please enter a number between 1 and 5.' /tmp/ci_menu.err)" -eq 2
          # "Next steps" are numbered without gaps.
          for args in "Seminar paper|Flat|full" "Bachelor thesis|Long-form|minimal" "Master thesis|Multi-project|full"; do
            IFS='|' read -r w s c <<< "$args"
            rm -rf /tmp/ci_steps
            got=$(bash setup.sh "$w" "$s" "$c" --target /tmp/ci_steps </dev/null | sed -n '/Next steps/,$p' | sed 's/\x1b\[[0-9;]*m//g' | grep -oE '^ *[0-9]+\.' | tr -d ' .' | tr '\n' ' ')
            want=$(seq -s ' ' 1 "$(echo "$got" | wc -w)")
            test "$got" = "$want " || { echo "Next steps numbered '$got' for $args"; exit 1; }
          done

      - name: Shell scripts stay LF in a core.autocrlf=true clone
        run: |
          rm -rf /tmp/ci_crlf
          git -c core.autocrlf=true clone -q . /tmp/ci_crlf
          for f in /tmp/ci_crlf/setup.sh /tmp/ci_crlf/scripts/*.sh; do
            if grep -q $'\r' "$f"; then echo "CRLF in $f"; exit 1; fi
            bash -n "$f"
          done

      - name: setup-wizard inline JavaScript parses
        run: |
          python - <<'EOF'
          import re
          page = open("docs/setup-wizard.html", encoding="utf-8").read()
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", page, re.S)
          assert scripts, "no inline script found"
          open("/tmp/ci_wizard.js", "w", encoding="utf-8").write("\n;\n".join(scripts))
          EOF
          node --check /tmp/ci_wizard.js

      - name: Utility scripts on generated files (exit codes, safety checks)
        run: |
          W=/tmp/ci_util; rm -rf "$W"; mkdir -p "$W/good" "$W/evil"
          python - "$W" <<'EOF'
          import os, sys, zipfile
          from docx import Document
          w = sys.argv[1]
          d = Document()
          d.add_paragraph("Schmidt 2020, S. 15 führt aus. Müller (2021) stimmt zu. Die WHO (2019) auch. "
                          "Im Jahr 2020 stieg es. Die EU (2020) beschloss es. Das Kapitel (2020) zeigt es.")
          d.add_paragraph("U.S.A. and B2B, CO2, 5G, BENELUX, GmbH; e.g. z. B. 2020.")
          d.add_heading("Literaturverzeichnis", 1)
          for entry in ("Schmidt, K. (2020). A.", "Müller, J. (2021). B.", "WHO. (2019). C."):
              d.add_paragraph(entry)
          d.save(os.path.join(w, "ok.docx"))
          d.add_paragraph("Uncited, U. (2019). D.")
          d.save(os.path.join(w, "findings.docx"))
          a = Document()
          a.add_paragraph("Schmidt (2020) zeigt es.")
          a.add_heading("Literaturverzeichnis", 1)
          a.add_heading("Monographien", 2)
          a.add_paragraph("Schmidt, K. (2020). A.")
          a.add_paragraph("Keller, T. (2018). B.")
          a.add_heading("Anhang", 1)
          a.add_paragraph("Im Interview verwies die Befragte auf Keller (2018).")
          a.add_heading("Eidesstattliche Erklärung", 1)
          a.add_paragraph("Ort, Datum")
          a.save(os.path.join(w, "appendix.docx"))
          with zipfile.ZipFile(os.path.join(w, "notword.docx"), "w") as z:
              z.writestr("hello.txt", "a ZIP, but not a Word document")
          with zipfile.ZipFile(os.path.join(w, "good", "guide.pdf"), "w") as z:
              z.writestr("rules.txt", "Example rule text")
          with zipfile.ZipFile(os.path.join(w, "evil", "guide.pdf"), "w") as z:
              z.writestr("../../escaped.txt", "x")
          EOF
          expect() {
            want=$1; shift
            set +e; "$@" >"$W/out.txt" 2>&1; code=$?; set -e
            if [ "$code" -ne "$want" ]; then cat "$W/out.txt"; echo "expected exit $want, got $code: $*"; exit 1; fi
          }
          # bibliography_check.py: 0 = consistent, 1 = findings, 2 = unreadable input (one line)
          expect 0 python scripts/bibliography_check.py "$W/ok.docx"
          expect 1 python scripts/bibliography_check.py "$W/findings.docx"
          grep -q Uncited "$W/out.txt"
          expect 2 python scripts/bibliography_check.py "$W/notword.docx"
          test "$(wc -l < "$W/out.txt")" -eq 1
          # the bibliography ends at the next top-level heading (appendix, declaration)
          expect 0 python scripts/bibliography_check.py "$W/appendix.docx"
          # abbreviations_extract.py: dotted, digit and mixed-case forms; clean error otherwise
          expect 0 python scripts/abbreviations_extract.py "$W/ok.docx"
          for a in B2B CO2 5G BENELUX GmbH; do grep -qx "  $a" "$W/out.txt"; done
          if grep -qx "  US" "$W/out.txt"; then echo "U.S.A. was truncated to US"; exit 1; fi
          expect 1 python scripts/abbreviations_extract.py "$W/notword.docx"
          test "$(wc -l < "$W/out.txt")" -eq 1
          # docx_postprocess.sh: hyphenation on, package still valid, [Content_Types].xml first,
          # permission bits of the replaced file kept
          chmod 600 "$W/ok.docx"
          expect 0 bash scripts/docx_postprocess.sh "$W/ok.docx"
          test "$(stat -c %a "$W/ok.docx")" = 600
          python - "$W/ok.docx" <<'EOF'
          import sys, zipfile, docx
          docx.Document(sys.argv[1])
          z = zipfile.ZipFile(sys.argv[1])
          assert z.testzip() is None
          assert z.infolist()[0].filename == "[Content_Types].xml"
          assert "<w:autoHyphenation/>" in z.read("word/settings.xml").decode()
          # variants: a disabled open/close element; a non-w: namespace prefix
          W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main"
          for name, xml in (
              ("openclose.docx", z.read("word/settings.xml").decode().replace(
                  "<w:autoHyphenation/>", '<w:autoHyphenation w:val="0"></w:autoHyphenation>')),
              ("prefix.docx", '<ns0:settings xmlns:ns0="%s"><ns0:zoom ns0:percent="100"/></ns0:settings>' % W),
          ):
              with zipfile.ZipFile(sys.argv[1].replace("ok.docx", name), "w") as out:
                  for i in z.infolist():
                      out.writestr(i.filename, xml if i.filename == "word/settings.xml" else z.read(i.filename))
          EOF
          expect 0 bash scripts/docx_postprocess.sh "$W/openclose.docx"
          test "$(unzip -p "$W/openclose.docx" word/settings.xml | grep -o '<w:autoHyphenation' | wc -l)" -eq 1
          unzip -p "$W/openclose.docx" word/settings.xml | grep -q '<w:autoHyphenation/>'
          cp "$W/prefix.docx" "$W/prefix.orig"
          expect 1 bash scripts/docx_postprocess.sh "$W/prefix.docx"
          cmp "$W/prefix.docx" "$W/prefix.orig"
          # extract_styleguide.sh: a ZIP disguised as PDF is unpacked; path traversal is blocked
          expect 0 bash scripts/extract_styleguide.sh "$W/good" "$W/out_good"
          grep -q "Example rule text" "$W/out_good/guide.txt"
          # a text file left over from an earlier run is named, not deleted
          echo old > "$W/out_good/removed_guide.txt"
          expect 0 bash scripts/extract_styleguide.sh "$W/good" "$W/out_good"
          grep -q "not written by this run.*removed_guide.txt" "$W/out.txt"
          test -f "$W/out_good/removed_guide.txt"
          expect 1 bash scripts/extract_styleguide.sh "$W/evil" "$W/out_evil"
          grep -q "Blocked (security)" "$W/out.txt"
          # cross_session_audit.py: 0 = clean, 1 = findings, 2 = not a repository
          g() { git -c user.name=ci -c user.email=ci@example.com "$@"; }
          g init -q "$W/repo" && g -C "$W/repo" commit -q --allow-empty -m init
          expect 0 python scripts/cross_session_audit.py --repo-root "$W/repo"
          g -C "$W/repo" worktree add -q -b side "$W/side"
          echo "# note" > "$W/side/_note.md"
          expect 1 python scripts/cross_session_audit.py --repo-root "$W/side"
          grep -qF "**Main worktree:** \`$W/repo\`" "$W/out.txt"
          expect 2 python scripts/cross_session_audit.py --repo-root "$W/good"

  windows:
    name: PowerShell 5.1 parse & setup smoke (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # "shell: powershell" is Windows PowerShell 5.1 — exactly the floor the
      # scripts document. (pwsh would be PowerShell 7 and hides 5.1 issues.)
      - name: setup.ps1 parses under Windows PowerShell 5.1
        shell: powershell
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\setup.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs.Count -gt 0) { $errs | ForEach-Object { Write-Host $_.Message }; exit 1 }
          Write-Host "0 parse errors"

      - name: Non-interactive setup smoke (long-form)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\setup.ps1 -WorkType "Bachelor thesis" -Structure "Long-form" -Scaffolding full -Target "$env:TEMP\ci_long" -NonInteractive
          if ($LASTEXITCODE -ne 0) { Write-Host "expected exit 0, got $LASTEXITCODE"; exit 1 }
          if (-not (Test-Path "$env:TEMP\ci_long\00_Status.md")) { Write-Host "00_Status.md missing"; exit 1 }

      - name: Typo in -Structure fails fast without stray copy
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\setup.ps1 -WorkType "Bachelor thesis" -Structure "Langform" -Scaffolding full -Target "$env:TEMP\ci_typo" -NonInteractive
          if ($LASTEXITCODE -ne 2) { Write-Host "expected exit 2, got $LASTEXITCODE"; exit 1 }
          if (Test-Path "$env:TEMP\ci_typo") { Write-Host "stray target directory was created"; exit 1 }
          # Both assertions passed. Reset the deliberately provoked exit code: the
          # runner appends `exit $LASTEXITCODE` to every powershell block, so
          # leaving it at 2 would fail this step even though the test succeeded.
          $LASTEXITCODE = 0

      - name: setup.ps1 keeps its UTF-8 BOM (Windows PowerShell 5.1 needs it)
        shell: powershell
        run: |
          $b = [System.IO.File]::ReadAllBytes((Join-Path $PWD 'setup.ps1'))
          if ($b[0] -ne 0xEF -or $b[1] -ne 0xBB -or $b[2] -ne 0xBF) { Write-Host "setup.ps1 lost its UTF-8 BOM"; exit 1 }

      - name: Setup smoke (flat, multi-project), re-run and generated files
        shell: powershell
        run: |
          function Invoke-Setup([string]$Dir, [string[]]$SetupArgs) {
            Push-Location $Dir
            & powershell -NoProfile -ExecutionPolicy Bypass -File ./setup.ps1 @SetupArgs
            $code = $LASTEXITCODE
            Pop-Location
            if ($code -ne 0) { Write-Host "setup.ps1 $SetupArgs in $Dir exited with $code"; exit 1 }
          }
          $flat = Join-Path $env:TEMP 'ci_ps_flat'
          $multi = Join-Path $env:TEMP 'ci_ps_multi'
          Invoke-Setup $PWD @('-WorkType', 'Seminar paper', '-Structure', 'Flat', '-Scaffolding', 'full', '-Target', $flat, '-NonInteractive')
          if (-not (Test-Path (Join-Path $flat 'workspace/sources/_guidelines'))) { Write-Host "flat: workspace/sources/_guidelines missing"; exit 1 }
          # [ ] in the target name must not be read as a wildcard pattern.
          $brk = Join-Path $env:TEMP 'ci_ps_[final]'
          Invoke-Setup $PWD @('-WorkType', 'Bachelor thesis', '-Structure', 'Long-form', '-Scaffolding', 'full', '-Target', $brk, '-NonInteractive')
          if (-not (Test-Path -LiteralPath (Join-Path $brk '00_Status.md'))) { Write-Host "brackets: 00_Status.md missing"; exit 1 }
          Invoke-Setup $PWD @('-WorkType', 'Master thesis', '-Structure', 'Multi-project', '-Scaffolding', 'minimal', '-Target', $multi, '-NonInteractive')
          foreach ($sub in '01_Proposal', '02_Main_Work', '03_Defense') {
            if (-not (Test-Path (Join-Path $multi "$sub/shared/guidelines"))) { Write-Host "multi: $sub/shared missing"; exit 1 }
          }
          # The template ships a .gitattributes; setup appends the six LFS rules once.
          $lfs = @(Select-String -Path (Join-Path $flat '.gitattributes') -Pattern 'filter=lfs').Count
          if ($lfs -ne 6) { Write-Host "flat: expected 6 LFS rules in .gitattributes, found $lfs"; exit 1 }
          # A re-run in place keeps edited state files and does not duplicate the LFS rules.
          $status = Join-Path $multi '02_Main_Work/00_Status.md'
          Add-Content -Path $status -Value 'ci-marker'
          Invoke-Setup $multi @('-WorkType', 'Master thesis', '-Structure', 'Multi-project', '-Scaffolding', 'minimal', '-NonInteractive')
          if (-not (Select-String -Path $status -Pattern 'ci-marker' -Quiet)) { Write-Host "re-run overwrote 02_Main_Work/00_Status.md"; exit 1 }
          $lfs = @(Select-String -Path (Join-Path $multi '.gitattributes') -Pattern 'filter=lfs').Count
          if ($lfs -ne 6) { Write-Host "re-run: expected 6 LFS rules in .gitattributes, found $lfs"; exit 1 }

      - name: Closed stdin without -NonInteractive exits 2 instead of prompting forever
        shell: powershell
        run: |
          $empty = Join-Path $env:TEMP 'ci_empty_stdin.txt'
          $out = Join-Path $env:TEMP 'ci_stdin_out.txt'
          [System.IO.File]::WriteAllText($empty, '')
          $p = Start-Process -FilePath powershell -NoNewWindow -PassThru `
            -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', './setup.ps1', '-WorkType', '"Bachelor thesis"', '-Structure', 'Flat' `
            -RedirectStandardInput $empty -RedirectStandardOutput $out
          $null = $p.Handle   # keeps ExitCode available after the process ends
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host "setup.ps1 kept prompting on closed stdin"; exit 1 }
          if ($p.ExitCode -ne 2) { Get-Content $out -TotalCount 40; Write-Host "expected exit 2, got $($p.ExitCode)"; exit 1 }
          $LASTEXITCODE = 0

      - name: Python syntax (Windows)
        shell: powershell
        run: python -m py_compile scripts/abbreviations_extract.py scripts/bibliography_check.py scripts/cross_session_audit.py

      # Informational only: not part of the verified baseline. Remove
      # continue-on-error once a clean run is confirmed.
      - name: PSScriptAnalyzer (errors only, informational)
        shell: powershell
        continue-on-error: true
        run: |
          if (Get-Module -ListAvailable PSScriptAnalyzer) {
            # Invoke-ScriptAnalyzer only emits records; turn findings into a failing exit code.
            $findings = Invoke-ScriptAnalyzer -Path .\setup.ps1 -Severity Error
            $findings | Format-Table -AutoSize | Out-String | Write-Host
            if ($findings) { exit 1 }
          } else {
            Write-Host "PSScriptAnalyzer not available - skipped"
          }
