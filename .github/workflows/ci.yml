          python -c "import sys; from docx import Document; from docx.oxml import parse_xml; W = 'xmlns:w=\"http://schemas.openxmlformats.org/wordprocessingml/2006/main\"'; d = Document(); d.add_heading('1 Einleitung', 1); p = d.add_paragraph('Die '); p._p.append(parse_xml('<w:r %s><w:ruby><w:rubyPr/><w:rt><w:r><w:t>ki</w:t></w:r></w:rt><w:rubyBase><w:r><w:t>Bäume</w:t></w:r></w:rubyBase></w:ruby></w:r>' % W)); p.add_run(' kühlen ihre Umgebung durch Verdunstung und '); p._p.get_or_add_pPr().append(parse_xml('<w:rPr %s><w:del w:id=\"1\" w:author=\"a\"/></w:rPr>' % W)); q = d.add_paragraph('senken die Temperatur '); q._p.get_or_add_pPr().append(parse_xml('<w:rPr %s><w:moveFrom w:id=\"2\" w:author=\"a\"/></w:rPr>' % W)); r = d.add_paragraph('in dicht'); r._p.append(parse_xml('<w:r %s><w:sym w:font=\"Wingdings\" w:char=\"F0E0\"/></w:r>' % W)); r.add_run('bebauten Vierteln deutlich.'); d.save(sys.argv[1])" "$V/joined.docx"
          expect 1 python scripts/verbatim_check.py "$V/joined.docx" "$V/tracked_src.txt"
          grep -qF '16 words, paragraph 2' "$V/out.txt"
          # after a wholly deleted paragraph, a paragraph keeps its own number
          python -c "import sys; from docx import Document; from docx.oxml import parse_xml; W = 'xmlns:w=\"http://schemas.openxmlformats.org/wordprocessingml/2006/main\"'; d = Document(); d.add_heading('1 Einleitung', 1); p = d.add_paragraph(); p._p.append(parse_xml('<w:del %s w:id=\"1\" w:author=\"a\"><w:r><w:delText>Ein gestrichener Absatz.</w:delText></w:r></w:del>' % W)); p._p.get_or_add_pPr().append(parse_xml('<w:rPr %s><w:del w:id=\"2\" w:author=\"a\"/></w:rPr>' % W)); d.add_paragraph('Die Bäume kühlen ihre Umgebung durch Verdunstung und senken die Temperatur in dicht bebauten Vierteln deutlich.'); d.save(sys.argv[1])" "$V/deleted.docx"
          expect 1 python scripts/verbatim_check.py "$V/deleted.docx" "$V/tracked_src.txt"
          grep -qF '16 words, paragraph 3' "$V/out.txt"
          # a last paragraph whose mark is deleted has nothing to join and keeps its quote style
          python -c "import sys; from docx import Document; from docx.oxml import parse_xml; W = 'xmlns:w=\"http://schemas.openxmlformats.org/wordprocessingml/2006/main\"'; d = Document(); d.add_heading('1 Einleitung', 1); d.add_paragraph('Ein eigener Satz zum Thema.'); q = d.add_paragraph('Die Bäume kühlen ihre Umgebung durch Verdunstung und senken die Temperatur in dicht bebauten Vierteln deutlich.', style='Quote'); q._p.get_or_add_pPr().append(parse_xml('<w:rPr %s><w:del w:id=\"1\" w:author=\"a\"/></w:rPr>' % W)); d.save(sys.argv[1])" "$V/lastquote.docx"
          expect 0 python scripts/verbatim_check.py "$V/lastquote.docx" "$V/tracked_src.txt"
          if grep -q '16 words' "$V/out.txt"; then cat "$V/out.txt"; echo "a block quote was compared"; exit 1; fi
          expect 2 python scripts/verbatim_check.py --words "$V/missing.md"
          expect 2 python scripts/verbatim_check.py --words
          expect 2 python scripts/verbatim_check.py --words "$V/words.md" "$V/src"
          # a raw block for the export, such as the bookmark that starts the back matter
          # above the reference list (docs/reference_management.md), is markup: it is not
          # counted and joins no run, also with ~~~ and a longer fence; a plain code block
          # still counts
          BACK='<w:p><w:bookmarkStart w:id="990002" w:name="_cephalo_back_matter_start"/><w:bookmarkEnd w:id="990002"/><w:r><w:br w:type="page"/></w:r></w:p>'
          awk -v b="$BACK" '/^# Literaturverzeichnis$/ { print "```{=openxml}"; print b; print "```"; print ""; print "~~~~ {=openxml}"; print b; print "~~~~~"; print "" } { print }' "$V/words.md" > "$V/words_raw.md"
          grep -qF '_cephalo_back_matter_start' "$V/words_raw.md"
          expect 0 python scripts/verbatim_check.py --words "$V/words_raw.md"
          grep -qxF "$W" "$V/out.txt"
          printf '%s\n' "$BACK" > "$V/raw_src.txt"
          expect 0 python scripts/verbatim_check.py "$V/words_raw.md" "$V/raw_src.txt"
          grep -qxF "  $W" "$V/out.txt"
          if grep -q 'words, line' "$V/out.txt"; then cat "$V/out.txt"; echo "a raw block was matched as a run"; exit 1; fi
          awk '/^# Literaturverzeichnis$/ { print "```text"; print "drei Wörter hier"; print "```"; print "" } { print }' "$V/words.md" > "$V/words_code.md"
          expect 0 python scripts/verbatim_check.py --words "$V/words_code.md"
          grep -qF 'Words: 29 ' "$V/out.txt"
          # the text of a Word raw block (its w:t elements) goes into the export: it is compared
          # with the sources, but not counted
          printf '# 1 Einleitung\n\nEin kurzer eigener Satz steht hier.\n\n```{=openxml}\n<w:p><w:r><w:t xml:space="preserve">Die Bäume kühlen ihre Umgebung durch Verdunstung und senken die Temperatur in dicht bebauten Vierteln deutlich.</w:t></w:r></w:p>\n```\n' > "$V/raw_text.md"
          printf 'Die Bäume kühlen ihre Umgebung durch Verdunstung und senken die Temperatur in dicht bebauten Vierteln deutlich.\n' > "$V/raw_text_src.txt"
          expect 0 python scripts/verbatim_check.py --words "$V/raw_text.md"
          grep -qF 'Words: 8 ' "$V/out.txt"
          expect 1 python scripts/verbatim_check.py "$V/raw_text.md" "$V/raw_text_src.txt"
          grep -qF '16 words, line 6' "$V/out.txt"
          # a word split over two runs is one word, as Word shows it; a raw block inside an HTML comment
          # does not reach the export
          printf '# 1 Einleitung\n\nEin kurzer eigener Satz steht hier.\n\n```{=openxml}\n<w:p><w:r><w:t xml:space="preserve">Die Bäume kühlen ihre Umgebung durch Verdun</w:t></w:r><w:r><w:t>stung und senken die Temperatur in dicht bebauten Vierteln deutlich.</w:t></w:r></w:p>\n```\n' > "$V/raw_split.md"
          expect 1 python scripts/verbatim_check.py "$V/raw_split.md" "$V/raw_text_src.txt"
          grep -qF '16 words, line 6' "$V/out.txt"
          printf '# 1 Einleitung\n\nEin kurzer eigener Satz steht hier.\n\n<!--\n```{=openxml}\n<w:p><w:r><w:t>Die Bäume kühlen ihre Umgebung durch Verdunstung und senken die Temperatur in dicht bebauten Vierteln deutlich.</w:t></w:r></w:p>\n```\n-->\n' > "$V/raw_comment.md"
          expect 0 python scripts/verbatim_check.py "$V/raw_comment.md" "$V/raw_text_src.txt"
          # a line break or tab between two runs is a space; an empty <w:p/> ends no other paragraph;
          # a raw paragraph in a quote style is a quote
          printf '# 1 Einleitung\n\nEin kurzer eigener Satz steht hier.\n\n```{=openxml}\n<w:p><w:r><w:t xml:space="preserve">Die Bäume kühlen ihre Umgebung durch Verdunstung und</w:t></w:r><w:r><w:br/></w:r><w:r><w:t>senken die Temperatur</w:t></w:r><w:r><w:tab/><w:t>in dicht bebauten Vierteln deutlich.</w:t></w:r></w:p>\n```\n' > "$V/raw_br.md"
          expect 1 python scripts/verbatim_check.py "$V/raw_br.md" "$V/raw_text_src.txt"
          grep -qF '16 words, line 6' "$V/out.txt"
          printf '# 1 Einleitung\n\nEin kurzer eigener Satz steht hier.\n\n```{=openxml}\n<w:p/>\n<w:p w:rsidR="00A1"/>\n<w:p><w:r><w:t>Die Bäume kühlen ihre Umgebung durch Verdunstung und senken die Temperatur in dicht bebauten Vierteln deutlich.</w:t></w:r></w:p>\n```\n' > "$V/raw_empty.md"
          expect 1 python scripts/verbatim_check.py "$V/raw_empty.md" "$V/raw_text_src.txt"
          grep -qF '16 words, line 8' "$V/out.txt"
          printf '# 1 Einleitung\n\nEin kurzer eigener Satz steht hier.\n\n```{=openxml}\n<w:p><w:pPr><w:pStyle w:val="BlockText"/></w:pPr><w:r><w:t>Die Bäume kühlen ihre Umgebung durch Verdunstung und senken die Temperatur in dicht bebauten Vierteln deutlich.</w:t></w:r></w:p>\n```\n' > "$V/raw_quote.md"
          expect 0 python scripts/verbatim_check.py "$V/raw_quote.md" "$V/raw_text_src.txt"
          # a style the reference document lacks is plain text in the export; a closed <w:br></w:br>
