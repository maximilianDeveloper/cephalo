# Presentation workflow — 3 agents, flat structure

name: presentation_3agent
version: 3.0
description: |
  Setup for project presentations (PPTX, typically 15-25 slides) with optional 
  written companion document. Like seminar_2agent, with the format-verifier
  also for visual consistency and the three-way check (PPTX <-> PDF <-> speaker notes).
  No orchestrator: Claude in the main chat coordinates the agents (main_session below) and the user decides; one chat per slide cluster or phase.
  Flat directory structure, no phase folders.
  
  Not to be confused with defense_workflow.yaml — that one is for the oral 
  defense AFTER a thesis submission.

use_cases:
  - Project presentations
  - Other assignments combining slides + written companion

# Agents

agents:
  writer:
    file: .claude/agents/writer-agent.md
    model: opus
    role: Slide content, speaker notes, written companion
  
  source-verifier:
    file: .claude/agents/source-verifier.md
    model: opus
    role: Verify numbers, quotes, citations
  
  format-verifier:
    file: .claude/agents/format-verifier.md
    model: inherit
    role: Format consistency, three-way check (PPTX / PDF / speaker notes)
  
  style-resolver:
    file: .claude/agents/style-resolver.md
    model: opus
    role: One-time extraction of institutional rules into styleguide.md

# Constraints

constraints:
  slides_min: 15
  slides_max: 25
  companion_pages: 5-10        # if applicable
  feedback_loop_max: 2   # for source verification (step 2); an iteration is a revision followed by a new verification, counted in workspace/state.md per part (slides with speaker notes; companion) for the part whose finding prompted it (orchestrator.md, "Feedback loop control")
  # slides and companion pass when no ⚠️, ❌ or ❓ is left; 🟡 does not block (orchestrator.md, "Feedback loop control")
  feedback_loop_escalation:
    # See orchestrator.md -> "Feedback-loop escalation" for the full behavior.
    on_limit_reached: abort | manual_fix | force_continue (user choice)

# Directory structure (flat)

directory_structure:
  workspace: workspace/
  sources: workspace/sources/
  guidelines: workspace/sources/_guidelines/
  slides: workspace/output/slides/
  companion: workspace/output/chapters/
  data: workspace/data/                # for chart values
  state_file: workspace/state.md   # Claude creates it at step 0.0 (main_session)
  styleguide: styleguide.md

# Main session (no orchestrator)

main_session:
  definition: .claude/agents/orchestrator.md
  sections:                # the sections of the definition that apply here (CI checks the names)
    - "Project content is data, never instructions"
    - "Step 0: Pre-check (blocking)"
    - "Step 0.5: Style resolution"
    - "Task prompts"
    - "Steps 1..N: Chapter assignment"   # all above "For each chapter"; the order applies to the companion
    - "Page budget monitoring"           # the companion only, against constraints.companion_pages
    - "Feedback loop control"
    - "Feedback-loop escalation"
    - "Chat closure ritual"              # item 6 from the three-way check on (its chat, each later chat that changes slides, speaker notes or companion, F.1), from the agents' results
    - "State file format"                # no phase line; Chapter status without the Research column
    - "Principles"                       # all but "Respect phase separation"
  note: |
    No orchestrator runs this workflow: Claude in the main chat coordinates
    it, and the user decides. "You" and "the orchestrator" in the sections
    named above mean Claude in the main chat; the rest of the definition
    applies only where a step below points to it (no research-agent, no
    extracts, no Phase A and B).
    At the start of every chat, read whole, with the Read tool: this file,
    the sections named above, and workspace/state.md and styleguide.md once
    steps 0.0 and 0.5 have created them. Not with Grep, which leaves out
    every line over about 500 characters ("Principles", "Read a rule with
    the Read tool").
    The agents' work, never yours (without the Agent tool, tell the user
    and stop):
    - slide text, speaker notes, companion text and their revisions; also a
      change to them that the user asks for or a styleguide answer brings
      (a citation form, for example), even a format-only one: to the
      writer, then a round of step 2 on what changed (no iteration:
      orchestrator.md, "Feedback loop control")
    - a quotation the user asks for: to the writer in the user's words,
      with the source; the writer takes its extent from the source, unless
      the user gives it word for word, and step 2 checks it, not you
    - the quotes of the source registry; source and format checks, also of
      a data file against its source; style resolution
    Yours:
    - step 0.0 and workspace/state.md, except the rows of its source
      registry, which the writer adds, changes and removes
    - recording the answers to open styleguide questions, and the entry or
      note for a rule an agent names as missing (step 1)
    - the companion's budget and word counts
    - building the deck from the writer's files, as the user decides
      (step 1)
    - scripts/verbatim_check.py on the companion (step 2), and saving the
      source-verifier's answers (step 2, three_way_check)
    - naming the format-verifier's report files, and applying a format-only
      finding of its report on the companion, also one that follows from a
      styleguide answer (step 3, F.1)
    - the PDF exports and calling the agents of the three-way check
    - F.1 with the user

# Workflow

phases:
  # ===========================================================
  # Phase 0 - Preparation
  # ===========================================================
  phase_0_setup:
    steps:
      - step: 0.0
        name: Materials pre-check
        checklist: checklists/precheck.md
        blocking: true
        manual: true
        note: |
          Verify that the citation guide and formatting guidelines are present
          and all sources are accessible: that each opens and can be read,
          not what it says; no value of a source is compared with a data
          file here, or named to the user (step 0.6). The other documents of the
          checklist's section 1 are recommended: for each one missing, ask the
          user whether the institution provides it, note the gap and continue.
          Claude in the main chat runs it and then creates workspace/state.md,
          with the pre-check result, before step 0.5 starts
          (main_session, "State file format").
      
      - step: 0.5
        name: Style resolution
        agent: style-resolver
        output: styleguide.md
        blocking: true
        note: |
          This workflow has no Phase B. Clarify open ❓ [content] entries
          before slides are drafted (step 1), open ❓ [format] entries
          that set a slide's layout (a size, a position, a label form)
          before the deck is first built (step 1), and the others before
          the first format-verifier pass (step 3).
      
      - step: 0.6
        name: Define data basis
        manual: true
        task: |
          If the presentation contains charts or numbers: place data sources
          in workspace/data/, as CSV or text files, which the
          source-verifier can read. One file per source or chart, so consistency
          between slides and companion can be checked. Claude records each
          file and the source it comes from in the decision log of
          workspace/state.md; the source-verifier compares it with the
          source, in step 2 (main_session). A
          correction of the file that the user approves after its report
          Claude makes with the Edit tool; slide, notes or companion text that changes with it goes
          to the writer (main_session), and the deck is built again.
  
  # ===========================================================
  # Slides + Companion
  # ===========================================================
  phase_slides:
    agents: [writer, source-verifier, format-verifier]
    
    steps:
      - step: 1
        agent: writer
        task: |
          Define slide structure, content per slide, speaker notes.
          In parallel: written companion document if required.
        note: |
          Before the companion's first draft:
          - Settle with the guidelines or the user whether F.1 exports it as
            a document; record it in the decision log and name it in the
            writer's task prompt.
          - If F.1 exports it, ask with it which parts of a written document
            it has (a title page, a table of contents, page numbers and how
            they run), also where the guidelines name them, and record the
            answer in the decision log. Where the log holds the user's
            answer, the question is not asked again (step 3, F.1).
          - The task prompt names the decision because an exported companion
            takes Pandoc's escaped space, `\ `, before a page number
            (writer-agent.md, "Formatting rules"); its head, where it has
            one instead of a title page, stands inside the Header Block div
            and, without citekeys, its reference list inside the
            Bibliography div, so that step 2 checks its entries
            (docs/reference_management.md, "The head of a document without
            a title page", "The reference list").
          The deck:
          - The writer writes slide text and speaker notes as text files in
            workspace/output/slides/; it cannot build a PPTX.
          - workspace/output/slides/<deck>.pptx is built from them before
            step 3: by the user in PowerPoint, or by Claude with a
            python-pptx script it saves in workspace/data/scripts/ and runs
            (pptx_notes below; without python-pptx, ask the user). The user
            decides which. After a revision of slide text or speaker notes,
            it is built again the same way before the next check.
          - The deck keeps the writer's wording. Its layout comes from the
            institution's slide template, if the guidelines give one, and
            from the rules styleguide.md gives for slides, not from its
            rules for the written companion (body text, headings, page size
            and margins, pagination).
          - A non-breaking space that styleguide.md asks for before a page
            number (in_text.nbsp_before_page) is set where the deck is
            built, in slide text and speaker notes: the text files have no
            notation for it (writer-agent.md, "Formatting rules"). A deck
            script writes U+00A0 in place of that space, as a row of the
            table below with the key as its source; in a deck the user
            builds, the user sets it, which you name as a manual step. It
            is no question to the user.
          A layout value that neither the template nor styleguide.md gives
          is asked of the user, not chosen:
          - Before the build that first sets one (a position, a size, a
            colour, a label form, of text or of a chart), list each for the
            user with a proposal and build after the answer.
          - Each answer is an entry of the decision log in the user's words,
            one per value; it is no styleguide entry.
          - Below the decision log, a table of its own lists every value the
            deck script sets (also helper boxes, label offsets and leader
            lines), one row each, with its source: the template, a key of
            styleguide.md or an entry of the decision log. It stands before
            the first build and is kept up to date; a value without a
            source is asked first.
          - A value changed after looking at a rendering is a new value,
            asked before the next build.
          After each answer of the writer, also to a revision, and before a
          question to the user or the next agent call:
          - The line that workspace/state.md gets after every agent call
            (orchestrator.md, "Steps 1..N: Chapter assignment") names each
            rule the answer calls not covered and where it went (`gaps:
            captions.source_position → Open questions; thousands separator
            → note to the user`), or says `gaps: none`.
          - Where a gap goes: style-resolver.md, "Recording answers to open
            questions", items 5 and 6. An entry under "Open questions" of
            styleguide.md gets its row in the version history (item 5); a
            note to the user stands in your next message, not only in the
            closing one. A line under the open issues of
            workspace/state.md replaces neither.
      
      - step: 2
        agent: source-verifier
        task: |
          Verify all numbers, quotes, citations on slides AND in companion.
          Plagiarism check on the companion, with the report of
          scripts/verbatim_check.py (note below).
        output: |
          workspace/output/verification/<companion>_round_<n>.md, with
          <companion>_round_<n>_verbatim.txt beside it (<companion>: the
          companion file's name without .md; <n>: 1, then +1 after each
          revision). Without a companion: slides_round_<n>.md alone.
        note: |
          Each round:
          1. Count the companion's verbatim runs in the Bash tool, and save
             the output beside the reports:
               mkdir -p workspace/output/verification && python3 scripts/verbatim_check.py workspace/output/chapters/<companion>.md workspace/sources/ workspace/state.md > workspace/output/verification/<companion>_round_<n>_verbatim.txt 2>&1
             This line replaces the one of orchestrator.md, "Steps 1..N:
             Chapter assignment" (no --chapters). On Windows, py in place of
             python3, not "python3 ... || py ...", and not ">" in Windows
             PowerShell (docs/scripts.md). Exit code 0 or 1: the report is
             finished; 2: tell the user what the file says. Without Python,
             the source-verifier counts the runs by eye. The user may run
             the script instead and hand you the file.
          2. Call the source-verifier with the slides, the companion file,
             that report file and each data file of workspace/data/ that
             slide or companion numbers come from, with the source the
             decision log records for it (source-verifier.md, "Output
             format"). From round 2 on, call a new one with the Agent tool,
             not a message to the one of the round before, and give it also
             the previous round's report and the sentences the revision
             changed (orchestrator.md, "Steps 1..N: Chapter assignment",
             the return calls).
             Before a revision, copy what it may change, whether or not git
             has it:
               mkdir -p _scratch/orchestrator && cp -r workspace/output/slides workspace/output/chapters _scratch/orchestrator/
             The writer gets the report file, or the findings as the report
             gives them. After the revision, diff -r against the copies
             shows what changed; delete the copies before the chat ends.
             The report's notes on the rows of the source registry go to
             the writer as an edit of those rows, also when slides and
             companion passed and when a note calls itself optional
             (orchestrator.md, "Feedback loop control").
          3. Save the answer yourself, as <companion>_round_<n>.md (the
             source-verifier cannot write files, so do not ask it to),
             unchanged, and read the file back whole (orchestrator.md, "Steps
             1..N: Chapter assignment", "Save every source-verifier report
             as a file"). Your counts and the loop count go to
             workspace/state.md, not into the report.
        feedback_loop_max: 2   # iterations per part, not verification rounds: up to 3 rounds per part
      
      - step: 3
        agent: format-verifier
        task: |
          - Slide layout consistent (fonts, colors, logo position)
          - Companion conforms to styleguide.md
          - Its part of the three-way check (three_way_check below)
        output: |
          workspace/output/verification/<companion>_format_round_<n>.md, one
          report for the slides and the companion (<companion> as in step 2;
          without a companion: slides_format_round_<n>.md; <n>: 1, then +1
          after each fix).
        note: |
          Before the first pass, ask the user in one message every open
          ❓ [format] entry of styleguide.md that step 1 did not settle, one
          line per key, with its proposal where the guidelines suggest one,
          and for a companion that F.1 exports the question on its parts
          (step 1; its answer goes into the decision log). For that
          companion, leave out the entries of a part it does not have; the
          user may close them with the n/a value. Record the styleguide
          answers (style-resolver.md, "Recording answers to open
          questions"; n/a: item 4) and start the pass after them.
          Each round:
          - The task prompt names the PPTX, its PDF export
            (three_way_check), the companion and the report file, from
            round 2 on also the previous round's report and what changed
            since. The format-verifier writes the report itself
            (format-verifier.md, "Workflows without Phase B").
          - After the round, before any fix or question to the user: count
            the report's "Status:" lines per symbol with Grep, write the
            counts to workspace/state.md, and read the report whole with
            the Read tool (orchestrator.md, "Steps 1..N: Chapter
            assignment").
          - Before the next round, show the user every Note of the report,
            numbered and quoted in the report's words and language. Compare
            the Notes with the previous report's first: a changed one
            counts as new, and a changed or new one is quoted whole. Ask
            whether the guidelines or the supervisor rule on any Note that
            no earlier round asked about, with any question on a ❓, and end
            your turn with it; the decision log keeps the answer. Without
            such a Note or ❓, go on without a stop.
          Fixes, which the next round checks:
          - a format-only finding in the companion: yours, with the Edit
            tool, without rewording
          - a finding in slide text or speaker notes, or one that needs new
            wording: to the writer (copies first: step 2, item 2), then a
            round of step 2 on what changed; the revision counts toward
            the loop count, as in the three-way check
          - a finding in the PPTX's layout: where the deck is built (step 1)
          - a finding on the non-breaking space before a page number: `\ `
            in the file of a companion that F.1 exports; in the PPTX's
            slides and notes, where the deck is built (step 1). The text
            files of slides and notes and a companion that F.1 does not
            export have no notation for it (writer-agent.md, "Formatting
            rules"): it is no finding there and no question to the user
  
  # ===========================================================
  # Three-way consistency check
  # ===========================================================
  three_way_check:
    agents: [format-verifier, source-verifier]
    output: |
      The format-verifier's part is in its step-3 report. The
      source-verifier's answer is saved unchanged and read back as in step
      2, item 3: workspace/output/verification/<companion>_threeway_round_<n>.md
      (<companion> as in step 2; without a companion:
      slides_threeway_round_<n>.md; <n>: 1, then +1 after each new
      comparison). The comparison is not a round of step 2 and does not
      count in its loop; a revision it prompts does (below).
    
    description: |
      Every number, quote, and statement must be consistent across three artifacts:
      
        PPTX (slides) <-> PDF (export) <-> speaker notes
    
    rules:
      - Number formatting: decimal separator consistent (comma or period per styleguide)
      - Pie chart format: decimal places per styleguide (if it is silent, one decimal
          such as "0.0%" narrows rounding gaps) AND check that the labelled values sum
          to 100% (development lesson — sums can total 99.9% or 101%); otherwise add a
          note that gives their sum and says that rounding can cause the difference
          ("the shares shown sum to 100.1 %; a difference from 100 % can come from
          rounding"). The note is the deck's own remark on its values and attributes
          no cause to the source; the source-verifier checks its figure
      - Units on all values (EUR, %, n=...)
      - If companion exists: numbers consistent there too
      - A non-breaking space that the deck's build sets (step 1) is no difference between the versions
    
    steps:
      - Export the PPTX to PDF once the deck script's run has ended, not in the same message as the build. Claude does it with PowerPoint, as docs/scripts.md, "A PDF from PowerPoint (Windows)", shows, unchanged but for the file name, or with LibreOffice (soffice --headless --convert-to pdf); or the user does
      - The format-verifier and the source-verifier compare the numbers across PPTX <-> PDF <-> companion and check that the speaker notes contain the key numbers (the format-verifier reads the PPTX and its notes, which the source-verifier cannot)
      - A discrepancy in slide text, speaker notes or companion goes to the writer (copies first, step 2, item 2), then a round of step 2 on what changed. The revision counts toward the loop count; where the count is already at its limit, the user is asked the question of orchestrator.md, "Feedback-loop escalation", before the revision. Then the deck is built again (step 1) and exported again, and the agents compare again, until all three versions are identical

# ===========================================================
# Closing
# ===========================================================
  closing:
    - step: F.1
      manual: true
      task: |
        - No open ❓ entry is left under "Open questions" in styleguide.md,
          and no styleguide question under the open issues of
          workspace/state.md
        - Final PPTX export
        - Final PDF of the slides (for submission), as three_way_check
          exports it
        - The companion as a document, where the guidelines or the user
          want one (a handout as a PDF, for example):
          - Its parts: the decision-log entry of step 1 or 3; without one,
            ask before the first export and record the answer (step 1).
          - Format rounds as the seminar workflow describes them
            (workflows/seminar_2agent.yaml, F.1, items 4, 6 and 7, for the
            parts the companion has), with
            workspace/output/<companion>.docx in place of document.docx,
            the companion's file as the only chapter file and
            workspace/output/verification/<companion>_docx_format_round_<n>.md
            as the report.
          - Build workspace/output/reference.docx with
            scripts/build_reference_docx.py and export with Pandoc. After
            every export, run scripts/docx_pagination.py with the values of
            pagination.front_matter, pagination.main_text and
            pagination.back_matter (without a title page and table of
            contents: --front-matter arabic --main-text continue; on its
            exit 2: orchestrator.md, "Phase A → B transition", item 5,
            step (2)) and, if document.hyphenation is automatic,
            scripts/docx_postprocess.sh.
          - The format-verifier checks that DOCX as a written document
            (format-verifier.md, "Workflows without Phase B"). Its task
            prompt names the decision-log entry on the parts, so that the
            rules of a part the companion does not have go under Not
            applicable.
          - Its report is handled as step 3 says, except that a layout
            finding is fixed by building the reference document again; a
            Bibliography div missing around the reference list is a
            format-only fix. The next round checks a new export.
          - The PDF comes last, from the last checked DOCX, after the field
            update of the seminar's item 7 where it has a table of
            contents: with Word or LibreOffice, by Claude or the user, as
            the user decides. Claude with Word: as docs/scripts.md, "A PDF
            from Word (Windows)", shows, unchanged but for the file names,
            and after a `not exported` or a timeout as it says.
          - A placeholder the user chose to keep (a name, a date) holds no
            export back: export with it, and name it as a step left to the
            user.
        - Speaker notes export (if required)
        - Rehearsal with timing (target per assignment / styleguide.md, e.g.
          15-20 min): ask the user whether they rehearsed the talk and how
          long it took, and record the answer against the target time in
          workspace/state.md
        - Before closing, run
          `python3 scripts/state_check.py workspace/state.md workspace/output/chapters/`
          in the Bash tool (on Windows with py), without a pipe, and go
          through its whole output (orchestrator.md, "Chat closure ritual",
          item 1, also for exit code 2 and for a project without Python).
          What it lists and the "Open questions" of styleguide.md agree: an
          open issue this chat resolved is ticked (`- [x]`); one the user
          accepted as it stands stays `- [ ]` (orchestrator.md,
          "Feedback-loop escalation", item 1); nothing is called resolved
          in one that is still open in another. After your changes, run it
          again, until it ends with exit code 0: that run is the one item 1
          of the Chat closure ritual asks for.

# python-pptx specifics (from project experience)

pptx_notes: |
  Lessons from past projects:
  - Chart XML lives under ppt/charts/*.xml — direct lxml manipulation often necessary
  - Format codes matter: "0%" vs "0.0%" for pie charts
  - Remove slides only in reverse order
  - Delete orphaned notesSlide files before repacking
  - Maintain chart values in a separate data/ file
    -> Avoids inconsistencies between slides, speaker notes, and companion
