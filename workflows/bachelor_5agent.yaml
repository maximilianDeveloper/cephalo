# Bachelor thesis workflow — 5 agents, flat structure

name: bachelor_5agent
version: 3.0
description: |
  Full multi-agent setup for bachelor theses (typically 30-40 pages, 15-25 sources).
  Flat directory structure (single workspace/ folder).
  
  For long-running bachelor projects (multi-month), prefer 
  bachelor_5agent_longform.yaml — it adds phase folders, handover ritual, 
  and Git versioning.

# Agents

agents:
  orchestrator:
    file: .claude/agents/orchestrator.md
    model: inherit
    role: Coordination, state management, phase transitions
  
  research:
    file: .claude/agents/research-agent.md
    model: inherit
    role: Source extraction
  
  writer:
    file: .claude/agents/writer-agent.md
    model: opus
    role: Drafting prose (Phase A only)
  
  source-verifier:
    file: .claude/agents/source-verifier.md
    model: opus
    role: Sentence-by-sentence verification (Phase A), consistency checks
  
  format-verifier:
    file: .claude/agents/format-verifier.md
    model: inherit
    role: Format check against styleguide.md (both phases)
  
  style-resolver:
    file: .claude/agents/style-resolver.md
    model: opus
    role: One-time extraction of institutional rules into styleguide.md

# Constraints

constraints:
  page_count: 30-40        # default; styleguide may override
  sources_min: 15
  sources_max: 25
  outline_depth_max: 3     # default; styleguide headings.max_depth overrides
  chapter_weighting:
    introduction: 20%
    body: 70%
    conclusion: 10%
  feedback_loop_max: 3
  feedback_loop_escalation:
    # See orchestrator.md -> "Feedback-loop escalation" for the full behavior.
    on_limit_reached: abort | manual_fix | force_continue (user choice)

# Workflow

phases:
  # ===========================================================
  # Phase 0 - Preparation
  # ===========================================================
  phase_0_preparation:
    steps:
      - step: 0.0
        name: Materials pre-check
        agent: orchestrator
        checklist: checklists/precheck.md
        blocking: true
      
      - step: 0.5
        name: Style resolution
        agent: style-resolver
        output: styleguide.md
        blocking: true
        note: |
          Must complete before Step 1. If the resolver leaves open
          ❓ [content] items, clarify them with the user before any chapter
          is drafted; open ❓ [format] items may wait until the A -> B
          transition.
  
  # ===========================================================
  # Phase A - Content
  # ===========================================================
  phase_A_content:
    description: |
      Chapter-by-chapter work with writer-agent (capable) and 
      source-verifier (capable). Goal: content-stable chapters. 
      Expected iterations: ~30-50 across the project.
    
    order: [body, conclusion, introduction]   # introduction last
    
    per_chapter:
      - step: A.1
        agent: research
        input: Chapter-relevant sources
        output: workspace/sources/extracts/ (one file per source, named author_year or citekey — see research-agent.md)
      
      - step: A.2
        agent: source-verifier
        input: Extracts
        action: Verify extracts (technical terms, page numbers, secondary citations)
      
      - step: A.3
        agent: writer
        input: Verified extracts, styleguide.md
        output: workspace/output/chapters/ch_X_*.md
      
      - step: A.4
        agent: source-verifier
        script: scripts/verbatim_check.py
        input: Chapter text + the report of scripts/verbatim_check.py, which the orchestrator runs on the chapter before every verification round
        action: Sentence-by-sentence verification incl. plagiarism check (verification step 8 in source-verifier.md)
        feedback_loop_max: 3
      
      - step: A.5
        agent: format-verifier
        input: Chapter text
        action: Critical format errors only (full check happens in Phase B)
      
      - step: A.6
        agent: orchestrator
        action: Status update
    
    consistency_check:
      after_every_n_chapters: 2
      checklist: checklists/consistency.md
      agent: source-verifier
  
  # ===========================================================
  # Phase transition A -> B
  # ===========================================================
  phase_transition_a_to_b:
    name: A -> B
    agent: orchestrator
    criteria:
      - all_chapters_content_complete: true
      - all_chapters_source_verified: "✅"
      - open_content_warnings: 0
      - last_3_iterations_format_only: true
      - styleguide_open_questions: 0
    verification_method: |
      The orchestrator checks these criteria before transitioning:
        - all_chapters_content_complete: read workspace/state.md; every row of the
          Chapter status table has ✅ in the Written and Source-verified columns
        - all_chapters_source_verified: grep chapter files for any ⚠️ or ❓ markers
        - open_content_warnings: count open ⚠️, ❌ and ❓ items in workspace/state.md
          (Chapter status table, unchecked "- [ ]" lines under Open issues; not the
          Pre-check result or recorded round counts) and in each chapter's
          handover.md (if present); must be 0
        - last_3_iterations_format_only: inspect the last 3 commits (git log); 
          if all touched only styleguide-governed items (citations, typography, 
          spacing), criterion is met
        - styleguide_open_questions: count open ❓ items in styleguide.md; must be 0
      If any criterion fails, the orchestrator reports the failing criterion 
      and does not transition, unless the user waives it as docs/phase_separation.md
      describes ("Waiving a criterion"; recorded in workspace/state.md).
    documentation: docs/phase_separation.md
    
    rollback_b_to_a:
      when: |
        During Phase B a genuine content issue surfaces (e.g., a citation reveals
        a claim not actually supported by the source, or a format pass exposes a 
        missing argumentation step). Format-only fixes do NOT qualify for rollback.
      procedure:
        - Pause Phase B
        - Set workspace/state.md -> overall phase: A (rollback from B)
        - Reactivate writer-agent for the specific fix
        - Run scripts/verbatim_check.py on the chapter, then source-verifier on the affected passage
        - Document the rollback in workspace/state.md with rationale
        - Resume Phase B when the fix is verified
      note: |
        Rollbacks should be rare. If they happen more than twice, the original 
        A -> B transition was premature.
  
  # ===========================================================
  # Phase B - Form
  # ===========================================================
  phase_B_form:
    description: |
      format-verifier (fast) and build scripts only.
      writer-agent (capable) is activated ONLY for genuine content corrections.
      Expected iterations: many small passes.
      format-verifier is model: inherit — run Phase B chats on a fast main
      model (e.g. switch with /model), otherwise the savings do not materialize.
    
    active_agents: [format-verifier, orchestrator]
    writer_agent_deactivated: true
    
    steps:
      - step: B.0
        manual: true
        task: |
          Assemble the chapters from workspace/output/chapters/ in document
          order and export them to workspace/output/document.docx with Pandoc
          (docs/reference_management.md, "Citation processor pipeline"; a
          prerequisite of Phase B, checklists/precheck.md, section 6). B.1-B.5
          read this DOCX; re-export after fixes.

      - step: B.1
        agent: format-verifier
        action: Full styleguide check against styleguide.md
      
      - step: B.2
        script: scripts/bibliography_check.py
        action: Minus-test by author surname (every cited author in the bibliography, every entry's lead author cited; years are not compared)
      
      - step: B.3
        script: scripts/abbreviations_extract.py
        action: Derive list of abbreviations from text corpus
      
      - step: B.4
        agent: format-verifier
        action: Consistency checks (page ranges, et-al., editions, pronouns)
      
      - step: B.5
        script: scripts/docx_postprocess.sh
        action: Enable automatic hyphenation
        condition: styleguide.md document.hyphenation == automatic
  
  # ===========================================================
  # Closing
  # ===========================================================
  closing:
    - step: F.1
      agent: orchestrator
      checklist: checklists/consistency.md
      action: Full-document consistency check
    
    - step: F.2
      agent: format-verifier
      action: Final styleguide report
    
    - step: F.3
      manual: true
      task: |
        - Update table of contents (in Word: Ctrl+A then F9)
        - Confirm the hyphenation setting matches styleguide.md (document.hyphenation)
        - Visual proofreading
        - Mentally rehearse defending each sentence
