# Bachelor thesis workflow — 5 agents, flat structure

name: bachelor_5agent
version: 3.0
description: |
  Full multi-agent setup for bachelor theses (typically 30-40 pages, 15-25 sources).
  Flat directory structure (single workspace/ folder).
  
  For long-running bachelor projects (multi-month), prefer 
  bachelor_5agent_longform.yaml — it adds phase folders, handover ritual, 
  and Git versioning.

# Agents

agents:
  orchestrator:
    file: .claude/agents/orchestrator.md
    model: inherit
    role: Coordination, state management, phase transitions
  
  research:
    file: .claude/agents/research-agent.md
    model: inherit
    role: Source extraction
  
  writer:
    file: .claude/agents/writer-agent.md
    model: opus
    role: Drafting prose (Phase A only)
  
  source-verifier:
    file: .claude/agents/source-verifier.md
    model: opus
    role: Sentence-by-sentence verification (Phase A), consistency checks
  
  format-verifier:
    file: .claude/agents/format-verifier.md
    model: inherit
    role: Format check against styleguide.md (both phases)
  
  style-resolver:
    file: .claude/agents/style-resolver.md
    model: opus
    role: One-time extraction of institutional rules into styleguide.md

# Constraints

constraints:
  page_count: 30-40        # default; styleguide may override
  sources_min: 15
  sources_max: 25
  outline_depth_max: 3     # default; styleguide headings.max_depth overrides
  chapter_weighting:
    introduction: 20%
    body: 70%
    conclusion: 10%
  feedback_loop_max: 3
  feedback_loop_escalation:
    # See orchestrator.md -> "Feedback-loop escalation" for the full behavior.
    on_limit_reached: abort | manual_fix | force_continue (user choice)

# Workflow

phases:
  # ===========================================================
  # Phase 0 - Preparation
  # ===========================================================
  phase_0_preparation:
    steps:
      - step: 0.0
        name: Materials pre-check
        agent: orchestrator
        checklist: checklists/precheck.md
        blocking: true
      
      - step: 0.5
        name: Style resolution
        agent: style-resolver
        output: styleguide.md
        blocking: true
        note: |
          Must complete before Step 1. If the resolver leaves open
          ❓ [content] items, clarify them with the user before any chapter
          is drafted; open ❓ [format] items may wait until the A -> B
          transition.
  
  # ===========================================================
  # Phase A - Content
  # ===========================================================
  phase_A_content:
    description: |
      Chapter-by-chapter work with writer-agent (capable) and 
      source-verifier (capable). Goal: content-stable chapters. 
      Expected iterations: ~30-50 across the project.
    
    order: [body, conclusion, introduction]   # introduction last
    
    per_chapter:
      - step: A.1
        agent: research
        input: Chapter-relevant sources
        output: workspace/sources/extracts/ (one file per source, named author_year or citekey — see research-agent.md)
        note: |
          A later chapter (the conclusion, the introduction) runs A.1 and A.2
          only for what no verified extract holds (orchestrator.md, "For each
          chapter"); with nothing new, both fall away.
      
      - step: A.2
        agent: source-verifier
        input: Extracts
        action: Verify extracts (technical terms, page numbers, secondary citations)
      
      - step: A.3
        agent: writer
        input: Verified extracts, styleguide.md
        output: workspace/output/chapters/ch_X_*.md
      
      - step: A.4
        agent: source-verifier
        script: scripts/verbatim_check.py
        input: Chapter text + the report of scripts/verbatim_check.py, which the orchestrator runs on the chapter before every verification round
        action: Sentence-by-sentence verification incl. plagiarism check (verification step 8 in source-verifier.md)
        feedback_loop_max: 3
      
      - step: A.5
        agent: format-verifier
        input: Chapter text
        action: Critical format errors only (full check happens in Phase B)
      
      - step: A.6
        agent: orchestrator
        action: Status update
    
    consistency_check:
      after_every_n_chapters: 2
      checklist: checklists/consistency.md
      agent: source-verifier
      note: |
        Part of the chapter's verification round, not a call of its own: the
        task prompt of every second chapter's round names the checklist's
        Part A and the chapters written so far (orchestrator.md, "For each
        chapter", step 4). The final check is F.1.
  
  # ===========================================================
  # Phase transition A -> B
  # ===========================================================
  phase_transition_a_to_b:
    name: A -> B
    agent: orchestrator
    criteria:
      - all_chapters_content_complete: true
      - all_chapters_source_verified: "✅"
      - open_content_warnings: 0
      - styleguide_open_questions: 0
    indicators:
      - last_3_commits_format_only   # shown with its state; does not hold the transition up
    verification_method: |
      The orchestrator checks these criteria before transitioning:
        - all_chapters_content_complete: read workspace/state.md; every row of the
          Chapter status table begins its Written and Source-verified cells with ✅
          (the round counts after it are history)
        - all_chapters_source_verified: grep chapter files for any ⚠️ or ❓ markers
        - open_content_warnings: count open ⚠️, ❌ and ❓ items in workspace/state.md
          (Chapter status table, unchecked "- [ ]" lines under Open issues; not the
          Pre-check result or recorded round counts) and in each chapter's
          handover.md (if present); must be 0. A ❓ the research-agent set
          in an extract is no item of its own (docs/phase_separation.md,
          criterion 3)
        - styleguide_open_questions: count open ❓ items in styleguide.md; must be 0
        - last_3_commits_format_only (indicator): inspect the last 3 commits
          (git log) and say what they changed in the chapter files; it does
          not hold the transition up (docs/phase_separation.md, criterion 4)
      If any criterion fails, the orchestrator reports the failing criterion 
      and does not transition, unless the user waives it as docs/phase_separation.md
      describes ("Waiving a criterion": chapters complete, for chapters the work
      will not contain; styleguide questions; recorded in workspace/state.md).
    documentation: docs/phase_separation.md
    
    rollback_b_to_a:
      when: |
        During Phase B a genuine content issue surfaces (e.g., a citation reveals
        a claim not actually supported by the source, or a format pass exposes a 
        missing argumentation step). Format-only fixes do NOT qualify for rollback.
      procedure:
        - Pause Phase B
        - Set workspace/state.md -> overall phase: A (rollback from B)
        - Reactivate writer-agent for the specific fix
        - Run scripts/verbatim_check.py on the chapter, then source-verifier on the affected passage
        - Document the rollback in workspace/state.md with rationale
        - Resume Phase B when the fix is verified
      note: |
        Rollbacks should be rare. If they happen more than twice, the original 
        A -> B transition was premature.
  
  # ===========================================================
  # Phase B - Form
  # ===========================================================
  phase_B_form:
    description: |
      format-verifier (fast) and build scripts only.
      writer-agent (capable) is activated ONLY for genuine content corrections.
      Expected iterations: many small passes.
      format-verifier is model: inherit — run Phase B chats on a fast main
      model (e.g. switch with /model), otherwise the savings do not materialize.
    
    active_agents: [format-verifier, orchestrator]
    writer_agent_deactivated: true
    
    steps:
      - step: B.0
        manual: true
        task: |
          Assemble the chapters from workspace/output/chapters/ in document
          order, with the title page workspace/output/title_page.md first
          (docs/reference_management.md, "The title page") and, without
          citekeys or where pagination.back_matter numbers the back matter
          unlike the main text, workspace/output/bibliography.md after them
          (same document, "The reference list"); export them
          to workspace/output/document.docx with Pandoc
          (docs/reference_management.md, "Citation processor pipeline"; a
          prerequisite of Phase B, checklists/precheck.md, section 6). After
          every export, run scripts/docx_pagination.py on it with the values
          of styleguide.md pagination.front_matter, pagination.main_text and
          pagination.back_matter (docs/scripts.md) and, if
          document.hyphenation is automatic,
          scripts/docx_postprocess.sh: Pandoc sets neither the sections nor
          the flag. B.1-B.4 read this DOCX; re-export after fixes.

      - step: B.1
        agent: format-verifier
        action: Full styleguide check against styleguide.md
        note: |
          A format round as orchestrator.md, "Phase A → B transition", item
          5, describes. In every round the format-verifier runs the scripts
          of B.2 and B.3 itself and reports their results
          (format-verifier.md, section 3).
      
      - step: B.2
        script: scripts/bibliography_check.py
        action: Minus-test by author surname (every cited author in the bibliography, every entry's lead author cited; years are not compared)
        note: |
          Run by the format-verifier within each format round (B.1), which
          reports the result; no run of your own beside it.
      
      - step: B.3
        script: scripts/abbreviations_extract.py
        action: Derive list of abbreviations from text corpus
        note: |
          Run by the format-verifier within each format round (B.1), which
          reports the result; no run of your own beside it.
      
      - step: B.4
        agent: format-verifier
        action: Consistency checks (page ranges, et-al., editions, pronouns)
        note: |
          The next format round, on a new export (B.0) after the fixes of
          the round before. It checks the fixes and, as every round does,
          the consistency across the document. An export that has not
          changed gets no further round, so without a fix after B.1, B.4
          falls away.
  
  # ===========================================================
  # Closing
  # ===========================================================
  closing:
    - step: F.1
      agent: orchestrator
      checklist: checklists/consistency.md
      action: Full-document consistency check
      note: |
        orchestrator.md, "Final check". The source-verifier checks Part A
        over all chapters and B.2-B.3 in one call; its answer is saved
        unchanged as workspace/output/verification/consistency_final.md
        and read back. The orchestrator takes B.1 and B.4 from the last
        format report and the scripts and names B.7 to the user; it judges
        no content itself.
    
    - step: F.2
      agent: format-verifier
      action: Final styleguide report
      note: |
        The report of the last format round is the final one while the
        export has not changed since. A new round follows only a new
        export, after a fix that F.1 prompted.
    
    - step: F.3
      manual: true
      task: |
        - Front matter numbered unlike the main text: only if styleguide.md pagination.front_matter is Roman, counted but not shown or none, or pagination.main_text starts at 1, the DOCX has it as a section of its own, set by scripts/docx_pagination.py after the export (docs/reference_management.md, "The title page"; without Python, the user sets it in Word as described there)
        - Update table of contents (in Word: Ctrl+A then F9, twice: docs/reference_management.md, "The title page")
        - Back matter numbered unlike the main text: only if styleguide.md pagination.back_matter does not number it like the main text, the DOCX has it as a section of its own from the reference list on, set the same way; with Roman numerals that continue the front matter's count, check after updating the table of contents that its first number follows the front matter's last page; if it does not (a list or the table of contents fills more than one page), set it in Word: in the header or footer of the reference list's first page, Format Page Numbers, "Start at" the number after the front matter's last page (docs/reference_management.md, "The title page", step 5), then update the fields again (Ctrl+A, then F9); running scripts/docx_pagination.py again on this DOCX changes nothing, and a new export takes that number with --back-matter-start (docs/scripts.md)
        - Confirm the hyphenation setting matches styleguide.md (document.hyphenation)
        - Visual proofreading
        - Mentally rehearse defending each sentence
