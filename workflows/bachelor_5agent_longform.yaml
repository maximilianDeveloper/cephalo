# Bachelor thesis workflow — long-form variant

name: bachelor_5agent_longform
version: 3.0
description: |
  Long-form variant of the bachelor workflow. Uses phase-based directory 
  structure, chat closure ritual, and central state files (00_Status.md, 
  00_Decisions.md, 00_Feedback_log.md). No workspace/ subdirectory — 
  everything lives at the project root.
  
  For the flat variant, see bachelor_5agent.yaml.

based_on: bachelor_5agent.yaml
extended_by: docs/longform_structure.md

# Agents

agents:
  orchestrator-longform:
    file: .claude/agents/orchestrator-longform.md
    model: inherit
    role: Coordination in long-form mode (incl. handover ritual, status updates)
  
  research:
    file: .claude/agents/research-agent.md
    model: inherit
  
  writer:
    file: .claude/agents/writer-agent.md
    model: opus
  
  source-verifier:
    file: .claude/agents/source-verifier.md
    model: opus
  
  format-verifier:
    file: .claude/agents/format-verifier.md
    model: inherit
  
  style-resolver:
    file: .claude/agents/style-resolver.md
    model: opus
    role: One-time extraction of institutional rules into styleguide.md

# Constraints (same as flat variant)

constraints:
  page_count: 30-40
  sources_min: 15
  sources_max: 25
  outline_depth_max: 3     # default; styleguide headings.max_depth overrides
  feedback_loop_max: 3
  feedback_loop_escalation:
    # See orchestrator-longform.md -> "Feedback-loop escalation" for the full
    # semantics. Summary: on limit reached, user chooses abort / manual_fix / force_continue.
    on_limit_reached: abort | manual_fix | force_continue (user choice)

# Long-form structural rules

longform:
  project_root_files:
    - 00_Status.md            # mandatory
    - 00_Decisions.md         # mandatory
    - 00_Feedback_log.md      # mandatory
    - styleguide.md           # after step 0.5
    - .gitignore              # mandatory
    - .gitattributes          # mandatory (Git LFS)
  
  phase_directories:
    - 01_Proposal
    - 02_Literature           # with literature.bib and extracts/
    - 03_Theory_chapters
    - 06_Discussion_Conclusion
    - 07_Introduction
    - 08_Formal_Review
  
  guidelines_directory: guidelines        # replaces workspace/sources/_guidelines/
                                          # (multi-project main work: ../00_Shared_Materials/guidelines)
  
  per_phase_directory_contents:
    - handover.md             # updated at every chat closure
    - README.md               # entry document (goal of the phase; created by the
                              # orchestrator at the first chat of the phase)

# Workflow

phases:
  # ===========================================================
  # Phase 0 - Preparation (one-time per project)
  # ===========================================================
  phase_0_setup:
    description: |
      Project initialization: Git repo, directory structure, reference 
      manager integration, place institutional guidelines, extract styleguide.
    
    steps:
      - step: 0.0
        name: Verify directory structure
        manual: true
        task: |
          Created by setup.sh / setup.ps1 per docs/longform_structure.md
          ("Directory layout" section). With minimal scaffolding only
          guidelines/ exists (multi-project main work: only the 00_*.md
          files); add the phase directories as needed.

      - step: 0.1
        name: Verify Git
        manual: true
        task: |
          setup.sh / setup.ps1 already ran git init (plus git lfs install if
          Git LFS is installed) and wrote .gitignore and .gitattributes at the
          project root (multi-project: the multi-project root). Check with
          git status. Never run git init inside a sub-project such as
          02_Main_Work/ (that creates a nested repository). If setup
          reported Git LFS as missing, install it, then run git lfs install.

      - step: 0.2
        name: Verify and fill central files
        agent: orchestrator-longform
        task: |
          setup.sh / setup.ps1 created these in the project root (if one is
          missing, copy it from its template):
          - 00_Status.md (from templates/status.md): fill initially
          - 00_Decisions.md (from templates/decisions.md): add research question
          - 00_Feedback_log.md (from templates/feedback_log.md): delete its example section, otherwise keep as is
      
      - step: 0.3
        name: Materials pre-check
        agent: orchestrator-longform
        checklist: checklists/precheck.md
        blocking: true
        note: Institutional guidelines must be in guidelines/ (in a multi-project main work, in ../00_Shared_Materials/guidelines/)
      
      - step: 0.4
        name: Reference manager check
        manual: true
        task: |
          - Reference manager collection created?
          - BibTeX export configured (Better BibTeX or equivalent)?
          - Auto-export to 02_Literature/literature.bib?
      
      - step: 0.5
        name: Style resolution
        agent: style-resolver
        input_directory: guidelines/
        output: styleguide.md
        blocking: true
        note: |
          Multi-project main work: the guidelines are in
          ../00_Shared_Materials/guidelines/, and ../00_Shared_Materials/styleguide.md
          normally exists already (extracted in the proposal). Only verify it (no open
          ❓ [content] items; ❓ [format] items may wait until Phase B);
          re-extract only when the guidelines change.
  
  # ===========================================================
  # Lead-in: Proposal
  # ===========================================================
  phase_01_proposal:
    directory: 01_Proposal/
    agents: [orchestrator-longform, writer, source-verifier]
    optional: true
    note: |
      Optional within long-form. In a multi-project main work, skip it: the
      accepted proposal is the read-only 01_Proposal_Reference/, and
      deviations from it go to 00_Decisions.md.
    
    goals:
      - Finalize research question (-> 00_Decisions.md)
      - Rough outline
      - Initial literature scan (< 10 sources)
      - Proposal text in 01_Proposal/proposal_final.md
    
    chat_structure:
      - One chat for first draft
      - One chat for revision after supervisor feedback
      - Closing handover.md confirms finished proposal
  
  # ===========================================================
  # Lead-in: Literature
  # ===========================================================
  phase_02_literature:
    directory: 02_Literature/
    agents: [orchestrator-longform, research, source-verifier]
    
    goals:
      - Complete literature inventory in reference manager, exported as literature.bib
      - For each source: extract in extracts/<citekey>.md (structured, with original quotes)
      - source-verifier has verified all extracts
      - Secondary citations identified, primary sources sourced where possible
    
    chat_structure:
      - One chat per source (or source group)
      - Closing handover.md lists all verified citekeys + status
  
  # ===========================================================
  # Main: Theory chapters
  # ===========================================================
  phase_03_theory:
    directory: 03_Theory_chapters/
    agents: [orchestrator-longform, research, writer, source-verifier, format-verifier]
    content_or_form_phase: A
    
    chat_structure:
      - One chat per chapter or chapter section (e.g., Ch. 2, Ch. 3, Ch. 4)
      - For longer chapters, split into sections (e.g., Ch. 3.1-3.2 / Ch. 3.3-3.4)
    
    per_chapter:
      - research-agent reads extracts from 02_Literature/extracts/
      - writer-agent drafts the text; citations as citekeys only if 00_Decisions.md records that they are rendered (pre-check, section 6)
      - orchestrator-longform runs scripts/verbatim_check.py on the chapter before every verification round and passes the report on
      - source-verifier: sentence-by-sentence verification incl. plagiarism check
      - format-verifier: critical format errors only
      - Feedback loop max 3
  
  # ===========================================================
  # Synthesis: Discussion + Conclusion
  # ===========================================================
  phase_06_discussion_conclusion:
    directory: 06_Discussion_Conclusion/
    agents: [orchestrator-longform, writer, source-verifier, format-verifier]
    content_or_form_phase: A
    
    order: [discussion, conclusion]
    
    chat_structure:
      - One chat for discussion
      - One chat for conclusion
  
  # ===========================================================
  # Final: Introduction
  # ===========================================================
  phase_07_introduction:
    directory: 07_Introduction/
    agents: [orchestrator-longform, writer, source-verifier, format-verifier]
    content_or_form_phase: A
    
    important: |
      Introduction is ALWAYS written LAST.
      It must reflect the actual content, not the planned content.
    
    chat_structure:
      - One chat for the full introduction (research question, objectives, structure)
  
  # ===========================================================
  # Cross-phase consistency check (runs during Phase A)
  # ===========================================================
  consistency_check:
    after_every_n_chapters: 2
    checklist: checklists/consistency.md
    agent: source-verifier
    scope: |
      Cross-chapter cross-references, terminology drift, self-plagiarism 
      between introduction and conclusion, argumentation coherence.
  
  # ===========================================================
  # Phase transition A -> B
  # ===========================================================
  phase_transition_a_to_b:
    agent: orchestrator-longform
    documentation: docs/phase_separation.md
    
    triggers:
      - All content chapters (incl. introduction) complete
      - Every chapter passed source verification with ✅
      - No outstanding content ⚠️, ❌ or ❓ items
      - Last 3 iterations were format-only (content has stabilized; in the last 3 commits the chapter files changed only in styleguide-governed items)
      - All ❓ items in styleguide.md clarified
    waiver: |
      The user may waive the criteria docs/phase_separation.md names under
      "Waiving a criterion" (chapters complete, for chapters the work will not
      contain; format-only iterations; styleguide questions), not the source
      verification or open content items; record which and why in 00_Decisions.md.
    
    actions:
      - 00_Status.md  ->  overall phase: B
      - writer-agent deactivated
      - format-verifier + build scripts active
      - Begin phase 08_Formal_Review
    
    rollback_b_to_a:
      when: |
        During Phase B a genuine content issue surfaces (e.g., a citation reveals
        a claim not actually supported by the source, or a format pass exposes a 
        missing argumentation step). Format-only fixes do NOT qualify for rollback.
      procedure:
        - Pause Phase B
        - Set 00_Status.md -> overall phase: A (rollback from B)
        - Reactivate writer-agent for the specific fix
        - Run scripts/verbatim_check.py on the chapter, then source-verifier on the affected passage
        - Document the rollback in 00_Decisions.md with rationale
        - Resume Phase B when the fix is verified
      note: |
        Rollbacks should be rare. If they happen more than twice, the original 
        A -> B transition was premature.
  
  # ===========================================================
  # Phase B: Formal review
  # ===========================================================
  phase_08_formal_review:
    directory: 08_Formal_Review/
    agents: [orchestrator-longform, format-verifier]
    content_or_form_phase: B
    
    chat_structure:
      - One chat per review pass (typically 3-6 passes for a bachelor thesis)
      - Closing handover.md lists found and resolved issues
    
    steps:
      - Title page as 08_Formal_Review/title_page.md, the first file of every export (docs/reference_management.md, "The title page")
      - Without citekeys, the reference list as 08_Formal_Review/bibliography.md, after the chapter files in every export, before an appendix (docs/reference_management.md, "The reference list"); where pagination.back_matter numbers the back matter unlike the main text, the file starts with the bookmark that starts it, and with citekeys it holds that bookmark, the heading and the empty refs div (same section)
      - Milestone export as DOCX into submissions/v_<tag>_<date>.docx with Pandoc, a new tag for each format round (v_r1_<date>.docx, v_r2_<date>.docx) (docs/reference_management.md; the steps below read this file); then scripts/docx_pagination.py on it with the values of styleguide.md pagination.front_matter, pagination.main_text and pagination.back_matter, and scripts/docx_postprocess.sh, only if document.hyphenation = automatic (orchestrator, every round: a new export carries neither the sections nor the flag)
      - Full styleguide check of that DOCX (format-verifier; report in format_reports/round_<n>.md)
      - scripts/bibliography_check.py (minus-test)
      - scripts/abbreviations_extract.py (derive list of abbreviations)
      - Consistency checks (page ranges, et-al., editions, pronouns)
  
  # ===========================================================
  # Submission
  # ===========================================================
  submission:
    manual: true
    task: |
      - Full-document final check: checklists/consistency.md, Part B (orchestrator-longform; B.6 is completed by the commit and tag below)
      - Final DOCX export to 08_Formal_Review/submissions/v_final_<date>.docx
      - Run scripts/docx_pagination.py on this v_final file with the values of styleguide.md pagination.front_matter, pagination.main_text and pagination.back_matter, and scripts/docx_postprocess.sh (only if document.hyphenation = automatic): a new export carries neither the sections nor the flag
      - Front matter numbered unlike the main text: only if styleguide.md pagination.front_matter is Roman, counted but not shown or none, or pagination.main_text starts at 1, the DOCX has it as a section of its own, set by scripts/docx_pagination.py after the export (docs/reference_management.md, "The title page"; without Python, the user sets it in Word as described there)
      - Back matter numbered unlike the main text: only if styleguide.md pagination.back_matter does not number it like the main text, the DOCX has it as a section of its own from the reference list on, set the same way; with Roman numerals that continue the front matter's count, check after updating the table of contents that its first number follows the front matter's last page (if a list or the table of contents fills more than one page, docs/scripts.md, --back-matter-start)
      - Update table of contents (Ctrl+A then F9)
      - Confirm the hyphenation setting matches styleguide.md (document.hyphenation)
      - Visual proofreading
      - Sign declaration of academic integrity
      - Commit the final state (git add -A then git commit -m "submission: final version", in a multi-project main work "main/submission: final version"), then tag it: git tag v_final_<date>
      - Mentally rehearse defending each sentence
